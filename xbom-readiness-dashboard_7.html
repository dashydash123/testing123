<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xBOM Readiness</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#F6F8FE; --panel:#FFFFFF; --panel-alt:#EEF3FB;
    --line:#E4EAF3; --line-soft:#EFF3F9;
    --ink:#0F172A; --ink2:#475569; --ink3:#8494AC;
    --brand:#2563EB; --brand2:#3B82F6; --brand-soft:#DBEAFE;
    --ok:#059669; --ok-soft:#ECFDF5; --ok-line:#A7F3D0;
    --warn:#D97706; --warn-soft:#FFFBEB; --warn-line:#FDE68A;
    --bad:#DC2626; --bad-soft:#FEF2F2; --bad-line:#FECACA;
    --violet:#7C3AED; --violet-soft:#EDE9FE;
    --pink:#DB2777; --pink-soft:#FCE7F3;
    --teal:#0D9488; --teal-soft:#CCFBF1;
    --na:#94A3B8; --na-soft:#F1F5F9;
    --sev-critical:#E11D48; --sev-high:#F97316; --sev-medium:#F59E0B; --sev-low:#64748B;
    --lic-permissive:#059669; --lic-weak:#0D9488; --lic-strong:#D97706;
    --lic-restricted:#DC2626; --lic-review:#7C3AED; --lic-undeclared:#94A3B8;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"DejaVu Sans Mono",monospace;
    --r:16px; --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 26px -16px rgba(15,23,42,.22);
    --shadow-lift:0 2px 4px rgba(15,23,42,.04), 0 18px 42px -20px rgba(15,23,42,.30);
    --shadow-glass:0 1px 1px rgba(255,255,255,.7) inset, 0 1px 2px rgba(15,23,42,.04),
      0 24px 48px -26px rgba(37,99,235,.30);
    --grid:#EDF1F8;
    --glass-bg:rgba(255,255,255,.66); --glass-line:rgba(255,255,255,.75);
  }
  @supports not (backdrop-filter: blur(1px)){
    :root{ --glass-bg:rgba(255,255,255,.94); }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.55;
    background:
      radial-gradient(1100px 760px at 6% -8%, rgba(96,165,250,.30) 0%, rgba(96,165,250,0) 60%),
      radial-gradient(900px 680px at 100% 0%, rgba(167,139,250,.26) 0%, rgba(167,139,250,0) 58%),
      radial-gradient(820px 620px at 18% 100%, rgba(45,212,191,.22) 0%, rgba(45,212,191,0) 55%),
      radial-gradient(760px 560px at 96% 92%, rgba(244,114,182,.18) 0%, rgba(244,114,182,0) 55%),
      linear-gradient(180deg, #F3F6FE 0%, #F6F8FC 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  .wrap{max-width:1340px;margin:0 auto;padding:18px 20px 56px}
  h1,h2,h3,h4{margin:0}

  /* masthead */
  .mast{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    padding:14px 18px;margin-bottom:6px;border-radius:18px;
    background:var(--glass-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-line);box-shadow:var(--shadow-glass);position:sticky;top:10px;z-index:40}
  .logo{display:flex;align-items:baseline;gap:7px;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .logo b{background:linear-gradient(120deg,#2563EB,#7C3AED 65%,#DB2777);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;
    color:var(--brand);text-transform:uppercase;margin-bottom:3px}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  button{font-family:var(--sans);font-size:12.5px;font-weight:600;background:rgba(255,255,255,.82);color:var(--ink2);
    border:1px solid var(--line);padding:8px 16px;border-radius:999px;cursor:pointer;
    backdrop-filter:blur(6px);transition:border-color .15s,color .15s,background .15s,box-shadow .15s,transform .15s}
  button:hover{border-color:var(--brand2);color:var(--brand);box-shadow:0 6px 16px -8px rgba(37,99,235,.45);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  button.primary{background:linear-gradient(135deg,#3B82F6,#2563EB 55%,#7C3AED);border-color:transparent;color:#fff;
    box-shadow:0 8px 20px -8px rgba(37,99,235,.55)}
  button.primary:hover{filter:brightness(1.06);color:#fff;box-shadow:0 10px 24px -8px rgba(37,99,235,.65)}
  button[disabled]{opacity:.45;cursor:not-allowed;border-color:var(--line);color:var(--ink3);background:#fff;box-shadow:none;transform:none}
  button.ghost{border:0;background:transparent;padding:4px 8px;font-size:11.5px;color:var(--brand)}

  /* intake */
  .lede{text-align:center;margin:18px 0 2px}
  .lede h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .lede p{color:var(--ink2);margin:6px 0 0}
  .slots{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:14px}
  .slot{border:1px solid var(--glass-line);border-radius:var(--r);padding:13px 14px;
    background:var(--glass-bg);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
    display:flex;flex-direction:column;gap:4px;min-height:132px;box-shadow:var(--shadow-glass);
    transition:border-color .15s,box-shadow .15s,background .15s,transform .15s}
  .slot.hot{border-color:var(--brand);background:rgba(219,234,254,.55);box-shadow:0 0 0 4px rgba(37,99,235,.12),var(--shadow-lift);transform:translateY(-1px)}
  .slot.filled{border-color:var(--ok-line);background:rgba(236,253,245,.62)}
  .slot .sk{font-size:15px;font-weight:800}
  .slot .sd{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-top:-4px}
  .slot .sf{font-size:12px;color:var(--ink2);line-height:1.65;margin-top:6px}
  .slot .sf em{font-style:normal;color:var(--ink);font-weight:600;word-break:break-all}
  .badge{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:2px 8px;
    border-radius:999px;background:var(--brand-soft);color:var(--brand);text-transform:uppercase}
  .slot .flag{font-size:11.5px;color:var(--warn);line-height:1.45;margin-top:4px}
  .slot .sa{display:flex;gap:8px;margin-top:auto;padding-top:10px}
  .slot .sa button{flex:1;padding:7px 8px;font-size:11.5px}
  .slot.filled .sa button{background:#fff}
  .err{margin-top:14px;border:1px solid var(--bad-line);background:var(--bad-soft);color:#991B1B;
    padding:11px 15px;border-radius:10px;font-size:12.5px}
  .notice{margin-top:14px;border:1px solid var(--warn-line);
    background:linear-gradient(120deg,rgba(254,243,199,.6),rgba(255,251,235,.5));backdrop-filter:blur(8px);
    color:#92400E;padding:11px 15px;border-radius:12px;font-size:12.5px}
  .notice b{color:#78350F}
  .note{margin:11px 0;border:1px solid rgba(219,234,254,.9);background:linear-gradient(120deg,rgba(219,234,254,.55),rgba(237,233,254,.4));
    backdrop-filter:blur(10px);color:var(--ink2);
    padding:11px 15px;border-radius:12px;font-size:12.5px}
  .note b{color:var(--ink)}
  .empty-state{margin-top:26px;border:1px dashed var(--line);border-radius:var(--r);padding:40px 24px;
    text-align:center;color:var(--ink3)}
  .empty-state b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

  /* sections + boxes */
  .sect{display:flex;align-items:center;gap:11px;margin:22px 0 8px}
  .sect h3{font-size:16px;font-weight:800;white-space:nowrap}
  .sect .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
  .tag-sbom{background:linear-gradient(120deg,#DBEAFE,#BFDBFE);color:#1D4ED8}
  .tag-aibom{background:linear-gradient(120deg,#EDE9FE,#DDD6FE);color:#6D28D9}
  .tag-cbom{background:linear-gradient(120deg,#CCFBF1,#99F6E4);color:#0F766E}
  .tag-all{background:linear-gradient(120deg,#F1F5F9,#E2E8F0);color:var(--ink2)}
  .sect .rule{flex:1;height:1px;background:var(--line)}
  .sect .hint{font-size:12px;color:var(--ink3)}
  .row{display:grid;gap:11px;margin-top:11px}
  .row.head{grid-template-columns:292px 1fr}
  .row.wide{grid-template-columns:1.55fr 1fr}
  .row.even{grid-template-columns:1fr 1fr}
  .box{border:1px solid var(--glass-line);background:var(--glass-bg);border-radius:var(--r);padding:15px 16px;
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:var(--shadow-glass);animation:rise .38s cubic-bezier(.22,.9,.3,1) both;min-width:0;position:relative;overflow:hidden;
    transition:box-shadow .22s ease,border-color .22s ease,transform .22s ease}
  .box::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;opacity:.95;
    background:linear-gradient(90deg,var(--brand) 0%,#818CF8 35%,#C084FC 70%,transparent 100%)}
  .box::after{content:'';position:absolute;z-index:-1;top:-40%;left:-10%;width:60%;height:80%;pointer-events:none;
    background:radial-gradient(closest-side, rgba(255,255,255,.55), rgba(255,255,255,0));
    opacity:.55;transform:rotate(-12deg)}
  .box:hover{box-shadow:0 1px 1px rgba(255,255,255,.8) inset, 0 28px 56px -24px rgba(37,99,235,.38);
    border-color:rgba(255,255,255,.9);transform:translateY(-2px)}
  .box.acc-lic::before{background:linear-gradient(90deg,var(--violet) 0%,#C4B5FD 40%,#F0ABFC 75%,transparent 100%)}
  .box.acc-sev::before{background:linear-gradient(90deg,var(--bad) 0%,#FB7185 40%,#FDBA74 75%,transparent 100%)}
  .box.acc-ok::before{background:linear-gradient(90deg,var(--ok) 0%,#34D399 40%,#5EEAD4 75%,transparent 100%)}
  .box.acc-warn::before{background:linear-gradient(90deg,var(--warn) 0%,#FBBF24 40%,#FDE68A 75%,transparent 100%)}
  .box.acc-teal::before{background:linear-gradient(90deg,var(--teal) 0%,#2DD4BF 40%,#67E8F9 75%,transparent 100%)}
  .box > h4{font-size:13.5px;font-weight:700;padding-top:2px;position:relative}
  .box > .sub{font-size:11.5px;color:var(--ink3);margin:2px 0 10px}
  .box .foot{margin-top:10px;font-size:10.5px;color:var(--ink3);border-top:1px solid var(--line-soft);padding-top:8px;line-height:1.5}
  .box .foot b{color:var(--ink2)}

  /* verdict + kpi */
  .verdict{text-align:center;display:flex;flex-direction:column;justify-content:center}
  .verdict svg{max-width:210px;margin:0 auto;display:block}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    padding:5px 14px;border-radius:999px;font-weight:600;margin:8px auto 0}
  .pill.g-bad{background:linear-gradient(120deg,#FEE2E2,#FECACA);color:#B91C1C;border:1px solid var(--bad-line);
    box-shadow:0 4px 14px -6px rgba(220,38,38,.45)}
  .pill.g-warn{background:linear-gradient(120deg,#FEF3C7,#FDE68A);color:#92400E;border:1px solid var(--warn-line);
    box-shadow:0 4px 14px -6px rgba(217,119,6,.4)}
  .pill.g-ok{background:linear-gradient(120deg,#D1FAE5,#A7F3D0);color:#065F46;border:1px solid var(--ok-line);
    box-shadow:0 4px 14px -6px rgba(5,150,105,.4)}
  .verdict .meta{font-size:11px;color:var(--ink3);margin-top:9px;line-height:1.7}
  .kpis{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(162px,1fr))}
  .kpi{border:1px solid var(--glass-line);background:var(--glass-bg);border-radius:14px;padding:11px 13px 11px 16px;
    backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
    box-shadow:var(--shadow-glass);display:flex;flex-direction:column;gap:2px;animation:rise .34s ease both;
    position:relative;overflow:hidden;transition:box-shadow .2s ease,transform .2s ease}
  .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line);
    box-shadow:0 0 12px 1px transparent;transition:box-shadow .2s ease}
  .kpi:hover{box-shadow:0 1px 1px rgba(255,255,255,.8) inset,0 20px 40px -20px rgba(37,99,235,.35);transform:translateY(-2px)}
  .kpi.tone-ok::before{background:linear-gradient(180deg,#34D399,#059669);box-shadow:0 0 14px 1px rgba(5,150,105,.55)}
  .kpi.tone-warn::before{background:linear-gradient(180deg,#FBBF24,#D97706);box-shadow:0 0 14px 1px rgba(217,119,6,.5)}
  .kpi.tone-bad::before{background:linear-gradient(180deg,#FB7185,#DC2626);box-shadow:0 0 14px 1px rgba(220,38,38,.5)}
  .kpi.tone-brand::before{background:linear-gradient(180deg,#60A5FA,#2563EB);box-shadow:0 0 14px 1px rgba(37,99,235,.5)}
  .kpi.tone-bad{background:linear-gradient(160deg,rgba(255,241,242,.75) 0%,var(--glass-bg) 55%)}
  .kpi.tone-ok{background:linear-gradient(160deg,rgba(236,253,245,.8) 0%,var(--glass-bg) 55%)}
  .kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .kpi .v{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:11.5px;color:var(--ink2)}
  .t-ok{color:var(--ok)} .t-warn{color:var(--warn)} .t-bad{color:var(--bad)} .t-brand{color:var(--brand)}
  .bullet{position:relative;height:8px;border-radius:999px;margin-top:7px;overflow:hidden;
    background:linear-gradient(90deg,var(--bad-soft) 0 50%,var(--warn-soft) 50% 90%,var(--ok-soft) 90% 100%)}
  .bullet i{position:absolute;left:0;top:2px;height:4px;border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.3,1)}
  .bullet u{position:absolute;top:-1px;width:2px;height:10px;background:var(--ink);opacity:.55;text-decoration:none}

  /* scorecard */
  .matrix{display:grid;gap:6px}
  .mrow{display:grid;grid-template-columns:92px repeat(5,1fr);gap:6px}
  .mrow .rl{display:flex;align-items:center;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em}
  .cell{border-radius:10px;padding:9px 10px;min-height:58px;display:flex;flex-direction:column;
    justify-content:space-between;border:1px solid transparent;transition:transform .15s ease}
  .cell:hover{transform:translateY(-1px)}
  .cell .cn{font-size:11px;line-height:1.3;font-weight:600}
  .cell .cv{font-size:16px;font-weight:800;align-self:flex-end;font-variant-numeric:tabular-nums}
  .cell.na{background:var(--na-soft);border-color:var(--line);}
  .cell.na .cn,.cell.na .cv{color:var(--na)}
  .cell.na .cv{font-size:11px;font-family:var(--mono);letter-spacing:.1em}
  .cell.void{background:repeating-linear-gradient(135deg,var(--surface) 0 8px,#EEF2F9 8px 16px);
    border:1px dashed var(--line);align-items:center;justify-content:center}
  .cell.void span{color:var(--ink3);font-size:11px}

  /* score strip */
  .score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border:1px solid var(--glass-line);
    border-left-width:4px;background:var(--glass-bg);backdrop-filter:blur(16px) saturate(170%);
    border-radius:14px;padding:10px 15px;margin-top:10px;box-shadow:var(--shadow-glass)}
  .score b{font-size:21px;font-weight:800;letter-spacing:-.03em}
  .score.s-pass{border-left-color:var(--ok);background:linear-gradient(120deg,rgba(209,250,229,.55),var(--glass-bg) 60%)}
  .score.s-warn{border-left-color:var(--warn);background:linear-gradient(120deg,rgba(254,243,199,.55),var(--glass-bg) 60%)}
  .score.s-fail{border-left-color:var(--bad);background:linear-gradient(120deg,rgba(254,226,226,.55),var(--glass-bg) 60%)}
  .score.s-pass b{color:var(--ok)} .score.s-warn b{color:var(--warn)} .score.s-fail b{color:var(--bad)}
  .score span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .score em{font-style:normal;font-size:12.5px;color:var(--ink2);margin-left:auto;text-align:right}
  .score em u{text-decoration:none;font-weight:650;color:var(--ink)}

  /* shared small parts */
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
  .stat{border:1px solid rgba(226,232,244,.9);border-radius:12px;padding:10px 12px;
    background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(246,248,254,.7))}
  .stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
  .stat span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px}
  .legend div{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2)}
  .legend s{width:9px;height:9px;border-radius:3px;flex:0 0 9px;text-decoration:none}
  .none-box{border:1px dashed var(--line);border-radius:10px;padding:22px;color:var(--ink3);font-size:12.5px;text-align:center}
  .none-box code{background:var(--surface);padding:1px 5px;border-radius:4px}

  /* pareto */
  .pareto .prow{display:grid;grid-template-columns:minmax(0,150px) 1fr 40px 46px;gap:10px;align-items:center;
    margin-bottom:6px;font-size:11.5px}
  .pareto .plab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:7px}
  .pareto .plab s{width:8px;height:8px;border-radius:2px;flex:0 0 8px;text-decoration:none}
  .pareto .ptrk{height:16px;background:var(--surface);border-radius:5px;overflow:hidden;min-width:0;position:relative}
  .pareto .ptrk i{display:block;height:100%;border-radius:5px;transition:width .6s ease}
  .pareto .pn{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .pareto .pc{text-align:right;font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .pareto .cum{position:absolute;top:0;bottom:0;width:2px;background:var(--brand);opacity:.45}

  /* upset-style gap combinations */
  .upset{display:grid;gap:6px}
  .uprow{display:grid;gap:8px;align-items:center}
  .updots{display:flex;gap:9px;align-items:center}
  .updots i{width:11px;height:11px;border-radius:50%;background:#E2E8F0;flex:0 0 11px}
  .updots i.on{background:var(--ink)}
  .updots .bar{position:absolute;height:2px;background:var(--ink);opacity:.35}
  .upbar{height:15px;background:var(--surface);border-radius:5px;overflow:hidden;min-width:0}
  .upbar i{display:block;height:100%;border-radius:5px}
  .upn{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:12px}
  .upkey{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:10.5px;color:var(--ink3)}
  .upkey b{color:var(--ink2);font-weight:600}

  /* matrices */
  .grid-mat{display:grid;gap:5px;align-items:stretch}
  .grid-mat .ch{font-size:10.5px;color:var(--ink3);display:flex;align-items:flex-end;gap:5px;padding-bottom:4px;
    line-height:1.25;word-break:break-word}
  .grid-mat .ch.tot{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;justify-content:flex-end}
  .grid-mat .rh{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;min-width:0;
    border-radius:6px;padding:0 4px}
  .grid-mat .rh s{width:8px;height:8px;border-radius:2px;flex:0 0 8px;text-decoration:none}
  .grid-mat .rh:hover{background:var(--surface)}
  .grid-mat .cc{border-radius:8px;min-height:40px;display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--line-soft);font-weight:800;font-size:14px;color:var(--ink3)}
  .grid-mat .cc.none{background:repeating-linear-gradient(45deg,#F7F9FD 0 4px,#fff 4px 8px)}
  .grid-mat .cc.on{border-color:transparent;color:#fff;font-family:var(--mono);font-size:11px}
  .grid-mat .cc.conflict{border-color:var(--bad)}
  .grid-mat .bt{display:flex;align-items:center;justify-content:flex-end;font-weight:800;font-size:15px}

  /* cve exposure */
  .cvehead,.cverow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.1fr) minmax(0,1fr) 32px minmax(0,1fr);
    gap:9px;align-items:center}
  .cvehead{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
    padding-bottom:7px;border-bottom:1px solid var(--line-soft)}
  .cverow{padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12px;cursor:pointer}
  .cverow:hover{background:var(--surface)}
  .cverow .cid{font-family:var(--mono);font-size:11px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cverow .ctarget{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .cverow .cbar{height:9px;border-radius:999px;background:#EEF2F8;overflow:hidden;min-width:0}
  .cverow .cbar i{display:block;height:100%;border-radius:999px}
  .cverow .cscore{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
  .cverow .cstate{font-size:10.5px;padding:3px 8px;border-radius:999px;text-align:center;font-weight:600;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cverow .cstate.ok{background:var(--ok-soft);color:var(--ok)}
  .cverow .cstate.open{background:var(--bad-soft);color:var(--bad)}

  /* issue register */
  .reg{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .reghead{padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .reghead h4{font-size:13.5px}
  .reghead .cnt{color:var(--ink3);font-weight:500;font-size:12px}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px}
  .search input{font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;width:220px;color:var(--ink)}
  .search input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  .fchip{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;background:var(--brand-soft);
    color:var(--brand);padding:4px 6px 4px 12px;border-radius:999px}
  .fchip b{font-weight:700}
  .fchip button{border:0;background:#fff;color:var(--brand);border-radius:999px;width:20px;height:20px;padding:0;line-height:1;font-size:11px}
  .grp{border-bottom:1px solid var(--line-soft)}
  .grp:last-child{border-bottom:0}
  .grph{display:grid;grid-template-columns:22px 84px 1fr auto;gap:12px;align-items:center;padding:9px 16px;
    cursor:pointer;background:#fff;transition:background .15s}
  .grph:hover{background:var(--surface)}
  .grph .caret{color:var(--ink3);font-size:11px;transition:transform .2s}
  .grp.open .grph .caret{transform:rotate(90deg)}
  .grph .sev{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    padding:3px 8px;border-radius:999px;text-align:center}
  .grph .gt{font-weight:650;font-size:12.5px}
  .grph .gt em{display:block;font-style:normal;font-size:11px;color:var(--ink3);font-weight:400;margin-top:1px}
  .grph .gn{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}
  .grph .gn b{color:var(--ink);font-size:14px;font-family:var(--sans)}
  .grpb{display:none;padding:0 18px 12px 136px;background:var(--surface)}
  .grp.open .grpb{display:block}
  .item{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--line);font-size:12px}
  .item:last-child{border-bottom:0}
  .item .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .dt{color:var(--ink2);font-size:11.5px}
  .sv-critical{background:var(--bad-soft);color:var(--bad)}
  .sv-high{background:#FFF1E9;color:var(--sev-high)}
  .sv-medium{background:var(--warn-soft);color:var(--warn)}
  .sv-low{background:#F1F5F9;color:var(--sev-low)}
  .more{padding:12px 18px;text-align:center;border-top:1px solid var(--line-soft);background:var(--surface)}
  .empty{padding:22px 18px;color:var(--ink3)}

  /* gap combination labels */
  .uplab{font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

  /* remediation plan */
  .acthead,.act{display:grid;grid-template-columns:26px minmax(0,1fr) 74px minmax(0,220px) 78px;gap:12px;align-items:center}
  .acthead{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
    padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
  .act{padding:9px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .15s}
  .act:hover{background:var(--surface)}
  .act .rank{font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:center}
  .act .what b{font-size:12.5px;font-weight:650;display:block}
  .act .what em{font-style:normal;font-size:11px;color:var(--ink3);display:block;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .act .eff{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
  .act .clears{position:relative;height:15px;background:var(--surface);border-radius:5px;overflow:hidden;min-width:0}
  .act .clears i{position:absolute;left:0;top:0;height:100%;border-radius:5px;opacity:.35}
  .act .clears u{position:absolute;left:0;top:0;height:100%;border-radius:5px;background:var(--bad);text-decoration:none}
  .act .cn2{text-align:right;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
  .act .cn2 em{display:block;font-style:normal;font-size:10px;font-weight:500;color:var(--ink3)}
  .lever{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;border:1px solid var(--brand-soft);
    background:#F5F9FF;border-radius:9px;padding:9px 13px;margin-bottom:11px;font-size:12.5px;color:var(--ink2)}
  .lever b{font-size:20px;font-weight:800;color:var(--brand);letter-spacing:-.02em}

  /* provenance */
  .provwrap{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
  .prov{border:1px solid rgba(226,232,244,.9);border-radius:12px;padding:10px 12px;
    background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(246,248,254,.7))}
  .provh{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .provh b{font-family:var(--mono);font-size:11px;letter-spacing:.12em}
  .provh span{font-size:11px;color:var(--ink3)}
  .provh em{margin-left:auto;font-style:normal;font-weight:800;font-size:16px}
  .provrow{display:grid;grid-template-columns:16px minmax(0,105px) minmax(0,1fr);gap:8px;align-items:baseline;
    font-size:11.5px;padding:3px 0}
  .provrow s{text-decoration:none;font-size:11px;font-weight:700}
  .provrow s.y{color:var(--ok)} .provrow s.w{color:var(--warn)} .provrow s.n{color:var(--bad)}
  .provrow .pk{color:var(--ink2)}
  .provrow .pv{color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* severity chips folded into the register header */
  .sevchips{display:flex;gap:7px;flex-wrap:wrap}
  .sevchip{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:999px;
    padding:4px 11px;font-size:11.5px;cursor:pointer;background:#fff;transition:border-color .15s}
  .sevchip:hover{border-color:var(--brand2)}
  .sevchip.sel{outline:2px solid var(--brand);outline-offset:1px}
  .sevchip b{font-weight:800;font-size:13px}
  .sevchip span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

  /* mandated field conformance */
  .mconf{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .mconf b{font-size:26px;font-weight:800;letter-spacing:-.03em}
  .mconf span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .mconf em{font-style:normal;font-size:12.5px;color:var(--ink2);margin-left:auto}
  .mstrip{display:grid;gap:6px}
  .mrow2{display:grid;grid-template-columns:minmax(0,182px) minmax(0,1fr) 46px;gap:11px;align-items:center;font-size:12px}
  .mrow2 .mk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
  .mrow2 .mtrk{height:15px;border-radius:5px;background:var(--surface);overflow:hidden;display:flex;min-width:0}
  .mrow2 .mtrk.na{background:repeating-linear-gradient(45deg,#F7F9FD 0 4px,#fff 4px 8px)}
  .mrow2 .mtrk i{display:block;height:100%;background:var(--ok);opacity:.8}
  .mrow2 .mtrk u{display:block;height:100%;text-decoration:none}
  .mrow2 .mv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- board summary print view ---------- */
  @media print{
    @page{ margin:14mm; }
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .mast .controls, .lede, .slots, #err, #notice, .reg, .search, .sevchips, .fchip, .more,
    .box.dimmed, #tip { display:none !important; }
    .sect{margin:16px 0 8px;break-after:avoid}
    .box, .kpi, .score, .prov{box-shadow:none;break-inside:avoid;backdrop-filter:none !important;
      -webkit-backdrop-filter:none !important;background:#fff !important}
    .box::after{display:none}
    .mast{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;background:#fff !important;
      box-shadow:none;position:static}
    .row{break-inside:avoid}
    .row.head{grid-template-columns:250px 1fr}
    .mast{margin-bottom:8px}
    .mast::after{content:"Board summary · generated from the loaded BOM documents";
      font-size:10px;color:#8494AC;margin-left:auto}
    a[href]::after{content:none}
  }

  .grid-mat .rh .nolin{margin-left:auto;font-size:8.5px;font-family:var(--mono);letter-spacing:.08em;
    text-transform:uppercase;color:var(--bad);background:var(--bad-soft);padding:2px 6px;border-radius:999px;font-weight:700}

  /* projection bars */
  .pjhead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .pjhead b{font-size:23px;font-weight:800;letter-spacing:-.03em}
  .pjhead span{font-size:17px;color:var(--ink3)}
  .pjhead em{font-style:normal;font-size:11.5px;color:var(--ink3);margin-left:auto}
  .pj{display:grid;gap:5px}
  .pjrow{display:grid;grid-template-columns:minmax(0,168px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:11.5px}
  .pjrow.flat{opacity:.5}
  .pjl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
  .pjt{position:relative;height:14px;border-radius:5px;background:var(--surface);overflow:hidden;display:flex;min-width:0}
  .pjt i{display:block;height:100%}
  .pjt u{display:block;height:100%;text-decoration:none;opacity:.32;
    background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 3px,transparent 3px 6px)}
  .pjt s{position:absolute;top:-1px;width:2px;height:16px;background:var(--ink);opacity:.3;text-decoration:none}
  .pjv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink3)}
  .pjv b{font-weight:800} .pjv em{font-style:normal}

  /* offender list */
  .ofhead,.ofr{display:grid;grid-template-columns:24px minmax(0,1fr) 132px minmax(0,150px) 72px;gap:11px;align-items:center}
  .ofhead{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
    padding-bottom:7px;border-bottom:1px solid var(--line-soft)}
  .ofr{padding:9px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .15s}
  .ofr:hover{background:var(--surface)}
  .ofrank{font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:center}
  .ofn b{font-size:12.5px;font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ofn em{font-style:normal;font-size:10.5px;color:var(--ink3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .oflic{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);min-width:0}
  .oflic s{width:8px;height:8px;border-radius:2px;flex:0 0 8px;text-decoration:none}
  .oftrk{position:relative;height:14px;border-radius:5px;background:var(--surface);overflow:hidden;min-width:0}
  .oftrk i,.oftrk u{position:absolute;left:0;top:0;height:100%;border-radius:5px;text-decoration:none}
  .oftrk u{background:var(--bad)}
  .ofn2{text-align:right;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .ofn2 em{display:block;font-style:normal;font-size:9.5px;font-weight:500;color:var(--ink3)}

  /* supply-chain posture */
  .pst{margin-bottom:14px}
  .pst:last-child{margin-bottom:0}
  .psth{display:flex;align-items:baseline;font-size:12px;font-weight:650;margin-bottom:6px}
  .psth em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .pstb{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface)}
  .pstb i{display:block;height:100%}
  .pstk{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:7px;font-size:11px;color:var(--ink2)}
  .pstk span{display:flex;align-items:center;gap:6px}
  .pstk s{width:9px;height:9px;border-radius:3px;text-decoration:none}
  .pstk b{font-weight:700}

  /* migration effort */
  .efhead,.efr{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,140px) 76px;gap:11px;align-items:center}
  .efhead{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
    padding-bottom:7px;border-bottom:1px solid var(--line-soft)}
  .efr{padding:9px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12px}
  .efr:last-of-type{border-bottom:0}
  .efr:hover{background:var(--surface)}
  .efl{display:flex;align-items:flex-start;gap:7px;min-width:0;white-space:normal;line-height:1.32}
  .efl s{width:9px;height:9px;border-radius:3px;flex:0 0 9px;text-decoration:none;margin-top:4px}
  .efa{text-align:right;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .eft{height:13px;border-radius:5px;background:var(--surface);overflow:hidden;min-width:0}
  .eft i{display:block;height:100%;border-radius:5px}
  .efs{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .efs em{display:block;font-style:normal;font-size:9.5px;font-weight:500;color:var(--ink3)}

  /* ---------- NEW SBOM FIGURES ---------- */

  /* evidence mosaic — one tile per component, CAST-style */
  .mosaic{display:flex;flex-wrap:wrap;gap:4px;padding:13px;
    background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(241,245,253,.65));
    border:1px solid rgba(226,232,244,.9);border-radius:12px;align-content:flex-start;
    box-shadow:inset 0 1px 3px rgba(15,23,42,.05)}
  .mosaic i{flex:0 0 auto;cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease;animation:pop .3s ease both}
  .mosaic i:hover{transform:scale(1.35);box-shadow:0 4px 10px -2px rgba(15,23,42,.35);z-index:5;position:relative}
  @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  .mosleg{display:flex;flex-wrap:wrap;gap:7px 15px;margin-top:11px;font-size:11.5px;color:var(--ink2)}
  .mosleg span{display:flex;align-items:center;gap:7px}
  .mosleg s{width:11px;height:11px;border-radius:3px;text-decoration:none;flex:0 0 11px}
  .mosleg b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

  /* donut + side stats */
  .dwrap{display:grid;grid-template-columns:minmax(0,196px) minmax(0,1fr);gap:16px;align-items:center}
  .dwrap svg{width:100%;height:auto}
  .dlegend{display:grid;gap:7px;min-width:0}
  .dleg{display:grid;grid-template-columns:11px minmax(0,1fr) 40px 46px;gap:9px;align-items:center;
    font-size:12px;padding:5px 7px;border-radius:7px;cursor:pointer;transition:background .15s}
  .dleg:hover{background:var(--surface)}
  .dleg s{width:11px;height:11px;border-radius:3px;text-decoration:none}
  .dleg .dl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
  .dleg .dn{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .dleg .dp{text-align:right;font-family:var(--mono);font-size:10px;color:var(--ink3)}

  /* segmented ratio bars (fix / triage progress) */
  .segs{display:grid;gap:11px;margin-top:13px}
  .seg .sh{display:flex;align-items:baseline;gap:8px;font-size:12px;margin-bottom:5px}
  .seg .sh b{font-weight:650}
  .seg .sh em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
  .seg .st{height:9px;border-radius:999px;background:#EDF1F8;overflow:hidden;display:flex}
  .seg .st i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.3,1)}

  /* inventory table */
  .invwrap{border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
  .invtools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
  .invtools input{font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;flex:1;min-width:150px;color:var(--ink)}
  .invtools input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  .invtools .chip{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
  .invtools .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .invscroll{max-height:430px;overflow:auto}
  table.inv{width:100%;border-collapse:collapse;font-size:12px}
  table.inv thead th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:left;
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
    padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.inv tbody td{padding:9px 11px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  table.inv tbody tr{cursor:pointer;transition:background .13s}
  table.inv tbody tr:hover{background:var(--surface)}
  table.inv .nmc{font-weight:650;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.inv .nmc em{display:block;font-style:normal;font-size:10px;color:var(--ink3);font-family:var(--mono)}
  table.inv .mono{font-family:var(--mono);font-size:11px;color:var(--ink2)}
  table.inv .miss{color:var(--warn);font-family:var(--mono);font-size:10.5px}
  .lchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 9px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line);white-space:nowrap;max-width:100%;
    overflow:hidden;text-overflow:ellipsis}
  .lchip s{width:7px;height:7px;border-radius:2px;flex:0 0 7px;text-decoration:none}
  .schip{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
    padding:3px 8px;border-radius:999px}
  .okdot{color:var(--ink3);font-size:11px}
  .evbar{display:flex;gap:2px}
  .evbar s{width:8px;height:13px;border-radius:2px;text-decoration:none;background:#E2E8F0}
  .evbar s.on{background:var(--ok)}

  /* exposure meter */
  .expo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .expo div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
  .expo b{display:block;font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.25;
    font-variant-numeric:tabular-nums}
  .expo span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink3)}
  .expo em{display:block;font-style:normal;font-size:10.5px;color:var(--ink2);margin-top:3px}

  /* callout strip under a figure */
  .insight{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 13px;border-radius:9px;
    background:linear-gradient(90deg,#F5F9FF 0%,#FBFCFE 100%);border:1px solid var(--brand-soft);font-size:12px;color:var(--ink2)}
  .insight s{flex:0 0 auto;text-decoration:none;font-weight:800;color:var(--brand);font-family:var(--mono);font-size:11px}
  .insight b{color:var(--ink)}
  .insight.warnish{background:linear-gradient(90deg,#FFFBF0 0%,#FEFDFA 100%);border-color:var(--warn-line)}
  .insight.warnish s{color:var(--warn)}
  .insight.badish{background:linear-gradient(90deg,#FFF6F6 0%,#FFFBFB 100%);border-color:var(--bad-line)}
  .insight.badish s{color:var(--bad)}

  /* treemap */
  .tm rect{transition:opacity .15s ease}
  .tm g:hover rect.tile{opacity:.82}

  /* obligation sunburst */
  .sunburst{display:block;max-width:460px;margin:4px auto 0}

<body>
<div class="wrap">
  <div class="mast">
    <div>
      <div class="eyebrow">Open source program office · BOM analysis</div>
      <div class="logo"><b>xBOM</b><span>Readiness</span></div>
    </div>
    <div class="controls">
      <button id="clear">Reset</button>
      <button id="board" disabled>Board summary</button>
      <button id="export" disabled>Export report</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
  </div>

  <div class="lede">
    <h2>Upload one document per BOM type</h2>
    <p>CycloneDX 1.4–1.7 and SPDX 2.2 / 2.3 / 3.0 are detected automatically.</p>
  </div>

  <div class="slots">
    <div class="slot" data-slot="sbom"></div>
    <div class="slot" data-slot="aibom"></div>
    <div class="slot" data-slot="cbom"></div>
  </div>
  <div id="err"></div>
  <div id="notice"></div>
  <div id="out"></div>
</div>
<script>
/* ============================================================
   1 · INTAKE — normalise real scanner output into one model
   ------------------------------------------------------------
   Written against actual SCANOSS and internal-generator output,
   which differ from the spec examples in ways that matter:
     · version is often the literal string "Unknown"
     · component name is the purl itself
     · licences repeat once per acknowledgement (declared/concluded)
     · purl types are hostnames (github.com, www.nuget.org)
     · vulnerabilities target a purl, not a bom-ref
     · dependencies may be a flat ref list with no edges
     · CBOMs may contain only algorithms, no keys/certs/protocols
   ============================================================ */
const NOW = new Date();
const PLACEHOLDER = /^(unknown|noassertion|none|n\/?a|null|undefined|-|\?)$/i;
const clean = v => { const s = (v == null ? '' : String(v)).trim(); return (!s || PLACEHOLDER.test(s)) ? '' : s; };

function detectFormat(d){
  if (d.bomFormat === 'CycloneDX') return 'cdx';
  if (typeof d.spdxVersion === 'string') return 'spdx2';
  if (d['@graph'] || d['@context']) return 'spdx3';
  throw new Error('Unrecognised document — expected CycloneDX (bomFormat) or SPDX (spdxVersion / @graph).');
}

/* --- purl handling: registries publish messy types in the wild --- */
const ECO_ALIAS = { 'github.com':'github', 'www.github.com':'github', 'gitlab.com':'gitlab',
  'www.npmjs.com':'npm', 'npmjs.com':'npm', 'registry.npmjs.org':'npm',
  'www.nuget.org':'nuget', 'nuget.org':'nuget', 'pypi.org':'pypi', 'files.pythonhosted.org':'pypi',
  'repo1.maven.org':'maven', 'search.maven.org':'maven', 'crates.io':'cargo', 'rubygems.org':'gem',
  'proxy.golang.org':'golang', 'pkg.go.dev':'golang' };
function purlParts(purl){
  if (!purl) return null;
  let t = String(purl).trim().replace(/^pkg:\/\//i,'').replace(/^pkg:/i,'');
  t = t.split('?')[0].split('#')[0];
  const segs = t.split('/').filter(Boolean);
  if (!segs.length) return null;
  const rawType = segs[0].toLowerCase().replace(/^www\./,'');
  return { type: ECO_ALIAS[segs[0].toLowerCase()] || rawType, segs: segs.slice(1), raw: purl };
}
function displayName(name, purl){
  const n = clean(name);
  if (n && !/^pkg:/i.test(n)) return n;
  const p = purlParts(purl || n);
  if (p && p.segs.length) return p.segs[p.segs.length-1].replace(/@.*$/,'');
  return n || clean(purl) || 'unnamed';
}

/* --- CycloneDX --------------------------------------------------- */
const CDX_TYPE = { library:'library', framework:'framework', application:'application', container:'container',
  'operating-system':'os', file:'file', device:'file', firmware:'file', platform:'application',
  'machine-learning-model':'model', data:'dataset', 'cryptographic-asset':'crypto' };

function cdxLicences(c){
  /* scanners emit the same licence once per acknowledgement — collapse them */
  const seen = new Map();
  (c.licenses || []).forEach(l => {
    const id = clean((l.license && (l.license.id || l.license.name)) || l.expression);
    if (!id) return;
    const ack = (l.license && l.license.acknowledgement) || '';
    if (!seen.has(id) || ack === 'concluded') seen.set(id, ack);
  });
  return [...seen.keys()];
}
/* SCANOSS emits the same licence twice, once declared and once concluded. Collapsing
   them loses the one signal that says whether the scanner agreed with upstream, so
   the split is kept alongside the collapsed list. */
function cdxLicenceAck(c){
  const bucket = { declared:new Set(), concluded:new Set(), unqualified:new Set() };
  (c.licenses || []).forEach(l => {
    const id = clean((l.license && (l.license.id || l.license.name)) || l.expression);
    if (!id) return;
    const ack = String((l.license && l.license.acknowledgement) || '').toLowerCase();
    if (ack === 'declared') bucket.declared.add(id);
    else if (ack === 'concluded') bucket.concluded.add(id);
    else bucket.unqualified.add(id);
  });
  const dec = [...bucket.declared], con = [...bucket.concluded], un = [...bucket.unqualified];
  const both = dec.length && con.length;
  const same = both && dec.slice().sort().join('|') === con.slice().sort().join('|');
  return { declared:dec, concluded:con, unqualified:un,
    /* state: agreed · divergent · declared-only · concluded-only · none */
    state: both ? (same ? 'agreed' : 'divergent')
      : dec.length ? 'declared-only' : con.length ? 'concluded-only'
      : un.length ? 'unqualified' : 'none' };
}

function cdxEvidence(c){
  const occ = ((c.evidence || {}).occurrences || []).map(o => ({ location:o.location || '', line:o.line }));
  return occ.length ? occ : null;
}

function fromCycloneDX(d){
  const flat = (list, out=[]) => { (list||[]).forEach(c => { out.push(c); if (c.components) flat(c.components,out); }); return out; };
  /* The document subject lives in metadata.component, not components[]. For an
     SBOM that subject is the application being described and its own components
     are listed separately, so including it would double-count. For an AIBOM it is
     the model itself — HuggingFace-style generators put the model and its entire
     modelCard there — and dropping it discards the thing the document is about.
     So: include the subject only when it is an asset type the analysis scores and
     it is not already present in components[]. */
  const listed = flat(d.components);
  const subj = (d.metadata || {}).component;
  const subjType = subj ? (CDX_TYPE[subj.type] || 'other') : null;
  const subjKey = subj ? (subj['bom-ref'] || clean(subj.purl) || clean(subj.name)) : null;
  const alreadyListed = subjKey && listed.some(c => (c['bom-ref'] || clean(c.purl) || clean(c.name)) === subjKey);
  const SUBJECT_TYPES = new Set(['model','dataset']);
  const raw = (subj && SUBJECT_TYPES.has(subjType) && !alreadyListed) ? [subj, ...listed] : listed;
  const components = raw.map(c => {
    const purl = clean(c.purl);
    return {
      id: c['bom-ref'] || purl || c.name,
      name: displayName(c.name, purl),
      raw: clean(c.name),
      version: clean(c.version),
      type: CDX_TYPE[c.type] || 'other',
      purl,
      eco: purl ? (purlParts(purl) || {}).type || 'unresolved' : 'unresolved',
      licenses: cdxLicences(c),
      ack: cdxLicenceAck(c),
      supplier: clean((c.supplier && c.supplier.name) || c.author || c.publisher),
      refs: (c.externalReferences||[]).map(r => ({ type:r.type, url:r.url })),
      model: c.modelCard || null,
      tags: Array.isArray(c.tags) ? c.tags.map(String) : [],
      dataset: (c.data||[])[0] || null,
      crypto: c.cryptoProperties || null,
      evidence: cdxEvidence(c),
      hash: !!(c.hashes && c.hashes.length),
      uid: purl || clean(c.cpe) || clean((c.swid||{}).tagId),
      eol: clean(((c.properties||[]).find(x => /eol|end.?of.?life|eos|support.?end/i.test(x.name||'')) || {}).value),
      props: Object.fromEntries((c.properties||[]).map(p => [p.name, p.value]))
    };
  });
  const deps = {};
  let edges = 0;
  (d.dependencies||[]).forEach(x => { const on = x.dependsOn || []; deps[x.ref] = on; edges += on.length; });
  /* A model card names its training data in modelParameters.datasets. That is a
     lineage edge the document states outright, and AIBOM generators routinely use
     it instead of the dependencies block — so read it as one rather than
     reporting "no training data linked" against a document that says otherwise. */
  components.forEach(c => {
    const ds = (((c.model || {}).modelParameters || {}).datasets || [])
      .map(x => x.ref || (x.contents && x.contents.url) || x.name).filter(Boolean).map(String);
    if (!ds.length) return;
    const known = new Set(deps[c.id] || []);
    const added = ds.filter(r => !known.has(r));
    if (added.length){ deps[c.id] = (deps[c.id] || []).concat(added); edges += added.length; }
  });
  const root = (d.metadata && d.metadata.component && (d.metadata.component['bom-ref'] || clean(d.metadata.component.name))) || null;
  const md = d.metadata || {};
  const toolName = (((md.tools||{}).components||[])[0]||{}).name ||
    (Array.isArray(md.tools) ? (md.tools[0]||{}).name : '') || (md.authors||[])[0] && (md.authors||[])[0].name || '';
  return {
    format:'cdx', label:'CycloneDX ' + (d.specVersion || ''), root,
    prov: { spec:'CycloneDX ' + (d.specVersion||'?'), timestamp:clean(md.timestamp), tool:clean(toolName),
      author:clean(((md.authors||[])[0]||{}).name) || clean(((md.supplier||{}).name)),
      serial:clean(d.serialNumber), signature:!!d.signature,
      rootName:(md.component && clean(md.component.name)) || '', rootVersion:(md.component && clean(md.component.version)) || '',
      lifecycle:((md.lifecycles||[])[0]||{}).phase || '' },
    hasVulnBlock: Array.isArray(d.vulnerabilities),
    subject: (d.metadata && d.metadata.component && displayName(d.metadata.component.name, d.metadata.component.purl)) || 'untitled',
    graph: edges > 0, components, deps,
    props: Object.fromEntries(((d.metadata||{}).properties||[]).map(p => [p.name, p.value])),
    tool: (((d.metadata||{}).tools||{}).components||[])[0] || ((d.metadata||{}).authors||[])[0] || null,
    vulns: (d.vulnerabilities||[]).map(v => {
      const vp = Object.fromEntries((v.properties||[]).map(x => [String(x.name).toLowerCase(), x.value]));
      const er = (v.ratings||[]).find(r => /epss/i.test((r.source||{}).name||'') || /epss/i.test(r.method||''));
      const ep = Object.entries(vp).find(([k]) => /epss/.test(k));
      let epss = er ? Number(er.score) : ep ? Number(String(ep[1]).replace('%','')) / (String(ep[1]).includes('%') ? 100 : 1) : null;
      if (epss === null || isNaN(epss)) epss = null; else epss = Math.max(0, Math.min(1, epss));
      const kev = Object.keys(vp).some(k => /kev|known.?exploited/.test(k)) ||
        (v.ratings||[]).some(r => /kev|cisa/i.test((r.source||{}).name||''));
      return { id: v.id, severity: clean(((v.ratings||[])[0]||{}).severity) || 'unknown',
        score: ((v.ratings||[])[0]||{}).score ?? null, epss, kev,
        target: ((v.affects||[])[0]||{}).ref || '',
        state: clean((v.analysis||{}).state),
        justification: clean((v.analysis||{}).justification),
        published: v.published || null };
    })
  };
}

/* --- SPDX 2.x ---------------------------------------------------- */
const SPDX2_PURPOSE = { APPLICATION:'application', FRAMEWORK:'framework', LIBRARY:'library', CONTAINER:'container',
  OPERATING_SYSTEM:'os', 'OPERATING-SYSTEM':'os', DEVICE:'file', FIRMWARE:'file', FILE:'file', SOURCE:'file',
  ARCHIVE:'file', INSTALL:'application', MODEL:'model', DATA:'dataset', OTHER:'other' };

function fromSPDX2(d){
  const components = (d.packages||[]).map(p => {
    const refs = p.externalRefs || [];
    const purl = clean((refs.find(r => r.referenceType === 'purl') || {}).referenceLocator);
    const lc = clean(p.licenseConcluded), ld = clean(p.licenseDeclared);
    const lic = [...new Set([lc, ld].filter(Boolean))];
    const ack = { declared: ld ? [ld] : [], concluded: lc ? [lc] : [], unqualified: [],
      state: (ld && lc) ? (ld === lc ? 'agreed' : 'divergent')
        : ld ? 'declared-only' : lc ? 'concluded-only' : 'none' };
    let type = SPDX2_PURPOSE[(p.primaryPackagePurpose||'').toUpperCase()] || 'other';
    if (/^pkg:(huggingface|model)\//i.test(purl)) type = 'model';
    else if (/^pkg:dataset\//i.test(purl)) type = 'dataset';
    else if (type === 'other' && purl) type = 'library';
    return { id:p.SPDXID, name:displayName(p.name, purl), raw:clean(p.name), version:clean(p.versionInfo), type, purl,
      eco: purl ? (purlParts(purl)||{}).type || 'unresolved' : 'unresolved',
      licenses:lic, ack, supplier:clean(p.supplier) || clean(p.originator),
      refs:(clean(p.downloadLocation) ? [{ type:'distribution', url:p.downloadLocation }] : [])
        .concat(refs.filter(r => r.referenceCategory === 'SECURITY').map(r => ({ type:'security', url:r.referenceLocator }))),
      model:null, dataset:null, crypto:null, evidence:null,
      hash: !!(p.checksums && p.checksums.length),
      uid: purl || clean((refs.find(r => r.referenceType === 'cpe23Type')||{}).referenceLocator), eol:'',
      props:{ comment:p.comment || '' } };
  });
  const deps = {}; let edges = 0;
  (d.relationships||[]).forEach(r => {
    if (['DEPENDS_ON','CONTAINS','DESCRIBES','BUILD_TOOL_OF','DEV_DEPENDENCY_OF'].includes(r.relationshipType)){
      (deps[r.spdxElementId] = deps[r.spdxElementId] || []).push(r.relatedSpdxElement); edges++;
    }
  });
  const root = (d.documentDescribes||[])[0] ||
    ((d.relationships||[]).find(r => r.relationshipType === 'DESCRIBES')||{}).relatedSpdxElement || null;
  const ci = d.creationInfo || {};
  return { format:'spdx2', label:d.spdxVersion, root, subject:clean(d.name) || 'untitled',
    prov: { spec:d.spdxVersion || 'SPDX', timestamp:clean(ci.created),
      tool:clean((ci.creators||[]).find(c => /^Tool:/i.test(c) || '').replace(/^Tool:\s*/i,'')),
      author:clean((ci.creators||[]).find(c => /^(Person|Organization):/i.test(c) || '').replace(/^\w+:\s*/,'')),
      serial:clean(d.documentNamespace), signature:false,
      rootName:clean(d.name), rootVersion:'', lifecycle:'' },
    hasVulnBlock:false,
    graph: edges > 0, components, deps, props:{}, tool:((d.creationInfo||{}).creators||[])[0] || null, vulns:[] };
}

/* --- SPDX 3.0 ---------------------------------------------------- */
const SPDX3_PURPOSE = { application:'application', framework:'framework', library:'library', container:'container',
  operatingSystem:'os', file:'file', source:'file', archive:'file', model:'model', data:'dataset', other:'other' };

function fromSPDX3(d){
  const graph = d['@graph'] || (Array.isArray(d) ? d : []);
  const el = graph.filter(x => x.type || x['@type']);
  const typeOf = x => String(x.type || x['@type']).replace(/^spdx:/,'');
  const licText = {};
  el.filter(x => /LicenseExpression|License$/.test(typeOf(x))).forEach(x =>
    licText[x.spdxId || x['@id']] = x.simplelicensing_licenseExpression || x.licenseExpression || x.name || '');
  const rels = el.filter(x => typeOf(x) === 'Relationship');
  const declared = {};
  rels.filter(r => /hasDeclaredLicense|hasConcludedLicense/i.test(r.relationshipType||'')).forEach(r => {
    const from = r.from || r.spdxElementId;
    (Array.isArray(r.to) ? r.to : [r.to]).filter(Boolean).forEach(t =>
      (declared[from] = declared[from] || []).push(licText[t] || t));
  });
  const components = el.filter(x => /Package$/.test(typeOf(x))).map(p => {
    const t = typeOf(p), id = p.spdxId || p['@id'];
    let type = SPDX3_PURPOSE[p.software_primaryPurpose] || 'other';
    if (/AIPackage/.test(t)) type = 'model';
    if (/DatasetPackage/.test(t)) type = 'dataset';
    const purl = clean(p.software_packageUrl) ||
      clean((p.externalIdentifier||[]).map(e => e.identifier).find(v => /^pkg:/.test(v||'')));
    const aiKeys = Object.keys(p).filter(k => k.startsWith('ai_'));
    const dsKeys = Object.keys(p).filter(k => k.startsWith('dataset_'));
    return { id, name:displayName(p.name, purl), raw:clean(p.name), version:clean(p.software_packageVersion), type, purl,
      eco: purl ? (purlParts(purl)||{}).type || 'unresolved' : 'unresolved',
      licenses:[...new Set(declared[id]||[])].map(clean).filter(Boolean),
      ack:{ declared:[], concluded:[], unqualified:[...new Set(declared[id]||[])].map(clean).filter(Boolean),
        state:(declared[id]||[]).length ? 'unqualified' : 'none' },
      supplier:clean(p.suppliedBy) || clean(p.software_originatedBy),
      refs:(clean(p.software_downloadLocation) ? [{ type:'distribution', url:p.software_downloadLocation }] : [])
        .concat((p.externalRef||[]).map(r => ({ type:r.externalRefType||'other', url:(r.locator||[])[0]||'' }))),
      model:aiKeys.length ? Object.fromEntries(aiKeys.map(k => [k,p[k]])) : null,
      dataset:dsKeys.length ? Object.fromEntries(dsKeys.map(k => [k,p[k]])) : null,
      crypto:null, evidence:null, hash:!!(p.verifiedUsing||[]).length, uid:purl, eol:'', props:{} };
  });
  const deps = {}; let edges = 0;
  rels.filter(r => /dependsOn|contains|trainedOn|hasDataFile/i.test(r.relationshipType||'')).forEach(r => {
    const from = r.from || r.spdxElementId;
    const to = (Array.isArray(r.to) ? r.to : [r.to]).filter(Boolean);
    (deps[from] = deps[from] || []).push(...to); edges += to.length;
  });
  const doc = el.find(x => typeOf(x) === 'SpdxDocument') || {};
  const ci = el.find(x => typeOf(x) === 'CreationInfo') || {};
  return { format:'spdx3', label:'SPDX ' + (ci.specVersion || '3.0'), root:(doc.rootElement||[])[0] || null,
    subject:clean(doc.name) || 'untitled',
    prov: { spec:'SPDX ' + (ci.specVersion || '3.0'), timestamp:clean(ci.created),
      tool:clean((ci.createdBy||[])[0]), author:clean((ci.createdBy||[])[0]),
      serial:clean(doc.spdxId), signature:false,
      rootName:clean(doc.name), rootVersion:'', lifecycle:'' },
    hasVulnBlock:false, graph: edges > 0, components, deps, props:{}, tool:null, vulns:[] };
}

/* Some generators emit invalid JSON: a bare, unquoted scalar as a value.
   Confirmed in the wild from two separate in-house generators — SCANOSS's
   CycloneDX export writes bare URLs (`"website": http://…`) and the CBOM
   generator writes bare bom-refs (`"bom-ref": crypto/algorithm/eddsa@1.3…`).
   Strict JSON.parse correctly rejects both. Rather than bounce every file
   from those pipelines, attempt one targeted repair: quote bare tokens
   sitting in a value position (after a colon, or inside an array), but
   never touch real JSON literals (true/false/null/numbers) and never
   touch anything already quoted. The result is only used if it parses.
   The uploaded file itself is never modified — this is in-memory only,
   and the person is told it happened. */
const JSON_LITERAL = /^(true|false|null|-?\d+(\.\d+)?([eE][+-]?\d+)?)$/;
function tryLenientRepair(text){
  /* a bare token is a run of non-structural, non-whitespace characters that
     isn't quoted; it may legitimately contain : / @ . + - etc. */
  const BARE = String.raw`[^\s"'{}\[\],]+`;
  const repaired = text
    /* value position: after a colon */
    .replace(new RegExp(String.raw`(:\s*)(${BARE})(?=\s*[,}\]\n\r])`, 'g'),
      (m, pre, tok) => JSON_LITERAL.test(tok) ? m : `${pre}"${tok}"`)
    /* array element position: after [ or , */
    .replace(new RegExp(String.raw`([\[,]\s*)(${BARE})(?=\s*[,\]\n\r])`, 'g'),
      (m, pre, tok) => JSON_LITERAL.test(tok) ? m : `${pre}"${tok}"`);
  if (repaired === text) return null;
  try { return JSON.parse(repaired); } catch(_) { return null; }
}

function ingest(name, text){
  let raw, lenient = false;
  try { raw = JSON.parse(text); }
  catch (strictErr){
    raw = tryLenientRepair(text);
    if (!raw) throw strictErr;  /* repair didn't help — surface the original, more literal error */
    lenient = true;
  }
  const fmt = detectFormat(raw);
  const doc = fmt === 'cdx' ? fromCycloneDX(raw) : fmt === 'spdx2' ? fromSPDX2(raw) : fromSPDX3(raw);
  doc.name = name;
  doc.lenient = lenient;
  doc.kinds = classify(doc);
  /* vulnerabilities may point at a bom-ref, a purl or a name — resolve once */
  const index = new Map();
  doc.components.forEach(c => { [c.id, c.purl, c.raw, c.name].filter(Boolean).forEach(k => { if (!index.has(k)) index.set(k, c); }); });
  doc.vulns.forEach(v => { const hit = index.get(v.target); v.targetName = hit ? hit.name : (v.target || 'unattributed'); v.hit = !!hit; });
  return doc;
}

/* ============================================================
   2 · LICENCE CLASSIFICATION
   Anything unrecognised lands in "needs review", never silently
   in permissive and never falsely in restricted.
   ============================================================ */
const LIC_CLASSES = ['permissive','weak','strong','restricted','review','undeclared'];
const LIC_LABEL = { permissive:'Permissive', weak:'Weak copyleft', strong:'Strong copyleft',
  restricted:'Use-restricted', review:'Needs review', undeclared:'Undeclared' };
const LIC_COLOR = k => `var(--lic-${k})`;
const OBLIGATION = { permissive:'Attribution only', weak:'File-level source disclosure',
  strong:'Full source disclosure', restricted:'Use restricted', review:'Manual review', undeclared:'Cannot clear' };
const OBLIGATION_ORDER = ['Attribution only','File-level source disclosure','Full source disclosure',
  'Use restricted','Manual review','Cannot clear'];
const OB_CLASS = { 'Attribution only':'permissive','File-level source disclosure':'weak',
  'Full source disclosure':'strong','Use restricted':'restricted','Manual review':'review','Cannot clear':'undeclared' };

function licenceClass(expr){
  const s = clean(expr);
  if (!s || /^LicenseRef-(unknown|none|noassertion)$/i.test(s)) return 'undeclared';
  if (/non-?commercial|NC-|CC-BY-NC|research[- ]only|no-?derivative|-ND-|RAIL|BUSL|Elastic-2|Commons-Clause|proprietary|evaluation only|internal use/i.test(s)) return 'restricted';
  if (/AGPL|(^|[^L])GPL-[23]|SSPL|OSL-|EUPL|CeCILL(?!-B|-C)|RPL-|QPL/i.test(s)) return 'strong';
  if (/LGPL|MPL-|EPL-|CDDL|CC-BY-SA|ODbL|Ms-RL|CPL-|IPL-|SPL-|APSL|CeCILL-C/i.test(s)) return 'weak';
  if (/^(MIT|ISC|Zlib|Unlicense|CC0|WTFPL|0BSD)$|MIT-|Apache-|BSD-|BSL-1\.0|PSF|Python-2|CC-BY-[34]|CDLA-Permissive|OFL-|Bitstream-Vera|Unicode-|W3C|X11|Ms-PL|Artistic-2|AFL-|ECL-|NCSA|Libpng|FTL|PostgreSQL/i.test(s)) return 'permissive';
  return 'review';
}
const worstClass = list => {
  if (!list || !list.length) return 'undeclared';
  const seen = list.map(licenceClass);
  for (const k of ['undeclared','restricted','strong','review','weak','permissive'])
    if (seen.includes(k)) return k;
  return 'review';
};
const LIC_SCORE = { permissive:100, weak:75, review:50, strong:40, restricted:15, undeclared:0 };

/* ============================================================

   left out of the average — a CBOM with no certificates is not a
   CBOM that fails certificate management.

const SW = ['library','framework','application','container','os','file'];
const SEV = ['critical','high','medium','low'];
const WEAK_ALGO = /(^|[^A-Z])(SHA-?1|MD5|MD4|DES|3DES|RC2|RC4|RSA-1024|ECB)([^0-9]|$)/i;
const TARGET = 90;

/* Every finding rule maps to one remediation action. The register groups by symptom;

const ACTIONS = {

};
const ACTION_FOR = rule => ACTIONS[rule] || { act:rule, own:'Unassigned', eff:'M' };
ACTIONS['Licence combination conflict'] = { act:'Resolve licence incompatibilities', own:'Legal / OSPO', eff:'L' };
ACTIONS['Known-exploited vulnerability'] = { act:'Patch known-exploited vulnerabilities', own:'Security', eff:'M' };

/* Licence pairs that cannot lawfully coexist in one distributed work. */
const CONFLICT_RULES = [
  { a:/(^|[^L\w-])GPL-2\.0/i, b:/Apache-2\.0/i,
    why:'GPL-2.0 and Apache-2.0 are widely held incompatible for combined distribution, because of the patent-termination clause.' },
  { a:/(^|[^L\w-])GPL-2\.0/i, b:/(^|[^\w-])EPL-/i,
    why:'GPL-2.0 and the Eclipse Public Licence impose mutually incompatible conditions on a combined work.' },
  { a:/(^|[^L\w-])A?GPL/i, b:/non-?commercial|CC-BY-NC|research[- ]only|-ND-|Elastic-2|BUSL|Commons-Clause/i,
    why:'Copyleft requires onward freedom to redistribute, which a use-restricted licence forbids.' },
  { a:/(^|[^L\w-])A?GPL/i, b:/^LicenseRef-(?!unknown|none|noassertion)/i,
    why:'Copyleft alongside unresolved bespoke terms cannot be cleared until those terms are read.' }
];

function classify(doc){
  const n = t => doc.components.filter(c => c.type === t).length;
  const models = n('model'), data = n('dataset'), crypto = n('crypto');
  const sw = doc.components.filter(c => SW.includes(c.type)).length;
  const kinds = [];
  if (crypto) kinds.push('cbom');
  if (models || data) kinds.push('aibom');
  if (sw && !crypto && (!(models || data) || sw >= 2*(models+data))) kinds.push('sbom');
  return kinds.length ? kinds : ['sbom'];
}

const pct = (n,d) => d ? Math.round(100*n/d) : 0;
const rate = v => v >= TARGET ? 'pass' : v >= 50 ? 'warn' : 'fail';

/* dim(...) with na:true marks "not expressible in this document" */
function dim(label, short, done, total, wording, sub, naReason){
  if (!total) return { label, short, na:true, status:'na', coverage:null, done:0, total:0,
    state:'not applicable', sub:naReason || 'no assets of this kind are declared' };
  const cov = pct(done,total);
  const st = rate(cov);
  return { label, short, na:false, coverage:cov, status:st, done, total,
    state: st === 'pass' ? wording.pass : st === 'warn' ? wording.warn : wording.fail,
    sub: sub || (done + ' of ' + total) };
}

/* ---------------- SBOM ---------------- */
function evalSBOM(docs){
  const comps = docs.flatMap(d => d.components).filter(c => SW.includes(c.type));
  const deps = Object.assign({}, ...docs.map(d => d.deps));
  const hasGraph = docs.some(d => d.graph);
  const linked = new Set(Object.entries(deps).flatMap(([k,v]) => v.length ? [k, ...v] : []));
  const vulns = docs.flatMap(d => d.vulns);

  const identified = comps.filter(c => c.purl && c.version);
  const cleared = comps.filter(c => worstClass(c.licenses) !== 'undeclared');
  const inGraph = comps.filter(c => linked.has(c.id));
  /* CycloneDX requires a justification for not_affected — a bare state is not a triage */
  const properly = v => v.state && v.state !== 'in_triage' && !(v.state === 'not_affected' && !v.justification);
  const triaged = vulns.filter(properly);
  const matchable = comps.filter(c => c.purl && c.version);
  const scanned = docs.some(d => d.hasVulnBlock);
  const supplied = comps.filter(c => c.supplier);

  const dims = [
    dim('Component Identification','Identity',identified.length,comps.length,
      {pass:'fully identified',warn:'partially known',fail:'largely unresolved'},
      identified.length + ' of ' + comps.length + ' carry both a package URL and a real version'),
    dim('License Compliance','Licences',cleared.length,comps.length,
      {pass:'all cleared',warn:'partially cleared',fail:'not cleared'},
      (comps.length - cleared.length) + ' component(s) have no usable licence'),
    hasGraph
      ? dim('Dependency Graph','Graph',inGraph.length,comps.length,
          {pass:'complete',warn:'partial',fail:'mostly unlinked'},
          inGraph.length + ' of ' + comps.length + ' appear in a relationship')
      : dim('Dependency Graph','Graph',0,0,{},'',
          'the scanner emitted a flat component list with no dependency edges'),
    dim('Vulnerability Triage','VEX',triaged.length,vulns.length,
      {pass:'fully triaged',warn:'partly triaged',fail:'untriaged'},
      triaged.length + ' of ' + vulns.length + ' carry a defensible analysis state · only ' +
      matchable.length + ' of ' + comps.length + ' components are matchable to an advisory feed',
      scanned ? 'the document records a completed scan that returned no findings'
              : 'no vulnerability block at all — this document carries no scan evidence'),
    dim('Supplier Provenance','Supplier',supplied.length,comps.length,
      {pass:'attributed',warn:'partly attributed',fail:'unattributed'})
  ];

  const F = [];
  const add = (sev,rule,dimName,ref,detail) => F.push({ sev, src:'SBOM', rule, dim:dimName, ref, detail });
  comps.filter(c => !c.licenses.length).forEach(c => add('high','No licence declared','License Compliance',c.name,
    'Nothing to clear against — the component cannot be approved for use or distribution.'));
  comps.filter(c => c.licenses.length && worstClass(c.licenses) === 'undeclared').forEach(c =>
    add('high','Licence resolves to unknown','License Compliance',c.name,
      c.licenses.join(', ') + ' — the scanner recorded a placeholder rather than real terms.'));
  comps.filter(c => worstClass(c.licenses) === 'review').forEach(c =>
    add('medium','Licence needs manual review','License Compliance',c.name,
      c.licenses.join(', ') + ' — not in the classified set, so obligations must be read by hand.'));
  comps.filter(c => worstClass(c.licenses) === 'strong').forEach(c =>
    add('high','Strong copyleft obligation','License Compliance',c.name,
      c.licenses.join(', ') + ' — source-availability obligations attach on distribution.'));
  comps.filter(c => worstClass(c.licenses) === 'weak').forEach(c =>
    add('medium','Weak copyleft obligation','License Compliance',c.name,
      c.licenses.join(', ') + ' — file-level reciprocity applies to modifications.'));
  comps.filter(c => worstClass(c.licenses) === 'restricted').forEach(c =>
    add('high','Use restriction','License Compliance',c.name,
      c.licenses.join(', ') + ' — confirm the permitted scope before release.'));
  comps.filter(c => !c.version).forEach(c => add('medium','No resolved version','Component Identification',c.name,
    'Recorded as a placeholder, so advisories and licence revisions cannot be pinned.'));
  comps.filter(c => !c.purl).forEach(c => add('medium','No package coordinates','Component Identification',c.name,
    'Without a package URL the component cannot be matched to advisories or upstream terms.'));
  comps.filter(c => !c.supplier).forEach(c => add('low','No supplier recorded','Supplier Provenance',c.name,
    'Attribution and notice generation need a named supplier or author.'));
  if (hasGraph) comps.filter(c => !linked.has(c.id)).forEach(c =>
    add('medium','Outside the dependency graph','Dependency Graph',c.name,
      'Nothing declares it and it declares nothing, so its reason for being in the build is unevidenced.'));
  vulns.filter(v => !v.state || v.state === 'in_triage').forEach(v => add(
    v.severity === 'critical' ? 'critical' : v.severity === 'high' ? 'high' : 'medium',
    'Vulnerability awaiting triage','Vulnerability Triage', v.targetName,
    v.id + ' rated ' + v.severity + ' — untriaged findings count as exploitable until shown otherwise.'));
  vulns.filter(v => v.state === 'not_affected' && !v.justification).forEach(v =>
    add('medium','not_affected without justification','Vulnerability Triage', v.targetName,
      v.id + ' is marked not affected with no justification, which CycloneDX requires and an assessor will reject.'));
  vulns.filter(v => !v.hit).forEach(v => add('medium','Vulnerability not matched to a component','Vulnerability Triage', null,
    v.id + ' targets ' + v.target + ', which does not resolve to anything in the inventory.'));
  vulns.filter(v => v.kev).forEach(v => add('critical','Known-exploited vulnerability','Vulnerability Triage', v.targetName,
    v.id + ' appears on a known-exploited list. Exploitation is observed rather than theoretical, which outranks its CVSS score.'));

  /* --- licence incompatibilities co-present in one distributed work --- */
  const conflicts = [];
  CONFLICT_RULES.forEach(r => {
    const left = comps.filter(c => c.licenses.some(l => r.a.test(l)));
    const right = comps.filter(c => c.licenses.some(l => r.b.test(l)));
    if (left.length && right.length){
      const ln = left.map(c => c.name), rn = right.map(c => c.name);
      conflicts.push({ why:r.why, left:ln, right:rn });
      add('high','Licence combination conflict','License Compliance', ln[0],
        r.why + ' Present here via ' + ln.slice(0,2).join(', ') + ' alongside ' + rn.slice(0,2).join(', ') + '.');
    }
  });
  const agpl = comps.filter(c => c.licenses.some(l => /AGPL|SSPL/i.test(l))).map(c => c.name);

  /* --- fields regulators mandate, most of which generators quietly omit --- */
  /* Hash and EOL gaps are reported once each by the mandated-field panel rather than
     once per component — at 500 components those two rules alone drowned the register. */
  const MANDATED = [
    { k:'Component name',          have:comps.filter(c => c.name).length,    total:comps.length },
    { k:'Version',                 have:comps.filter(c => c.version).length, total:comps.length },
    { k:'Unique identifier',       have:comps.filter(c => c.uid).length,     total:comps.length },
    { k:'Supplier',                have:supplied.length,                     total:comps.length },
    { k:'Licence',                 have:cleared.length,                      total:comps.length },
    { k:'Dependency relationship', have:hasGraph ? inGraph.length : 0,       total:comps.length },
    { k:'Hash / checksum',         have:comps.filter(c => c.hash).length,    total:comps.length },
    { k:'EOL / EOS date',          have:comps.filter(c => c.eol).length,     total:comps.length },
    { k:'Patch status',            have:triaged.length,                      total:vulns.length,
      na: !vulns.length, note:'no vulnerability records to carry a status' }
  ];

  return { key:'sbom', title:'SBOM', kind:'software', count:comps.length + ' components',
    dims, findings:F, comps, vulns, hasGraph, linked, conflicts, agpl, mandated:MANDATED,
    enriched: { epss:vulns.filter(v => v.epss !== null).length, kev:vulns.filter(v => v.kev).length, total:vulns.length },
    scan: { scanned, matchable:matchable.length, total:comps.length, triaged:triaged.length,
      unmatchable:comps.length - matchable.length } };
}

/* ---------------- AIBOM ---------------- */
function evalAIBOM(docs){
  const all = docs.flatMap(d => d.components);
  const deps = Object.assign({}, ...docs.map(d => d.deps));
  const models = all.filter(c => c.type === 'model');
  const data = all.filter(c => c.type === 'dataset');
  const libs = all.filter(c => ['library','framework'].includes(c.type));
  const dataIds = new Set(data.map(d => d.id));
  const trainedOn = m => (deps[m.id] || []).filter(r => dataIds.has(r));

  const lineage = models.filter(m => m.model && trainedOn(m).length);
  const licAssets = models.concat(data);
  const licensed = licAssets.filter(c => worstClass(c.licenses) !== 'undeclared');
  const provenanced = data.filter(d => d.licenses.length ||
    (d.dataset && (d.dataset.governance || d.dataset.dataset_intendedUse || d.dataset.dataset_datasetType)));
  const cleanLibs = libs.filter(l => l.purl && l.licenses.length);
  const traceable = models.filter(m => m.refs.length);

  /* --- sensitivity: what the prose says versus what the fields declare ---
     Read from the free-text description, which is NOT a declared field. This
     can only ever raise a question for a human, never assert a fact — so it
     is reported as an unreconciled claim, not as sensitive data found. */
  const PII_TERMS = [
    { re:/\bpersonal(ly)? identifiable information\b|\bPII\b/i, label:'personally identifiable information' },
    { re:/\bemail(s| address(es)?)?\b/i, label:'emails' },
    { re:/\bip address(es)?\b/i, label:'IP addresses' },
    { re:/\bpassword(s)?\b/i, label:'passwords' },
    { re:/\b(api |secret |private )?keys\b/i, label:'keys' },
    { re:/\busername(s)?\b/i, label:'usernames' },
    { re:/\bbiometric\b/i, label:'biometrics' },
    { re:/\bhealth (record|data)\b|\bmedical\b/i, label:'health data' }
  ];
  const sensitivityFlags = data.map(d => {
    const ds = d.dataset || {};
    const text = String(ds.description || '');
    const hits = PII_TERMS.filter(t => t.re.test(text)).map(t => t.label);
    const declaredSensitive = ds.sensitiveData || ds.dataset_sensitivePersonalInformation;
    const classification = clean(ds.classification);
    return { name:d.name, id:d.id, hits,
      declared: !!(declaredSensitive || classification),
      classification, sensitiveData: declaredSensitive || '',
      unreconciled: hits.length > 0 && !(declaredSensitive || classification) };
  });
  const unreconciled = sensitivityFlags.filter(s => s.unreconciled);

  const dims = [
    dim('Model Card Lineage','Lineage',lineage.length,models.length,
      {pass:'fully traced',warn:'partly traced',fail:'no lineage'},
      lineage.length + ' of ' + models.length + ' have a card and a training-data link'),
    dim('Model & Dataset License','Licences',licensed.length,licAssets.length,
      {pass:'all resolved',warn:'partly resolved',fail:'unresolved'},
      (licAssets.length - licensed.length) + ' asset(s) without usable terms'),
    /* Two facets per dataset, because a record can have a known owner and still
       be undefensible: origin evidence, and a sensitivity declaration that does
       not contradict its own description. Scoring only the first made this read
       100% while carrying high findings filed under the same dimension. */
    dim('Dataset Provenance','Datasets',
      provenanced.length + data.filter(d => !unreconciled.some(u => u.id === d.id)).length,
      data.length * 2,
      {pass:'origin known',warn:'partly known',fail:'unknown origin'},
      provenanced.length + ' of ' + data.length + ' carry terms or governance' +
      (unreconciled.length ? ' · ' + unreconciled.length + ' with an unreconciled sensitivity claim' : '')),
    dim('Library Compliance','Libraries',cleanLibs.length,libs.length,
      {pass:'cleared',warn:'partly cleared',fail:'not cleared'}),
    dim('Supply Chain Risk','Supply',traceable.length,models.length,
      {pass:'traceable',warn:'partly traceable',fail:'not traceable'},
      traceable.length + ' of ' + models.length + ' reference a source or attestation')
  ];

  const F = [];
  const add = (sev,rule,dimName,ref,detail) => F.push({ sev, src:'AIBOM', rule, dim:dimName, ref, detail });
  models.filter(m => !m.licenses.length).forEach(m => add('critical','Model licence unresolved','Model & Dataset License',
    m.name,'Weights ship with no declared terms. Resolve upstream before release.'));
  licAssets.filter(c => worstClass(c.licenses) === 'restricted').forEach(c =>
    add('high','Use restriction on an AI asset','Model & Dataset License',c.name,
      (c.licenses.join(', ')||'vendor terms') + ' — limits commercial or downstream use.'));
  data.filter(d => !d.licenses.length && !(d.dataset && (d.dataset.governance || d.dataset.dataset_intendedUse)))
    .forEach(d => add('high','Dataset provenance unevidenced','Dataset Provenance',d.name,
      'No licence or governance record, so training-data origin cannot be evidenced.'));
  models.filter(m => m.model && !trainedOn(m).length).forEach(m =>
    add('medium','No training data linked','Model Card Lineage',m.name,
      'The card exists but no dataset relationship is declared, so lineage stops at the weights.'));
  models.filter(m => !m.model).forEach(m => add('medium','No model card','Model Card Lineage',m.name,
    'Task, architecture and evaluation are undocumented, so intended use cannot be assessed.'));
  models.filter(m => !m.refs.length).forEach(m => add('medium','No provenance reference','Supply Chain Risk',m.name,
    'Add a distribution or attestation reference so the artefact can be traced to source.'));
  data.filter(d => d.dataset && (d.dataset.dataset_sensitivePersonalInformation === 'yes' || d.dataset.classification === 'confidential'))
    .forEach(d => add('medium','Sensitive training data','Dataset Provenance',d.name,
      'Flagged personal or confidential — confirm lawful basis and retention for training use.'));

  /* --- model card anatomy -------------------------------------------
     CycloneDX 1.6 gives a model card a fixed shape. Scoring it as one
     percentage hides which part is missing, and the parts are not
     interchangeable: an absent architecture is a documentation gap,
     an absent fairness assessment is a governance gap. */
  const MC_SECTIONS = [
    { key:'modelParameters', label:'Model parameters', hint:'what it is and how it was built',
      fields:[
        { k:'approach',           label:'Approach',        get:mp => (mp.approach||{}).type },
        { k:'task',               label:'Task',            get:mp => mp.task },
        { k:'architectureFamily', label:'Architecture family', get:mp => mp.architectureFamily },
