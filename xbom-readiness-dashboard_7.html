  const minX = Math.min(...items.map(i => i.x-i.r)), maxX = Math.max(...items.map(i => i.x+i.r));
  const minY = Math.min(...items.map(i => i.y-i.r)), maxY = Math.max(...items.map(i => i.y+i.r));
  const PAD = 14, ox = -minX+PAD, oy = -minY+PAD;
  const W = maxX-minX+PAD*2, H = maxY-minY+PAD*2;
  const riskShare = m => { const bad = (m.undeclared||0)+(m.restricted||0)+(m.strong||0);
    const t = LIC_CLASSES.reduce((a,k) => a+(m[k]||0),0) || 1; return bad/t; };
  const fillFor = it => (it.tail || it.name === 'unattributed') ? '#CBD5E1'
    : (t => t===0?'#93C5FD':t<.25?'#60A5FA':t<.5?'#FDE68A':t<.75?'#FCA5A5':'#EF4444')(riskShare(it.mix));
  const bubbles = items.map(it => {
    const cx = it.x+ox, cy = it.y+oy, fill = fillFor(it), showLabel = it.r >= 23, isGap = it.name === 'unattributed';
    return `<g class="bub-g"${pickAttr({ key:'sup:'+it.name, label:it.name, refs:it.members })}
      ${tip(isGap
        ? `<b>${it.n} component${it.n>1?'s':''} carry no supplier field</b> · ${pct(it.n, sup.total)}% of the estate<br><i>a data gap, not one upstream</i>`
        : `<b>${esc(it.name)}</b><br>${it.n} component${it.n>1?'s':''} · ${pct(it.n, sup.total)}% of the estate`)}>
      <circle class="bub${isGap?' bub-gap':''}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${it.r.toFixed(1)}" fill="${fill}"/>
      <ellipse cx="${(cx-it.r*.32).toFixed(1)}" cy="${(cy-it.r*.4).toFixed(1)}" rx="${(it.r*.4).toFixed(1)}" ry="${(it.r*.25).toFixed(1)}"
        fill="url(#gBubbleSheen)" style="pointer-events:none" transform="rotate(-26 ${cx.toFixed(1)} ${cy.toFixed(1)})"/>
      ${showLabel ? `<text x="${cx.toFixed(1)}" y="${(cy-1).toFixed(1)}" text-anchor="middle"
          font-size="${Math.min(12.5,it.r*.24).toFixed(1)}" font-weight="700" fill="#1E293B" style="pointer-events:none">
          ${esc(clipTxt(isGap ? 'no supplier' : it.name, Math.max(4,Math.floor(it.r/4.6))))}</text>
        <text x="${cx.toFixed(1)}" y="${(cy+Math.min(15,it.r*.3)).toFixed(1)}" text-anchor="middle"
          font-size="${Math.min(10.5,it.r*.2).toFixed(1)}" font-family="var(--mono)" fill="#1E293B" opacity=".68"
          style="pointer-events:none">${it.n}</text>` : ''}</g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" class="bubblechart" role="img"
      aria-label="Upstream suppliers sized by component count, shaded by risk mix">
    <defs><radialGradient id="gBubbleSheen" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".9"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient></defs>${SVG_DEFS}
    <g filter="url(#fSoft)">${bubbles}</g></svg>`;
}

/* ==================================================================
   5b · SBOM FIGURES — added to answer the questions the flat bar
   charts could not: where does risk sit, how did it accumulate, and
   which specific component is the problem.
   Every one is driven only by fields a real CycloneDX / SPDX document
   carries. Nothing here is synthesised or back-filled.
   ================================================================== */

/* Shared gradient + shadow defs, emitted once per SVG that wants them. */
const SVG_DEFS = `<defs>
  <linearGradient id="gBrand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
  <linearGradient id="gBrandH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
  <linearGradient id="gRadar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3B82F6" stop-opacity=".38"/>
    <stop offset="100%" stop-color="#2563EB" stop-opacity=".10"/></linearGradient>
  <linearGradient id="gCrit" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#EF4444"/><stop offset="100%" stop-color="#DC2626"/></linearGradient>
  <linearGradient id="gHigh" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FB923C"/><stop offset="100%" stop-color="#EA580C"/></linearGradient>
  <linearGradient id="gMed" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
  <linearGradient id="gLow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#94A3B8"/><stop offset="100%" stop-color="#64748B"/></linearGradient>
  <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity=".14"/></filter>
</defs>`;
const SEV_GRAD = { critical:'url(#gCrit)', high:'url(#gHigh)', medium:'url(#gMed)', low:'url(#gLow)', unknown:'#CBD5E1' };

/* --- SBOM · readiness radar --------------------------------------
   Q: what shape is this BOM, at a glance?
   The scorecard already carries the numbers. This carries the shape,
   which is what a reader remembers — a spike into one axis reads very
   differently from an evenly thin pentagon, and the table hides that. */
function dimRadar(dims){
  const live = dims.filter(d => !d.na);
  if (live.length < 3) return '';
  const W = 460, H = 312, cx = 230, cy = 142, R = 96;
  const n = live.length;
  const ang = i => -90 + (360/n)*i;
  const pt = (i, v) => polar(cx, cy, R*(v/100), ang(i));
  const rings = [25,50,75,100].map(v =>
    `<polygon points="${live.map((_,i) => polar(cx,cy,R*(v/100),ang(i)).map(z=>z.toFixed(1)).join(',')).join(' ')}"
      fill="none" stroke="${v===100?'#D8E1EF':'var(--grid)'}" stroke-width="1"/>`).join('');
  const spokes = live.map((_,i) => {
    const [x,y] = polar(cx,cy,R,ang(i));
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)"/>`;
  }).join('');
  /* the 90% target ring, so the reader sees the bar as well as the score */
  const target = `<polygon points="${live.map((_,i) => polar(cx,cy,R*.9,ang(i)).map(z=>z.toFixed(1)).join(',')).join(' ')}"
    fill="none" stroke="var(--ok)" stroke-width="1.4" stroke-dasharray="4 4" opacity=".72"/>`;
  const poly = live.map((d,i) => pt(i, d.coverage).map(z=>z.toFixed(1)).join(',')).join(' ');
  const dots = live.map((d,i) => {
    const [x,y] = pt(i, d.coverage);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#fff"
      stroke="${TONE[d.status]}" stroke-width="2.6"
      ${tip(`<b>${esc(d.label)}</b> · ${d.coverage}%<br>${esc(d.state)}<br>${esc(d.sub)}`)}
      ${pickAttr({ key:'dim:SBOM:'+d.label, label:'SBOM · '+d.label, src:'SBOM', dim:d.label })}/>`;
  }).join('');
  const labels = live.map((d,i) => {
    const [lx,ly] = polar(cx, cy, R+30, ang(i));
    const anchor = Math.abs(lx-cx) < 14 ? 'middle' : lx > cx ? 'start' : 'end';
    return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-size="11.5"
        font-weight="600" fill="var(--ink2)">${esc(d.short)}</text>
      <text x="${lx.toFixed(1)}" y="${(ly+14).toFixed(1)}" text-anchor="${anchor}" font-size="12.5"
        font-weight="800" fill="${TONE[d.status]}">${d.coverage}%</text>`;
  }).join('');
  const naNote = dims.filter(d => d.na).map(d => d.short);
  return `<div style="max-width:470px;margin:0 auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"
      role="img" aria-label="SBOM readiness across ${n} dimensions">
    ${SVG_DEFS}${rings}${spokes}${target}
    <polygon points="${poly}" fill="url(#gRadar)" stroke="var(--brand)" stroke-width="2.2"
      stroke-linejoin="round"/>${dots}${labels}
    <text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" font-family="var(--mono)"
      fill="var(--ink3)">DASHED RING = 90% TARGET${naNote.length ? ' · N/A: ' + esc(naNote.join(', ')) : ''}</text></svg></div>`;
}

/* --- squarified treemap layout ----------------------------------- */
function squarify(items, X, Y, W, H){
  const nodes = items.slice().sort((a,b) => b.value - a.value).filter(n => n.value > 0);
  const out = [];
  let rx = X, ry = Y, rw = W, rh = H;
  const total = nodes.reduce((a,n) => a + n.value, 0);
  if (!total) return out;
  const scale = (W*H)/total;
  const worst = (row, len) => {
    if (!row.length || len <= 0) return Infinity;
    const s = row.reduce((a,n) => a + n.value*scale, 0);
    if (s <= 0) return Infinity;
    const mx = Math.max(...row.map(n => n.value*scale)), mn = Math.min(...row.map(n => n.value*scale));
    return Math.max((len*len*mx)/(s*s), (s*s)/(len*len*mn));
  };
  let row = [];
  const flush = () => {
    const s = row.reduce((a,n) => a + n.value*scale, 0);
    if (s <= 0){ row = []; return; }
    if (rw >= rh){
      const rowW = s/Math.max(rh, .001);
      let cy = ry;
      row.forEach(n => { const nh = (n.value*scale)/Math.max(rowW,.001);
        out.push({ ...n, x:rx, y:cy, w:rowW, h:nh }); cy += nh; });
      rx += rowW; rw -= rowW;
    } else {
      const rowH = s/Math.max(rw, .001);
      let cx = rx;
      row.forEach(n => { const nw = (n.value*scale)/Math.max(rowH,.001);
        out.push({ ...n, x:cx, y:ry, w:nw, h:rowH }); cx += nw; });
      ry += rowH; rh -= rowH;
    }
    row = [];
  };
  while (nodes.length){
    const len = Math.min(rw, rh);
    const nxt = nodes[0];
    if (!row.length || worst(row.concat([nxt]), len) <= worst(row, len)) row.push(nodes.shift());
    else flush();
  }
  flush();
  return out;
}

/* --- SBOM · origin treemap ---------------------------------------
   Q: where is the estate concentrated, and is the concentration in a
   place we can clear?
   Area is component count, fill is the share of that origin that has
   no usable licence. A large pale tile is bulk we understand; a small
   dark one is a corner that will hold up a release. */
function originTreemap(groups, total){
  if (!groups.length) return `<div class="none-box">No package coordinates resolve to a registry, so origin cannot be grouped.</div>`;
  const W = 1000, H = 300;
  const laid = squarify(groups.map(g => ({ ...g, value:g.n })), 0, 0, W, H);
  const risky = g => g.n ? (g.mix.undeclared + g.mix.restricted + g.mix.strong) / g.n : 0;
  /* single sequential ramp: readers should not have to decode a hue wheel */
  const fillFor = g => { const t = risky(g);
    return t === 0 ? '#DBEAFE' : t < .2 ? '#BFDBFE' : t < .4 ? '#FDE68A'
      : t < .6 ? '#FCA5A5' : t < .85 ? '#F87171' : '#DC2626'; };
  /* white text only on the two darkest ramp steps — on #FCA5A5 it is unreadable */
  const inkFor = g => risky(g) >= .6 ? '#fff' : 'var(--ink)';
  const tiles = laid.map(g => {
    const pad = 1.5, w = Math.max(0, g.w - pad*2), h = Math.max(0, g.h - pad*2);
    const showText = w > 58 && h > 30, showSub = w > 58 && h > 48;
    const bandH = Math.min(7, h*0.16);
    /* licence mix band along the bottom of each tile */
    let bx = g.x + pad;
    const band = h > 24 ? LIC_CLASSES.filter(k => g.mix[k]).map(k => {
      const bw = (g.mix[k]/g.n)*w;
      const seg = `<rect x="${bx.toFixed(1)}" y="${(g.y+pad+h-bandH).toFixed(1)}" width="${bw.toFixed(1)}"
        height="${bandH.toFixed(1)}" fill="${LIC_COLOR(k)}" opacity=".92"/>`;
      bx += bw; return seg;
    }).join('') : '';
    return `<g${pickAttr({ key:'eco:'+g.name, label:'origin ' + g.name, refs:g.members })}
      ${tip(`<b>${esc(g.name)}</b><br>${g.n} component${g.n>1?'s':''} · ${pct(g.n,total)}% of the build<br>
        ${g.mix.undeclared} cannot clear · ${g.mix.strong+g.mix.restricted} carry heavy obligations<br>
        <i>${list(g.members)}</i>`)}>
      <rect class="tile" x="${(g.x+pad).toFixed(1)}" y="${(g.y+pad).toFixed(1)}" width="${w.toFixed(1)}"
        height="${h.toFixed(1)}" rx="7" fill="${fillFor(g)}" stroke="#fff" stroke-width="1.5"/>
      ${band}
      ${showText ? `<text x="${(g.x+pad+10).toFixed(1)}" y="${(g.y+pad+21).toFixed(1)}" font-size="12.5"
        font-weight="700" fill="${inkFor(g)}">${esc(clipTxt(g.name, Math.max(4, Math.floor(w/8))))}</text>` : ''}
      ${showSub ? `<text x="${(g.x+pad+10).toFixed(1)}" y="${(g.y+pad+38).toFixed(1)}" font-size="11"
        font-family="var(--mono)" fill="${inkFor(g)}" opacity=".78">${g.n} · ${pct(g.n,total)}%</text>` : ''}
    </g>`;
  }).join('');
  const ramp = ['#DBEAFE','#BFDBFE','#FDE68A','#FCA5A5','#F87171','#DC2626']
    .map((c,i) => `<rect x="${760+i*24}" y="${H+12}" width="24" height="9" fill="${c}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H+38}" role="img" aria-label="Components by origin registry, shaded by unclearable share">
    ${tiles}
    <text x="0" y="${H+21}" font-size="10.5" fill="var(--ink3)">area = component count · bottom band = licence mix · fill = share that cannot be cleared</text>
    ${ramp}<text x="${760}" y="${H+33}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">clean</text>
    <text x="${760+144}" y="${H+33}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--ink3)">all blocked</text></svg>`;
}

/* --- SBOM · disclosure accumulation ------------------------------
   Q: is this a fresh problem or an inherited one?
   Real dates only: every point is a `published` timestamp from the
   vulnerability block, so the curve shows when the world learned about
   what is in this build, up to the date the BOM was cut. A single BOM
   cannot show a remediation trend — that needs two BOMs — and this
   deliberately does not pretend otherwise. */
function disclosureCurve(rows, bomTs){
  const dated = rows.filter(v => v.published).map(v => ({ ...v, t:new Date(v.published).getTime() }))
    .filter(v => !isNaN(v.t)).sort((a,b) => a.t - b.t);
  if (dated.length < 1) return `<div class="none-box">No <code>published</code> dates on these vulnerability records, so an accumulation curve cannot be drawn.</div>`;
  const W = 1000, H = 260, L = 52, R = 22, T = 22, B = 44;
  const t0 = dated[0].t;
  const end = bomTs && !isNaN(new Date(bomTs).getTime()) ? new Date(bomTs).getTime() : Date.now();
  const t1 = Math.max(end, dated[dated.length-1].t);
  const span = Math.max(t1 - t0, 864e5*30);
  const x = t => L + (W-L-R) * ((t - t0)/span);
  const lanes = SEV.filter(s => dated.some(v => v.sev === s));
  const totalN = dated.length;
  const yMax = Math.max(1, totalN);
  const y = n => H - B - (H-T-B) * (n/yMax);
  /* stepped stacked area, one band per severity, oldest first */
  const running = Object.fromEntries(lanes.map(k => [k,0]));
  const steps = [{ t:t0, snap:{ ...running } }];
  dated.forEach(v => { if (running[v.sev] !== undefined) running[v.sev]++; steps.push({ t:v.t, snap:{ ...running } }); });
  steps.push({ t:t1, snap:{ ...running } });
  const cumAt = (snap, upto) => lanes.slice(0, upto+1).reduce((a,k) => a + snap[k], 0);
  /* Right-continuous step boundary as an explicit point list: the value holds
     from one event to the next, then jumps. Upper and lower edges of a band are
     built by the same helper so they can never drift out of step with each other. */
  const boundary = li => {
    const pts = [];
    steps.forEach((s,i) => {
      const v = cumAt(s.snap, li);
      if (i) pts.push([x(s.t), y(cumAt(steps[i-1].snap, li))]);
      pts.push([x(s.t), y(v)]);
    });
    return pts;
  };
  const toPath = pts => pts.map(([px,py],i) => `${i?'L':'M'} ${px.toFixed(1)} ${py.toFixed(1)}`).join(' ');
  const areas = lanes.map((sv, li) => {
    const top = boundary(li), bottom = boundary(li-1).reverse();
    return `<path d="${toPath(top)} ${toPath(bottom).replace(/^M/,'L')} Z"
      fill="var(--sev-${sv})" opacity=".72"
      ${tip(`<b>${esc(sv)}</b> · ${running[sv]} record${running[sv]===1?'':'s'} accumulated by the BOM date`)}
      ${pickAttr({ key:'sev:'+sv, label:sv+' findings', sev:sv })}/>`;
  }).join('');
  const outline = `<path d="${toPath(boundary(lanes.length-1))}" fill="none" stroke="var(--ink)"
    stroke-width="1.8" opacity=".55" stroke-linejoin="round"/>`;
  const yTicks = [0, Math.ceil(yMax/2), yMax].filter((v,i,a) => a.indexOf(v) === i).map(v =>
    `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W-R}" y2="${y(v).toFixed(1)}" stroke="var(--grid)"/>
     <text x="${L-9}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--ink3)">${v}</text>`).join('');
  const years = (() => {
    const out = []; const a = new Date(t0).getFullYear(), b = new Date(t1).getFullYear();
    const stepY = Math.max(1, Math.ceil((b-a+1)/8));
    for (let yr = a; yr <= b; yr += stepY){
      const tt = new Date(yr,0,1).getTime(); if (tt < t0 || tt > t1) continue;
      out.push(`<line x1="${x(tt).toFixed(1)}" y1="${T}" x2="${x(tt).toFixed(1)}" y2="${H-B}" stroke="var(--grid)" stroke-dasharray="2 3"/>
        <text x="${x(tt).toFixed(1)}" y="${H-B+16}" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--ink3)">${yr}</text>`);
    }
    return out.join('');
  })();
  const marks = dated.map(v => `<g${pickAttr({ key:'ref:'+v.target, label:v.id, refs:[v.target] })}
    ${tip(`<b>${esc(v.id)}</b> · ${v.sev}<br>disclosed ${new Date(v.t).toISOString().slice(0,10)} · ${v.age} days ago<br>affects ${esc(v.target)}<br>${v.open ? '<i>still open in this BOM</i>' : 'triaged: ' + esc(v.state)}`)}>
    <line x1="${x(v.t).toFixed(1)}" y1="${H-B}" x2="${x(v.t).toFixed(1)}" y2="${(H-B+7)}" stroke="var(--sev-${v.sev})" stroke-width="2"/>
    <circle cx="${x(v.t).toFixed(1)}" cy="${(H-B+11)}" r="${v.open?4:3}" fill="${v.open?`var(--sev-${v.sev})`:'#fff'}"
      stroke="var(--sev-${v.sev})" stroke-width="1.6"/></g>`).join('');
  const bomLine = `<line x1="${x(end).toFixed(1)}" y1="${T-4}" x2="${x(end).toFixed(1)}" y2="${H-B}"
      stroke="var(--brand)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="${(x(end)-7).toFixed(1)}" y="${T+6}" text-anchor="end" font-size="9.5" font-family="var(--mono)"
      fill="var(--brand)">BOM CUT</text>`;
  const key = lanes.map((sv,i) => `<g><rect x="${L+i*104}" y="${H-14}" width="10" height="10" rx="2.5" fill="var(--sev-${sv})" opacity=".85"/>
    <text x="${L+i*104+16}" y="${H-5}" font-size="10.5" fill="var(--ink3)">${sv}</text></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative known vulnerabilities over time by severity">
    ${SVG_DEFS}${yTicks}${years}${areas}${outline}${bomLine}${marks}${key}
    <text x="${W-R}" y="${H-5}" text-anchor="end" font-size="10.5" fill="var(--ink3)">disclosure date · filled tick = still open →</text></svg>`;
}

/* --- SBOM · severity donut + triage progress ---------------------
   Q: how bad is the exposure, and has anyone actually looked at it?
   Severity mix alone flatters a BOM where nothing has been triaged, so
   the ratio bars sit beside it rather than on a separate panel. */
function severityDonut(cve){
  const mix = {}; SEV.concat(['unknown']).forEach(k => mix[k] = 0);
  cve.rows.forEach(v => mix[SEV.includes(v.sev) ? v.sev : 'unknown']++);
  const order = SEV.concat(['unknown']).filter(k => mix[k]);
  const total = cve.rows.length || 1;
  const S = 200, cx = 100, cy = 100, rOut = 82, rIn = 55;
  let a = -90;
  const arcs = order.map(k => {
    const sweep = 360*(mix[k]/total), a0 = a, a1 = a + sweep; a = a1;
    const gap = sweep > 6 ? 1.2 : 0;
    const [x0,y0] = polar(cx,cy,rOut,a0+gap), [x1,y1] = polar(cx,cy,rOut,a1-gap);
    const [x2,y2] = polar(cx,cy,rIn,a1-gap), [x3,y3] = polar(cx,cy,rIn,a0+gap);
    const large = (sweep-2*gap) > 180 ? 1 : 0;
    if (sweep >= 359.9) return `<circle cx="${cx}" cy="${cy}" r="${(rOut+rIn)/2}" fill="none"
      stroke="${SEV_GRAD[k]}" stroke-width="${rOut-rIn}"/>`;
    return `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${rOut} ${rOut} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}
      L ${x2.toFixed(1)} ${y2.toFixed(1)} A ${rIn} ${rIn} 0 ${large} 0 ${x3.toFixed(1)} ${y3.toFixed(1)} Z"
      fill="${SEV_GRAD[k]}" ${tip(`<b>${mix[k]} ${k}</b> · ${pct(mix[k],total)}% of records`)}
      ${pickAttr({ key:'sev:'+k, label:k+' findings', sev:k })}/>`;
  }).join('');
  const openShare = pct(cve.open, total);
  const legend = order.map(k => `<div class="dleg"${pickAttr({ key:'sev:'+k, label:k+' findings', sev:k })}
    ${tip(`${mix[k]} record${mix[k]===1?'':'s'} rated ${k}`)}>
    <s style="background:var(--sev-${k})"></s><span class="dl">${k}</span>
    <span class="dn">${mix[k]}</span><span class="dp">${pct(mix[k],total)}%</span></div>`).join('');
  /* per-severity triage ratio — the KubeClarity-style "x of y handled" read */
  const segs = order.map(k => {
    const all = cve.rows.filter(v => (SEV.includes(v.sev) ? v.sev : 'unknown') === k);
    const done = all.filter(v => !v.open).length;
    return `<div class="seg"><div class="sh"><b style="color:var(--sev-${k})">${k}</b>
      <em>${done} of ${all.length} triaged</em></div>
      <div class="st"><i style="width:${pct(done,all.length)}%;background:var(--sev-${k})"></i></div></div>`;
  }).join('');
  return `<div class="dwrap">
    <svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Vulnerability records by severity">${SVG_DEFS}
      <circle cx="${cx}" cy="${cy}" r="${(rOut+rIn)/2}" fill="none" stroke="#EEF2F8" stroke-width="${rOut-rIn}"/>
      ${arcs}
      <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="38" font-weight="800"
        letter-spacing="-2" fill="var(--ink)">${cve.total}</text>
      <text x="${cx}" y="${cy+17}" text-anchor="middle" font-size="9" font-family="var(--mono)"
        letter-spacing="1.6" fill="var(--ink3)">RECORDS</text>
      <text x="${cx}" y="${cy+32}" text-anchor="middle" font-size="10.5" font-weight="700"
        fill="${cve.open ? 'var(--bad)' : 'var(--ok)'}">${cve.open} open · ${openShare}%</text>
    </svg>
    <div><div class="dlegend">${legend}</div><div class="segs">${segs}</div></div></div>`;
}

/* --- SBOM · evidence mosaic --------------------------------------
   Q: how complete is this document, component by component?
   A coverage percentage says 68% and stops. This says which 32%, and
   lets someone hover the one red tile that is holding up a release. */
const EV_TIER = [
  { min:5, label:'Complete',  colour:'#059669' },
  { min:4, label:'One gap',   colour:'#34D399' },
  { min:3, label:'Two gaps',  colour:'#FBBF24' },
  { min:2, label:'Three gaps',colour:'#FB923C' },
  { min:0, label:'Bare record', colour:'#DC2626' }
];
const evTier = score => EV_TIER.find(t => score >= t.min) || EV_TIER[EV_TIER.length-1];
function evidenceMosaic(all, fields, cap = 1200){
  if (!all.length) return `<div class="none-box">No software components to profile.</div>`;
  /* Beyond the cap the incomplete records are the ones worth seeing, so the
     tail that gets dropped is drawn from the complete end, never the gaps. */
  const tiles = all.length <= cap
    ? all
    : all.slice().sort((a,b) => a.score - b.score).slice(0, cap);
  const dropped = all.length - tiles.length;
  /* tile size tracks population: 15 components should read as a chart, not as
     confetti in the corner of an empty panel */
  const size = tiles.length <= 24 ? 34 : tiles.length <= 60 ? 26
    : tiles.length <= 140 ? 19 : tiles.length <= 320 ? 15 : 10;
  const radius = Math.max(2.5, size*0.22);
  const cells = tiles.map((t,i) => {
    const tr = evTier(t.score);
    return `<i style="background:${tr.colour};width:${size}px;height:${size}px;flex-basis:${size}px;
      border-radius:${radius}px;animation-delay:${Math.min(600, i*4)}ms"
      ${pickAttr({ key:'ref:'+t.name, label:t.name, refs:[t.name] })}
      ${tip(`<b>${esc(t.name)}</b>${t.version ? ' ' + esc(t.version) : ''}<br>${t.score} of ${fields.length} evidence fields present
        ${t.missing.length ? '<br>missing: <i>' + esc(t.missing.join(', ')) + '</i>' : '<br><i>complete record</i>'}
        ${t.cves ? '<br><b style="color:#FCA5A5">' + t.cves + ' vulnerability record(s)</b>' : ''}`)}></i>`;
  }).join('');
  /* the legend counts the whole population even when the grid is capped,
     so the numbers never quietly describe a subset */
  const counts = EV_TIER.map(t => ({ ...t, n: all.filter(x => evTier(x.score).label === t.label).length }))
    .filter(t => t.n);
  const legend = counts.map(t => `<span${tip(`${t.n} component${t.n===1?'':'s'} · ${pct(t.n,all.length)}%`)}>
    <s style="background:${t.colour}"></s>${t.label} <b>${t.n}</b></span>`).join('');
  const capNote = dropped
    ? `<div class="upkey" style="margin-top:8px"><span>Grid shows the ${cap} least-complete records;
        ${dropped} fully or nearly complete component(s) are counted in the legend but not drawn.</span></div>` : '';
  return `<div class="mosaic">${cells}</div><div class="mosleg">${legend}</div>${capNote}`;
}

/* --- SBOM · declared vs concluded licence ------------------------
   Q: did the scanner agree with what upstream says about itself?
   SCANOSS emits both an as-declared and an as-concluded licence per
   component. Collapsing them throws away the only signal in the file
   that says whether the scan actually confirmed anything. */
const ACK_META = {
  agreed:          { label:'Scanner agrees with upstream', colour:'var(--ok)',
                     note:'declared and concluded licences match — this is the strongest evidence a scan produces' },
  divergent:       { label:'Scanner disagrees',            colour:'var(--bad)',
                     note:'the concluded licence differs from what upstream declares — read both before clearing' },
  'declared-only': { label:'Declared, never confirmed',    colour:'var(--warn)',
                     note:'taken on upstream’s word with no independent conclusion' },
  'concluded-only':{ label:'Concluded, nothing declared',  colour:'var(--violet)',
                     note:'inferred by the scanner with no upstream declaration to check it against' },
  unqualified:     { label:'No acknowledgement recorded',  colour:'var(--na)',
                     note:'the generator did not say whether this was declared or concluded' },
  none:            { label:'No licence at all',            colour:'var(--ink3)',
                     note:'nothing to agree or disagree about' }
};
function ackSplit(mix, total, divergent){
  const order = Object.keys(ACK_META).filter(k => mix[k]);
  if (!order.length) return `<div class="none-box">This document records no licence acknowledgement metadata.</div>`;
  const bar = order.map(k => `<i style="width:${100*mix[k]/total}%;background:${ACK_META[k].colour}"
    ${tip(`<b>${mix[k]} component${mix[k]>1?'s':''}</b> · ${pct(mix[k],total)}%<br>${esc(ACK_META[k].label)}<br><i>${esc(ACK_META[k].note)}</i>`)}></i>`).join('');
  const rows = order.map(k => `<div class="dleg"${tip(esc(ACK_META[k].note))}>
    <s style="background:${ACK_META[k].colour}"></s><span class="dl">${ACK_META[k].label}</span>
    <span class="dn">${mix[k]}</span><span class="dp">${pct(mix[k],total)}%</span></div>`).join('');
  const conf = pct(mix.agreed || 0, total);
  const divNote = divergent.length
    ? `<div class="insight badish"><s>!</s><span><b>${divergent.length} component${divergent.length>1?'s':''} where the scanner disagreed with upstream.</b>
        ${divergent.slice(0,3).map(d => esc(d.name) + ' — declared ' + esc(d.declared.join(', ')) + ', concluded ' + esc(d.concluded.join(', '))).join('; ')}${divergent.length>3?'; and '+(divergent.length-3)+' more':''}.
        Clear against the concluded terms, not the declared ones.</span></div>`
    : `<div class="insight"><s>i</s><span><b>${conf}% of components carry a confirmed licence</b> — declared and concluded agree.
        Anything outside that share rests on a single unchecked source.</span></div>`;
  return `<div class="pstb" style="height:26px;margin-bottom:13px">${bar}</div>
    <div class="dlegend">${rows}</div>${divNote}`;
}

/* --- SBOM · exposure window stats --------------------------------
   Q: how long has this been sitting open?
   Remediation velocity needs two BOMs to compute, so this reports the
   exposure window a single document can actually evidence: time since
   public disclosure for records still open here. */
function exposureStats(cve){
  const openDated = cve.rows.filter(v => v.open && v.age !== null).sort((a,b) => b.age - a.age);
  const med = openDated.length ? openDated[Math.floor(openDated.length/2)].age : null;
  const fmt = d => d === null ? '—' : d >= 730 ? (d/365).toFixed(1) + 'y' : d >= 90 ? Math.round(d/30) + 'mo' : d + 'd';
  const breach = openDated.filter(v => v.age > 90).length;
  const cells = [
    { v:fmt(med), k:'Median open age', e:'across ' + openDated.length + ' open, dated record(s)',
      tone: med === null ? '' : med > 90 ? 't-bad' : med > 30 ? 't-warn' : 't-ok' },
    { v:fmt(openDated.length ? openDated[0].age : null), k:'Oldest still open',
      e: openDated.length ? openDated[0].id : 'nothing open', tone: openDated.length && openDated[0].age > 365 ? 't-bad' : 't-warn' },
    { v:breach, k:'Past the 90-day line', e:'of ' + openDated.length + ' open', tone: breach ? 't-bad' : 't-ok' },
    { v:pct(cve.total - cve.open, cve.total) + '%', k:'Triage completion', e:(cve.total-cve.open) + ' of ' + cve.total + ' carry a defensible state',
      tone: cve.open ? 't-warn' : 't-ok' }
  ];
  return `<div class="expo" style="margin:16px 0 0">${cells.map(c => `<div><span>${c.k}</span><b class="${c.tone}">${c.v}</b><em>${esc(c.e)}</em></div>`).join('')}</div>`;
}

/* --- SBOM · component inventory ----------------------------------
   Q: which component, exactly?
   Every figure above aggregates. Auditors and engineers both end up
   asking for the row, so the row is here, filterable, rather than
   forcing an export to a spreadsheet. */
function inventoryTable(all, cap = 500){
  if (!all.length) return `<div class="none-box">No software components in this document.</div>`;
  /* rows are already ordered worst-first, so a cap drops the cleanest end */
  const rows = all.slice(0, cap), dropped = all.length - rows.length;
  const body = rows.map(c => {
    const tr = evTier(c.score);
    const sevChip = c.worstSev
      ? `<span class="schip" style="background:var(--sev-${c.worstSev});color:#fff">${c.cves} · ${c.worstSev}</span>`
      : `<span class="okdot">none recorded</span>`;
    const ackDot = ACK_META[c.ackState] || ACK_META.none;
    return `<tr data-inv="${esc((c.name+' '+(c.version||'')+' '+c.eco+' '+c.licenses.join(' ')+' '+(c.supplier||'')).toLowerCase())}"
      data-risk="${c.blocked ? 'blocked' : c.obligated ? 'obligated' : 'clear'}"
      data-vuln="${c.cves ? 'yes' : 'no'}"
      ${pickAttr({ key:'ref:'+c.name, label:c.name, refs:[c.name] })}
      ${tip(`<b>${esc(c.name)}</b><br>${esc(c.purl || 'no package URL')}<br>${esc(ackDot.note)}`)}>
      <td class="nmc">${esc(c.name)}<em>${esc(c.eco)}</em></td>
      <td class="mono">${c.version ? esc(c.version) : '<span class="miss">unresolved</span>'}</td>
      <td><span class="lchip"><s style="background:${LIC_COLOR(c.cls)}"></s>${esc(clipTxt(c.licenses.join(', ') || 'none', 26))}</span></td>
      <td${tip(esc(ackDot.label))}><s style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${ackDot.colour}"></s></td>
      <td class="mono">${c.supplier ? esc(clipTxt(c.supplier,16)) : '<span class="miss">none</span>'}</td>
      <td${tip(c.missing.length ? 'missing: ' + esc(c.missing.join(', ')) : 'complete record')}>
        <span class="evbar">${Array.from({length:5},(_,i) => `<s class="${i < c.score ? 'on' : ''}" style="${i < c.score ? 'background:'+tr.colour : ''}"></s>`).join('')}</span></td>
      <td>${sevChip}</td></tr>`;
  }).join('');
  return `<div class="invtools">
      <input id="invq" type="search" placeholder="Search ${rows.length} components by name, version, origin, licence or supplier…" autocomplete="off">
      <span class="chip on" data-invf="all">All</span>
      <span class="chip" data-invf="blocked">Cannot clear</span>
      <span class="chip" data-invf="obligated">Has obligations</span>
      <span class="chip" data-invf="vuln">Vulnerable</span>
    </div>
    <div class="invwrap"><div class="invscroll"><table class="inv">
      <thead><tr><th>Component</th><th>Version</th><th>Licence</th><th>Ack</th><th>Supplier</th>
        <th>Evidence</th><th>Advisories</th></tr></thead>
      <tbody id="invbody">${body}</tbody></table></div></div>
    <div class="upkey" style="margin-top:9px"><span id="invcount">${rows.length} of ${rows.length} components shown</span>
      ${dropped ? `<span style="margin-left:auto">Table is capped at ${cap} rows; ${dropped} further component(s) with no advisories and no licence obligations are not listed. Export the report for the full set.</span>` : ''}</div>`;
}

/* --- remediation plan ranked by leverage --------------------------
   Q: what do we do first, who owns it, and how much does it clear? */
function remediationPlan(plan, findings, blockers, cap = 10){
  const EFF = { S:['Small','var(--ok)'], M:['Medium','var(--warn)'], L:['Large','var(--bad)'] };
  const max = plan[0] ? plan[0].n : 1;
  const rows = plan.slice(0,cap).map((g,i) => `
    <div class="act"${pickAttr({ key:'act:'+g.act, label:g.act, refs:g.refs })}
      ${tip(`<b>${esc(g.act)}</b><br>clears ${g.n} finding${g.n>1?'s':''} across ${g.refs.length} item(s)<br>${g.blockers} of them blocking<br>rules: ${esc(g.rules.join(', '))}${g.unlock ? '<br><i>' + esc(g.unlock) + '</i>' : ''}`)}>
      <span class="rank">${i+1}</span>
      <span class="what"><b>${esc(g.act)}</b>
        <em>${esc(g.own)} · ${EFF[g.eff][0].toLowerCase()} effort · ${g.src.join(', ')}${g.unlock ? ' · ' + esc(g.unlock) : ''}</em></span>
      <span class="eff" style="color:${EFF[g.eff][1]}">${EFF[g.eff][0]}</span>
      <span class="clears"><i style="width:${100*g.n/max}%;background:${g.blockers?'var(--bad)':'var(--brand)'}"></i>
        ${g.blockers ? `<u style="width:${100*g.blockers/max}%"></u>` : ''}</span>
      <span class="cn2">${g.n}<em>${g.blockers} blocking</em></span></div>`).join('');
  const more = plan.length > cap ? `<div class="upkey"><span>${plan.length-cap} further action(s) covering ${plan.slice(cap).reduce((a,g)=>a+g.n,0)} findings</span></div>` : '';
  return `<div class="acthead"><span></span><span>Action</span><span>Effort</span><span>Findings cleared</span><span></span></div>
    ${rows}${more}<div class="upkey"><span>the pale bar is total findings cleared · the solid inset is the blocking share</span></div>`;
}

/* --- document provenance ------------------------------------------ */
function provenanceCard(docs){
  return docs.map(d => `<div class="prov">
    <div class="provh"><b>${esc(d.slot ? d.slot.toUpperCase() : '')}</b><span>${esc(d.label)}</span>
      <em style="color:${d.score>=80?'var(--ok)':d.score>=50?'var(--warn)':'var(--bad)'}">${d.score}%</em></div>
    ${d.checks.map(c => `<div class="provrow"${tip(esc(c.note))}>
      <s class="${c.ok ? (c.warn ? 'w' : 'y') : 'n'}">${c.ok ? (c.warn ? '△' : '✓') : '✕'}</s>
      <span class="pk">${c.k}</span><span class="pv">${esc(clipTxt(c.note,34))}</span></div>`).join('')}
  </div>`).join('');
}

/* --- AIBOM · lineage arcs ---------------------------------------- */
function arcLineage(nodes, links, cap = 26){
  const order = ['model','dataset','library'];
  let ns = nodes.slice().sort((a,b) => order.indexOf(a.kind) - order.indexOf(b.kind));
  const truncated = ns.length > cap;
  if (truncated){
    const deg = {}; links.forEach(l => { deg[l.from]=(deg[l.from]||0)+1; deg[l.to]=(deg[l.to]||0)+1; });
    ns = ns.filter(n => n.kind !== 'library' || deg[n.id]).concat().slice(0,cap);
  }
  if (!ns.length) return '<div class="none-box">No models or datasets to place.</div>';
  const keep = new Set(ns.map(n => n.id));
  const W=940, base=196, pad=40;
  const step = ns.length > 1 ? (W - pad*2)/(ns.length-1) : 0;
  const pos = {}; ns.forEach((n,i) => pos[n.id] = pad + i*step);
  const COL = { model:'var(--violet)', dataset:'var(--pink)', library:'var(--brand)' };
  const deg = {}; links.forEach(l => { deg[l.from]=(deg[l.from]||0)+1; deg[l.to]=(deg[l.to]||0)+1; });
  const nameOf = id => (nodes.find(n => n.id===id)||{}).name || id;
  const arcs = links.filter(l => keep.has(l.from) && keep.has(l.to)).map(l => {
    const x0=pos[l.from], x1=pos[l.to], rr=Math.abs(x1-x0)/2;
    const kind = (ns.find(n => n.id===l.to)||{}).kind;
    return `<path d="M ${x0.toFixed(1)} ${base} A ${rr.toFixed(1)} ${Math.min(rr,150).toFixed(1)} 0 0 ${x1>x0?1:0} ${x1.toFixed(1)} ${base}"
      fill="none" stroke="${COL[kind]||'var(--ink3)'}" stroke-width="1.4" opacity=".5"${tip(`${esc(nameOf(l.from))} → ${esc(nameOf(l.to))}`)}/>`;
  }).join('');
  const dots = ns.map(n => {
    const rel = links.filter(l => l.from===n.id || l.to===n.id).map(l => nameOf(l.from===n.id ? l.to : l.from));
    return `<g${pickAttr({ key:'ref:'+n.name, label:n.name, refs:[n.name, ...rel] })}
      ${tip(`<b>${esc(n.name)}</b><br>${n.kind}<br>${rel.length ? 'linked to ' + esc(list(rel)) : 'no declared links'}`)}>
      <circle cx="${pos[n.id].toFixed(1)}" cy="${base}" r="${(4+Math.min(4,deg[n.id]||0)).toFixed(1)}"
        fill="${COL[n.kind]}" stroke="#fff" stroke-width="1.5"/></g>`;
  }).join('');
  const labels = ns.map(n => `<text x="${pos[n.id].toFixed(1)}" y="${base+16}" font-size="10.5" fill="var(--ink2)"
    transform="rotate(38 ${pos[n.id].toFixed(1)} ${base+16})">${esc(clipTxt(n.name,16))}</text>`).join('');
  const key = order.map((k,i) => `<g><circle cx="${12+i*112}" cy="12" r="5" fill="${COL[k]}"/>
    <text x="${23+i*112}" y="15.5" font-size="11.5" fill="var(--ink2)">${k==='library'?'libraries':k+'s'}</text></g>`).join('');
  return `<svg viewBox="0 0 ${W+110} 288" role="img" aria-label="Lineage between models, datasets and libraries">
    ${key}<line x1="10" y1="${base}" x2="${W-10}" y2="${base}" stroke="#E4EAF3"/>${arcs}${dots}${labels}</svg>`;
}

/* --- AIBOM · release-readiness quadrant --------------------------- */
function quadrant(points){
  const W=880,H=420,L=76,T=34,R=26,B=52,IN=38;
  const px = v => L+IN+(W-L-R-IN*2)*v/100, py = v => T+IN+(H-T-B-IN*2)*(1-v/100);
  const bands = `<rect x="${L}" y="${T}" width="${(W-L-R)/2}" height="${(H-T-B)/2}" fill="var(--warn-soft)"/>
    <rect x="${L+(W-L-R)/2}" y="${T}" width="${(W-L-R)/2}" height="${(H-T-B)/2}" fill="var(--ok-soft)"/>
    <rect x="${L}" y="${T+(H-T-B)/2}" width="${(W-L-R)/2}" height="${(H-T-B)/2}" fill="var(--bad-soft)"/>
    <rect x="${L+(W-L-R)/2}" y="${T+(H-T-B)/2}" width="${(W-L-R)/2}" height="${(H-T-B)/2}" fill="var(--warn-soft)"/>`;
  const dots = points.map(p => `<g${pickAttr({ key:'ref:'+p.name, label:p.name, refs:[p.name] })}
    ${tip(`<b>${esc(p.name)}</b><br>${LIC_LABEL[p.lic]} · evidence ${p.y}%<br>${p.r} dataset link${p.r===1?'':'s'}${p.missing.length ? '<br>missing: ' + esc(p.missing.join(', ')) : '<br>evidence complete'}`)}>
    <circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="${(12+p.r*4).toFixed(1)}" fill="${LIC_COLOR(p.lic)}" opacity=".26"/>
    <circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="6" fill="${LIC_COLOR(p.lic)}" stroke="#fff" stroke-width="2"/>
    <text x="${Math.min(W-R-4,Math.max(L+4,px(p.x))).toFixed(1)}" y="${(py(p.y) - 14 < T + 34 ? py(p.y) + 24 : py(p.y) - 14).toFixed(1)}"
      text-anchor="${px(p.x)>W-R-110?'end':px(p.x)<L+110?'start':'middle'}" font-size="12" fill="var(--ink2)">${esc(clipTxt(p.name,22))}</text></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Models by licence permissiveness and evidence completeness">
    ${bands}<line x1="${L}" y1="${T+(H-T-B)/2}" x2="${W-R}" y2="${T+(H-T-B)/2}" stroke="#E4EAF3" stroke-dasharray="3 3"/>
    <line x1="${L+(W-L-R)/2}" y1="${T}" x2="${L+(W-L-R)/2}" y2="${H-B}" stroke="#E4EAF3" stroke-dasharray="3 3"/>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="none" stroke="#E4EAF3"/>${dots}
    <text x="${L+12}" y="${T+15}" font-size="9.5" font-family="var(--mono)" letter-spacing="1" fill="var(--warn)" opacity=".85">EVIDENCE OK · TERMS RISKY</text>
    <text x="${W-R-12}" y="${T+15}" text-anchor="end" font-size="9.5" font-family="var(--mono)" letter-spacing="1" fill="var(--ok)" opacity=".85">CLEARED TO SHIP</text>
    <text x="${L+12}" y="${H-B-8}" font-size="9.5" font-family="var(--mono)" letter-spacing="1" fill="var(--bad)" opacity=".85">BLOCKED · TERMS AND EVIDENCE</text>
    <text x="${W-R-12}" y="${H-B-8}" text-anchor="end" font-size="9.5" font-family="var(--mono)" letter-spacing="1" fill="var(--warn)" opacity=".85">TERMS OK · EVIDENCE THIN</text>
    <text x="${L}" y="${H-20}" font-size="11" font-family="var(--mono)" fill="var(--ink3)">RESTRICTED / UNDECLARED</text>
    <text x="${W-R}" y="${H-20}" text-anchor="end" font-size="11" font-family="var(--mono)" fill="var(--ink3)">PERMISSIVE</text>
    <text x="22" y="${(T+(H-T-B)/2).toFixed(1)}" text-anchor="middle" font-size="11" font-family="var(--mono)"
      fill="var(--ink3)" transform="rotate(-90 22 ${(T+(H-T-B)/2).toFixed(1)})">EVIDENCE →</text>
    <text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--ink3)">licence permissiveness →</text></svg>`;
}

/* --- AIBOM · licence inheritance matrix --------------------------- */
function compatMatrix(compat){
  const { models, datasets } = compat;
  if (!models.length || !datasets.length) return '<div class="none-box">No model-to-dataset relationships declared, so inheritance cannot be assessed.</div>';
  const STATE = { conflict:['var(--bad)','#fff','stricter than the model'], equal:['var(--warn-soft)','var(--warn)','same class'],
    ok:['var(--ok-soft)','var(--ok)','looser than the model'], none:['','','not used for training'] };
  const head = `<div class="ch"></div>` + datasets.map(d =>
    `<div class="ch"${tip(`<b>${esc(d.name)}</b><br>${LIC_LABEL[d.lic]}`)}><s style="background:${LIC_COLOR(d.lic)}"></s>${esc(clipTxt(d.name,18))}</div>`).join('');
  const rows = models.map(m => `<div class="rh"
      ${tip(`<b>${esc(m.name)}</b><br>${LIC_LABEL[m.lic]}<br>${m.linked ? 'training data declared' : '<i>no training data declared — no lineage at all</i>'}`)}>
      <s style="background:${LIC_COLOR(m.lic)}"></s>${esc(clipTxt(m.name,20))}${m.linked ? '' : '<b class="nolin">no lineage</b>'}</div>` +
    m.cells.map(c => { const [bg,fg,label] = STATE[c.state]; const ds = datasets.find(d => d.id===c.id)||{};
      return `<div class="cc ${c.state}" style="${bg?`background:${bg};color:${fg}`:''}"
        ${tip(`<b>${esc(m.name)}</b> ← <b>${esc(ds.name||'')}</b><br>${label}${c.state!=='none'?`<br>model ${LIC_LABEL[m.lic].toLowerCase()} · data ${LIC_LABEL[c.dlic].toLowerCase()}`:''}`)}
        ${c.state!=='none' ? pickAttr({ key:'ref:'+m.name, label:m.name+' ← '+(ds.name||''), refs:[m.name, ds.name] }) : ''}
        >${c.state==='conflict'?'!':c.state==='none'?'':'·'}</div>`; }).join('')).join('');
  return `<div class="grid-mat" style="grid-template-columns:190px repeat(${datasets.length},minmax(0,1fr))">${head}${rows}</div>`;
}

/* ==================================================================
   5d · AIBOM FIGURES
   The existing panels answer "can this model ship". These answer what
   an AI-governance reviewer asks next: what does the card actually
   document, does the prose agree with the declared fields, and who is
   accountable for the training data.
   ================================================================== */

/* --- AIBOM · model card anatomy -----------------------------------
   Q: which part of the card is missing?
   CycloneDX gives a model card a fixed shape, so this draws the shape
   itself and lights up what is populated. One percentage would say
   25% and stop; the parts are not interchangeable, and an empty
   Considerations block is a governance gap where an empty Inputs
   block is a documentation one. Borrowed from an anatomy/schematic
   idiom rather than a bar chart, because the reader needs to see the
   organ that is missing, not a number. */
function cardAnatomyPanel(cards){
  if (!cards.length) return `<div class="none-box">No models declared, so there is no card to anatomise.</div>`;
  const GTONE = { modelParameters:'var(--brand)', quantitativeAnalysis:'var(--violet)', considerations:'var(--pink)' };
  return cards.map(c => {
    if (!c.hasCard) return `<div class="none-box">${esc(c.name)} carries no <code>modelCard</code> at all.</div>`;
    const groups = c.groups.map(g => {
      const cells = g.fields.map(f => `<div class="acell ${f.value?'on':'off'}"
        ${tip(f.value
          ? `<b>${esc(f.label)}</b><br>${esc(clipTxt(f.value, 70))}`
          : `<b>${esc(f.label)}</b> is not recorded in this card`)}>
        <s style="${f.value?'background:'+GTONE[g.key]:''}"></s><span>${esc(f.label)}</span></div>`).join('');
      const full = g.have === g.of, none = g.have === 0;
      return `<div class="agroup ${none?'empty':full?'full':''}" style="--gt:${GTONE[g.key]}">
        <div class="ah"><b>${esc(g.label)}</b><em>${esc(g.hint)}</em>
          <u class="${none?'t-bad':full?'t-ok':'t-warn'}">${g.have}/${g.of}</u></div>
        <div class="acells">${cells}</div></div>`;
    }).join('');
    const conGroup = c.groups.find(g => g.key === 'considerations');
    const note = conGroup && conGroup.have === 0
      ? `<div class="insight badish"><s>!</s><span>The entire <b>Considerations</b> block is empty — no intended users,
          no limitations, no ethical or fairness assessment. That is the section every AI governance framework asks for
          first, and it is the one part of a card that cannot be reconstructed from the weights.</span></div>`
      : `<div class="insight"><s>i</s><span><b>${c.have} of ${c.of}</b> card fields populated across all three blocks.</span></div>`;
    return `<div class="anat"${pickAttr({ key:'model:'+c.name, label:c.name, refs:[c.name] })}>
      <div class="anath"><b>${esc(c.name)}</b>
        <span class="ameter"><i style="width:${c.pctv}%"></i></span>
        <u class="${c.pctv>=70?'t-ok':c.pctv>=35?'t-warn':'t-bad'}">${c.pctv}%</u></div>
      ${groups}</div>${note}`;
  }).join('');
}

/* --- AIBOM · sensitivity reconciliation ---------------------------
   Q: does the prose agree with the declared fields?
   The left column is read from the free-text description; the right
   is what the document formally declares. This CANNOT assert that a
   dataset contains personal data — only that the description says one
   thing and the fields say nothing, which is a question for a human.
   Phrased throughout as unreconciled, never as a finding of fact. */
function sensitivityPanel(rows){
  if (!rows.length) return `<div class="none-box">No datasets declared.</div>`;
  const body = rows.map(s => `<div class="srow ${s.unreconciled?'warn':''}"
    ${pickAttr({ key:'ds:'+s.name, label:s.name, refs:[s.name] })}>
    <div class="sname">${esc(clipTxt(s.name, 46))}</div>
    <div class="sclaim">${s.hits.length
      ? s.hits.map(h => `<span class="pchip">${esc(h)}</span>`).join('')
      : `<em>description mentions nothing sensitive</em>`}</div>
    <div class="sdecl">${s.declared
      ? `<b class="t-ok">${esc(s.classification || s.sensitiveData || 'declared')}</b>`
      : `<b class="${s.hits.length?'t-bad':'t-na'}">not declared</b>`}</div>
    <div class="sverdict">${s.unreconciled
      ? `<span class="schip" style="background:var(--warn);color:#fff">reconcile</span>`
      : s.declared ? `<span class="okdot">consistent</span>` : `<span class="okdot">—</span>`}</div>
  </div>`).join('');
  const n = rows.filter(s => s.unreconciled).length;
  return `<div class="stable">
      <div class="srow shead"><div>Dataset</div><div>What the description says</div><div>What the fields declare</div><div></div></div>
      ${body}</div>
    ${n ? `<div class="insight warnish"><s>▲</s><span><b>${n} dataset${n>1?'s':''}</b> describe${n>1?'':'s'} sensitive
        content in prose while declaring no <code>classification</code> or <code>sensitiveData</code>. Either the field
        should be set, or the description is misleading — but the two cannot both stand.</span></div>`
      : `<div class="insight"><s>✓</s><span>Nothing in the descriptions contradicts the declared sensitivity fields.</span></div>`}
    <div class="upkey" style="margin-top:8px"><span>The left column is pattern-matched from free text, not a declared field. It raises a question; it does not establish that personal data is present.</span></div>`;
}

/* --- AIBOM · accountability chain --------------------------------
   Q: who is answerable for the training data?
   CycloneDX splits data governance into owners, stewards and
   custodians deliberately — they are different obligations. A single
   party filling every role, or roles left empty, is the thing worth
   seeing. */
function governancePanel(rows, allParties, singleParty){
  if (!rows.length) return `<div class="none-box">No datasets declared, so there is no governance chain to trace.</div>`;
  const ROLES = [
    { k:'owners', label:'Owner', hint:'accountable for the data' },
    { k:'stewards', label:'Steward', hint:'decides how it may be used' },
    { k:'custodians', label:'Custodian', hint:'holds and protects it' }
  ];
  const body = rows.map(g => `<div class="grow"${pickAttr({ key:'ds:'+g.name, label:g.name, refs:[g.name] })}>
    <div class="gname">${esc(clipTxt(g.name, 44))}</div>
    ${ROLES.map(r => `<div class="gcell ${g[r.k].length?'on':'off'}"
      ${tip(g[r.k].length ? `<b>${r.label}</b>: ${esc(g[r.k].join(', '))}` : `No ${r.label.toLowerCase()} recorded for this dataset`)}>
      ${g[r.k].length ? esc(clipTxt(g[r.k].join(', '), 18)) : '—'}</div>`).join('')}
  </div>`).join('');
  const emptyRoles = ROLES.filter(r => rows.every(g => !g[r.k].length));
  const note = singleParty
    ? `<div class="insight warnish"><s>▲</s><span>Every recorded role across every dataset is held by
        <b>${esc(singleParty)}</b>. There is no independent party in the chain, so the document attests to itself.</span></div>`
    : allParties.length
      ? `<div class="insight"><s>i</s><span><b>${allParties.length} distinct parties</b> appear in the governance chain.</span></div>`
      : `<div class="insight badish"><s>!</s><span>No governance roles are recorded at all — nobody is named as accountable for this training data.</span></div>`;
  return `<div class="gtable">
      <div class="grow ghead"><div>Dataset</div>${ROLES.map(r => `<div${tip(esc(r.hint))}>${r.label}</div>`).join('')}</div>
      ${body}</div>
    ${note}
    ${emptyRoles.length ? `<div class="upkey" style="margin-top:8px"><span>No dataset records a
      ${emptyRoles.map(r => r.label.toLowerCase()).join(' or ')} — CycloneDX separates these roles because they are different obligations.</span></div>` : ''}`;
}

/* --- AIBOM · inherited lineage, declared and implied ---------------
   Q: what does this model actually inherit from?
   A layered provenance graph. Solid nodes are declared components.
   Dashed "ghost" nodes are artefacts the document names in prose or
   tags but never declares — the models that labelled the training
   data, and the runtime stack. Those upstreams shaped the data, so
   their behaviour reaches the model, but nothing in the BOM says so.
   The interesting nodes here are the ones that are not in the data,
   which is why this is a graph and not a list.
   Ghosts are CANDIDATES extracted heuristically from free text. Each
   carries the sentence it came from so a reader can dismiss a bad
   one in a glance. Nothing here is asserted as a real dependency. */
function lineageGraph(a){
  const models = a.modelNames || [], datasets = a.dataNames || [];
  if (!models.length && !datasets.length) return `<div class="none-box">No models or datasets declared.</div>`;
  const upstream = a.implied.prose, stack = a.implied.tags;
  const W = 1000, NW = 196, NH = 42, GAP = 14;
  const cols = [
    { key:'upstream', label:'IMPLIED UPSTREAM', items:upstream.map(u => ({ ...u, ghost:true })) },
    { key:'data',     label:'TRAINING DATA',    items:datasets.map(d => ({ name:d.name, id:d.id })) },
    { key:'model',    label:'MODEL',            items:models.map(n => ({ name:n })) },
    { key:'stack',    label:'IMPLIED STACK',    items:stack.map(s => ({ ...s, ghost:true })) }
  ].filter(c => c.items.length);
  const colX = i => cols.length === 1 ? (W-NW)/2 : 14 + i*((W-NW-28)/(cols.length-1));
  const maxRows = Math.max(...cols.map(c => c.items.length));
  const H = 40 + maxRows*(NH+GAP) + 24;
  const colY = c => { const n = c.items.length;
    const total = n*NH + (n-1)*GAP;
    return (idx) => 40 + ((H-64-total)/2) + idx*(NH+GAP); };
  const pos = {};
  cols.forEach((c,ci) => { const y = colY(c); c.items.forEach((it,ii) => {
    pos[c.key+':'+ii] = { x:colX(ci), y:y(ii), item:it, col:c.key }; }); });

  const edge = (from, to, ghost, label) => {
    const x1 = from.x+NW, y1 = from.y+NH/2, x2 = to.x, y2 = to.y+NH/2, mx = (x1+x2)/2;
    return `<path d="M ${x1} ${y1} C ${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none"
      stroke="${ghost?'var(--ink3)':'var(--brand)'}" stroke-width="${ghost?1.4:2}"
      ${ghost?'stroke-dasharray="5 4"':''} opacity="${ghost?.6:.75}" marker-end="url(#lgArrow)"/>`;
  };
  let edges = '';
  /* implied upstream → the dataset whose description named it */
  cols.find(c => c.key==='upstream') && upstream.forEach((u,ui) => {
    const di = datasets.findIndex(d => d.id === u.viaId);
    if (di < 0) return;
    edges += edge(pos['upstream:'+ui], pos['data:'+di], true);
  });
  /* datasets → model (declared lineage) */
  if (pos['model:0']) datasets.forEach((d,di) => { if (pos['data:'+di]) edges += edge(pos['data:'+di], pos['model:0'], false); });
  /* model → implied stack */
  if (pos['model:0']) stack.forEach((s,si) => { edges += edge(pos['model:0'], pos['stack:'+si], true); });

  const nodes = Object.entries(pos).map(([k,p]) => {
    const it = p.item, ghost = !!it.ghost;
    const kindLabel = p.col === 'model' ? 'model' : p.col === 'data' ? 'dataset'
      : p.col === 'stack' ? (it.kind || 'framework') : 'model (implied)';
    const tone = ghost ? 'var(--ink3)' : p.col === 'model' ? 'var(--violet)' : 'var(--teal)';
    return `<g${pickAttr({ key:'ln:'+it.name, label:it.name, refs:ghost ? [it.via] : [it.name] })}
      ${tip(ghost
        ? `<b>${esc(it.name)}</b> — candidate, not declared<br>named in ${esc(it.via || 'this document')}<br><i>${esc(it.evidence || '')}</i>`
        : `<b>${esc(it.name)}</b><br>declared ${kindLabel}`)}>
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="10"
        fill="${ghost?'rgba(255,255,255,.55)':'#fff'}" stroke="${tone}" stroke-width="${ghost?1.4:2}"
        ${ghost?'stroke-dasharray="5 4"':''}/>
      <text x="${p.x+12}" y="${p.y+18}" font-size="11.5" font-weight="${ghost?600:700}"
        fill="${ghost?'var(--ink2)':'var(--ink)'}">${esc(clipTxt(it.name, 26))}</text>
      <text x="${p.x+12}" y="${p.y+32}" font-size="9.5" font-family="var(--mono)"
        fill="var(--ink3)">${esc(kindLabel)}${ghost?' · candidate':''}</text>
    </g>`;
  }).join('');
  const heads = cols.map((c,ci) => `<text x="${colX(ci)}" y="22" font-size="9" font-family="var(--mono)"
    letter-spacing="1.4" fill="var(--ink3)">${c.label}</text>`).join('');
  const note = upstream.length
    ? `<div class="insight warnish"><s>▲</s><span><b>${upstream.length} upstream artefact${upstream.length>1?'s':''}</b>
        ${upstream.length>1?'are':'is'} named in the dataset descriptions but declared nowhere —
        ${upstream.slice(0,3).map(u => '<b>'+esc(u.name)+'</b>').join(', ')}.
        ${upstream.some(u => /deidentifier|deberta|bert|model/i.test(u.name))
          ? 'Models that labelled the training data pass their own behaviour into anything trained on it, so this is an inheritance the BOM does not record.'
          : 'Confirm whether these belong in the component list.'}</span></div>`
    : `<div class="insight"><s>✓</s><span>Nothing in the descriptions names an upstream artefact that the document fails to declare.</span></div>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="lgraph" role="img"
      aria-label="Declared and implied lineage for this model">
    <defs><marker id="lgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink3)"/></marker></defs>
    ${heads}${edges}${nodes}</svg>${note}`;
}

/* --- AIBOM · regulatory evidence crosswalk -------------------------
   Q: which questions the AI-governance frameworks ask can this
   document answer at all?
   This reports EVIDENCE AVAILABILITY, not compliance. A green row
   means the field is populated — never that the obligation is met,
   which is a judgement no BOM can make. Rows the format has no field
   for are marked "not expressible" rather than scored as failures,
   because penalising a document for something it structurally cannot
   carry would be a made-up number. */
const CW_TONE = { yes:'var(--ok)', part:'var(--warn)', no:'var(--bad)', na:'var(--na)' };
const CW_MARK = { yes:'●', part:'◐', no:'○', na:'–' };
const CW_WORD = { yes:'evidenced', part:'partial', no:'absent', na:'not expressible' };
function crosswalkPanel(rows, evidenced, scored){
  if (!rows.length) return `<div class="none-box">No model declared, so there is nothing to cross-reference.</div>`;
  const body = rows.map(r => `<div class="cwrow ${r.status}"
    ${pickAttr({ key:'cw:'+r.area, label:r.area })}
    ${tip(`<b>${esc(r.area)}</b> — ${CW_WORD[r.status]}<br>fields: <i>${esc(r.fields)}</i><br>${esc(r.fix)}`)}>
    <div class="cwm" style="color:${CW_TONE[r.status]}">${CW_MARK[r.status]}</div>
    <div class="cwa"><b>${esc(r.area)}</b><em>${esc(r.fields)}</em></div>
    <div class="cwf">${(r.asks||[]).map(f => `<span>${esc(f)}</span>`).join('')}</div>
    <div class="cws" style="color:${CW_TONE[r.status]}">${CW_WORD[r.status]}</div>
  </div>`).join('');
  const naN = rows.filter(r => r.status === 'na').length;
  return `<div class="cwtable">
      <div class="cwrow cwhead"><div></div><div>Question the frameworks ask</div><div>Asked by</div><div>Evidence</div></div>
      ${body}</div>
    <div class="insight ${evidenced === 0 ? 'badish' : evidenced < scored/2 ? 'warnish' : ''}">
      <s>${evidenced === 0 ? '!' : 'i'}</s><span>This document fully evidences <b>${evidenced} of ${scored}</b>
      answerable questions${naN ? `, with ${naN} more that no BOM format can carry` : ''}.
      ${evidenced === 0
        ? 'Nothing here is a compliance failure by itself — but a reviewer asking any of these gets no answer from this document.'
        : 'The remainder need fields populating, not new tooling.'}</span></div>
    <div class="upkey" style="margin-top:8px"><span>Evidence availability, not compliance. A populated field means the question can be answered from the document; it does not mean the obligation is met.</span></div>`;
}

/* ==================================================================
   5c · CBOM FIGURES
   The existing panels answer "what crypto is here and how far does it
   reach". These answer three questions a cryptography assessor asks
   next and the old build could not: can you prove what you found,
   what does the codebase actually perform, and where did it come from.
   Every field used is one the CBOM generator already emits.
   ================================================================== */
const BAND_COLOR = { retired:'var(--bad)', unassessed:'var(--na)',
  classical:'var(--warn)', pqc:'var(--ok)' };
const BAND_LABEL = { retired:'Retired', unassessed:'Not assessed',
  classical:'Quantum-vulnerable', pqc:'Quantum-resistant' };

/* --- CBOM · assurance evidence matrix ----------------------------
   Q: could we prove any of this in an audit?
   Algorithms down the side, the six evidence fields across. A green
   row is defensible; a mostly-empty row means the algorithm was
   detected by name and nothing more, which is a very different claim
   from "we have an inventory". */
function assuranceMatrix(rows){
  if (!rows.length) return `<div class="none-box">No algorithms to assess.</div>`;
  const cols = rows[0].checks.map(c => c.k);
  const head = cols.map(c => `<th><span>${esc(c)}</span></th>`).join('');
  const body = rows.slice().sort((a,b) => a.score - b.score || a.name.localeCompare(b.name)).map(r0 => {
    const cells = r0.checks.map(c => `<td class="${c.ok?'y':'n'}"${tip(c.ok
      ? `<b>${esc(r0.name)}</b> records ${esc(c.k)}`
      : `<b>${esc(r0.name)}</b> has no ${esc(c.k)} recorded`)}>${c.ok?'●':'○'}</td>`).join('');
    return `<tr${pickAttr({ key:'algo:'+r0.name, label:r0.name, refs:[r0.name] })}>
      <th scope="row"><s style="background:${BAND_COLOR[r0.band]}"></s>
        <span>${esc(r0.name)}</span><em>${esc(BAND_LABEL[r0.band])}</em></th>
      ${cells}
      <td class="sc"><b style="color:${r0.score>=5?'var(--ok)':r0.score>=3?'var(--warn)':'var(--bad)'}">${r0.score}</b><i>/${r0.of}</i></td></tr>`;
  }).join('');
  const perCol = cols.map((c,i) => ({ c, n: rows.filter(r0 => r0.checks[i].ok).length }));
  const weakest = perCol.slice().sort((a,b) => a.n - b.n)[0];
  return `<div class="amx"><table>
      <thead><tr><th class="corner">algorithm</th>${head}<th class="sc">score</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <div class="insight ${weakest.n === 0 ? 'badish' : 'warnish'}"><s>${weakest.n === 0 ? '!' : '▲'}</s><span>
      <b>${esc(weakest.c)}</b> is the weakest column — recorded for ${weakest.n} of ${rows.length} algorithms.
      ${weakest.n === 0
        ? 'Not one algorithm carries it, which points at the generator rather than the codebase: it is a field the tool never populates.'
        : 'Filling it is a generator change, not a code change.'}</span></div>`;
}

/* --- CBOM · what the codebase performs ---------------------------
   Q: what cryptographic operations does this software actually do?
   cryptoFunctions is a closed CycloneDX vocabulary, so the axis is
   fixed and the panel holds its shape at any inventory size. Each bar
   is coloured by the *weakest* algorithm performing that function,
   because a function is only as sound as its weakest carrier. */
function functionCoverage(rows, totalSites){
  if (!rows.length) return `<div class="none-box">No <code>cryptoFunctions</code> recorded, so what this code performs cannot be shown.</div>`;
  const max = Math.max(...rows.map(r0 => r0.sites), 1);
  const bars = rows.map(r0 => `<div class="fnrow"${pickAttr({ key:'fn:'+r0.fn, label:r0.fn+' operations', refs:r0.names })}
    ${tip(`<b>${esc(r0.fn)}</b><br>${r0.n} algorithm${r0.n>1?'s':''} · ${r0.sites} call site${r0.sites>1?'s':''}<br>
      weakest carrier is <b>${esc(BAND_LABEL[r0.worst])}</b><br><i>${esc(r0.names.join(', '))}</i>`)}>
    <span class="fnk">${esc(r0.fn)}</span>
    <span class="fnb"><i style="width:${Math.max(4,(r0.sites/max)*100)}%;background:${BAND_COLOR[r0.worst]}"></i></span>
    <span class="fnn">${r0.sites}</span>
    <span class="fnc" style="color:${BAND_COLOR[r0.worst]}">${esc(BAND_LABEL[r0.worst])}</span></div>`).join('');
  const risky = rows.filter(r0 => r0.worst === 'retired' || r0.worst === 'classical');
  const note = risky.length
    ? `<div class="insight badish"><s>!</s><span>
        <b>${risky.map(r0 => esc(r0.fn)).join(', ')}</b> ${risky.length===1?'is':'are'} performed by
        quantum-vulnerable or retired cryptography. Those operations, not the algorithm names, are what has to keep working after a migration.</span></div>`
    : `<div class="insight"><s>i</s><span>No operation here rests on a retired or quantum-vulnerable carrier.</span></div>`;
  return `<div class="fnwrap">${bars}</div>${note}`;
}

/* --- CBOM · algorithm provenance ---------------------------------
   Q: if we swap a library, what cryptography moves with it?
   Driven by cbom:library. When the generator did not attribute an
   algorithm to a library the panel says so plainly rather than
   inventing an "unknown" vendor that reads like a finding. */
function cryptoProvenance(groups, anyAttributed){
  if (!anyAttributed) return `<div class="none-box">This CBOM does not attribute any algorithm to a providing library
    (<code>cbom:library</code>), so provenance cannot be traced. Worth raising with whoever owns the generator.</div>`;
  const total = groups.reduce((a,g) => a + g.algos.length, 0);
  const maxSites = Math.max(...groups.map(g => g.sites), 1);
  return `<div class="provlist">${groups.map(g => `
    <div class="provitem ${g.attributed?'':'unattr'}"${pickAttr({ key:'lib:'+g.name, label:g.name, refs:g.algos })}
      ${tip(g.attributed
        ? `<b>${esc(g.name)}</b> supplies ${g.algos.length} algorithm${g.algos.length>1?'s':''} across ${g.sites} call site${g.sites>1?'s':''}`
        : `${g.algos.length} algorithm${g.algos.length>1?'s':''} the generator did not attribute to any library`)}>
      <div class="ph"><b>${g.attributed ? esc(g.name) : 'Not attributed'}</b>
        <em>${g.algos.length} algorithm${g.algos.length>1?'s':''} · ${g.sites} site${g.sites>1?'s':''}</em></div>
      <div class="pb"><i style="width:${(g.sites/maxSites)*100}%"></i></div>
      <div class="pt">${g.algos.map(a => `<span>${esc(a)}</span>`).join('')}</div>
    </div>`).join('')}</div>
    <div class="insight"><s>i</s><span>${
      groups.filter(g => g.attributed).length
        ? `<b>${pct(groups.filter(g => g.attributed).reduce((a,g) => a+g.algos.length,0), total)}%</b> of algorithms trace to a named library — those move as a unit if that library is replaced.`
        : 'No algorithm traces to a named library.'
    } The rest were detected in source without an attributable provider.</span></div>`;
}
/* --- CBOM · call-site map (source ideogram) -----------------------
   Q: is the cryptography in this file bundled together, or smeared
   through it?
   Every other panel counts sightings. This one plots them where they
   actually sit. Each row is a file drawn on a shared line-number
   scale, with a tick at every recorded occurrence coloured by risk
   band. Tight clusters are one edit; scattered ticks are a read of
   the whole file. Borrowed from the ideogram/genome-browser idiom
   rather than any standard business chart, because the question —
   "where in this thing are the interesting bits" — is the same one. */
function callSiteMap(files, cap = 16){
  if (!files.length) return `<div class="none-box">No source evidence recorded, so call sites cannot be placed.</div>`;
  const withLines = files.filter(f => f.maxLine > 0);
  if (!withLines.length) return `<div class="none-box">Occurrences are recorded without line numbers, so position within each file is unknown. The generator emits <code>location</code> but not <code>line</code>.</div>`;
  const shown = withLines.slice(0, cap), dropped = withLines.length - shown.length;
  const globalMax = Math.max(...shown.map(f => f.maxLine));
  const LBL = 232, W = 1000, R = 54, rowH = 27, TOP = 26;
  const H = TOP + shown.length*rowH + 16;
  const x = ln => LBL + (W-LBL-R) * (ln/globalMax);
  const BAND_C = { ...BAND_COLOR, library:'var(--brand)' };
  const rows = shown.map((f,i) => {
    const y = TOP + i*rowH;
    const mid = y + rowH/2 - 3;
    /* group identical lines so overlapping ticks don't hide each other */
    const byLine = {};
    f.marks.forEach(m => (byLine[m.line] = byLine[m.line] || []).push(m));
    const ticks = Object.entries(byLine).map(([ln, ms]) => {
      const m = ms[0], px = x(Number(ln));
      const names = [...new Set(ms.map(z => z.name))];
      return `<g${pickAttr({ key:'site:'+f.path+':'+ln, label:f.file+':'+ln, refs:names })}
        ${tip(`<b>${esc(f.file)}:${ln}</b><br>${esc(names.join(', '))}<br>${esc(BAND_LABEL[m.band] || 'Supporting library')}`)}>
        <line x1="${px.toFixed(1)}" y1="${(mid-8).toFixed(1)}" x2="${px.toFixed(1)}" y2="${(mid+8).toFixed(1)}"
          stroke="${BAND_C[m.band]}" stroke-width="${ms.length>1?3.6:2.4}" stroke-linecap="round"/>
        ${ms.length>1 ? `<circle cx="${px.toFixed(1)}" cy="${(mid-11).toFixed(1)}" r="2.4" fill="${BAND_C[m.band]}"/>` : ''}
      </g>`;
    }).join('');
    /* span bar behind the ticks: first sighting to last */
    const span = f.minLine !== f.maxLine
      ? `<rect x="${x(f.minLine).toFixed(1)}" y="${(mid-2).toFixed(1)}" width="${(x(f.maxLine)-x(f.minLine)).toFixed(1)}"
          height="4" rx="2" fill="${BAND_C[f.worst]}" opacity=".18"/>` : '';
    return `<g>
      <rect x="0" y="${y}" width="${W}" height="${rowH}" fill="${i%2?'rgba(148,163,184,.05)':'transparent'}"/>
      <text x="${LBL-12}" y="${(mid+4).toFixed(1)}" text-anchor="end" font-size="11.5" fill="var(--ink2)"
        ${tip(`<b>${esc(f.path)}</b><br>${f.n} sighting${f.n>1?'s':''} · lines ${f.minLine}–${f.maxLine}<br>${esc(f.assets.join(', '))}`)}>${esc(clipTxt(f.file, 30))}</text>
      <line x1="${LBL}" y1="${(mid).toFixed(1)}" x2="${W-R}" y2="${(mid).toFixed(1)}" stroke="var(--grid)"/>
      ${span}${ticks}
      <text x="${W-R+10}" y="${(mid+4).toFixed(1)}" font-size="10.5" font-family="var(--mono)"
        fill="${f.clustered ? 'var(--ok)' : 'var(--ink3)'}">${f.clustered ? 'tight' : f.n + '×'}</text>
    </g>`;
  }).join('');
  const scale = [0, .25, .5, .75, 1].map(t => {
    const ln = Math.round(globalMax*t);
    return `<text x="${x(ln).toFixed(1)}" y="16" text-anchor="middle" font-size="9.5" font-family="var(--mono)"
      fill="var(--ink3)">${ln || 'line 1'}</text>`;
  }).join('');
  const clustered = shown.filter(f => f.clustered).length;
  const multi = shown.filter(f => f.assets.length > 1);
  const insight = multi.length
    ? `<div class="insight warnish"><s>▲</s><span><b>${esc(multi[0].file)}</b> holds
        ${multi[0].assets.length} different cryptographic assets (${esc(multi[0].assets.join(', '))}) —
        they share a file, so they are one edit, not several.</span></div>`
    : clustered
      ? `<div class="insight"><s>i</s><span><b>${clustered} of ${shown.length} files</b> keep every sighting inside a 40-line window.
          Those are wrappable in place; the scattered ones have to be read end to end.</span></div>`
      : `<div class="insight"><s>i</s><span>No file bundles its cryptography into a tight window, so each one needs reading in full.</span></div>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="sitemap" role="img"
      aria-label="Where cryptographic call sites sit within each source file">
    ${scale}${rows}</svg>
    ${dropped ? `<div class="upkey" style="margin-top:8px"><span>Showing the ${cap} busiest files; ${dropped} further file(s) not drawn.</span></div>` : ''}
    ${insight}`;
}

/* --- CBOM · migration horizon (Mosca) -----------------------------
   Q: are we already too late to start?
   Mosca's inequality: if the time your data must stay secret, plus the
   time a migration takes, runs past the arrival of a cryptographically
   relevant quantum computer, then anything harvested today is exposed
   — and the deadline has already passed.
   IMPORTANT: the three inputs are planning assumptions the reader
   supplies, NOT values from the BOM. Only the algorithm counts come
   from the document. The panel says so, and the inputs are adjustable
   precisely so nobody mistakes them for measurements. */
function moscaBody(shelf, mig, q, algoRows){
  const exposed = algoRows.filter(a => a.band === 'classical' || a.band === 'retired');
  const unknown = algoRows.filter(a => a.band === 'unassessed');
  const sites = exposed.reduce((s,a) => s + a.occurrences, 0);
  const need = shelf + mig, gap = need - q, late = gap > 0, onLine = gap === 0;
  const W = 1000, H = 132, L = 8, R = 22, maxYear = Math.max(need, q) + 2;
  const x = yr => L + (W-L-R) * (yr/maxYear);
  const barY = 34, barH = 22;
  const tick = yr => `<line x1="${x(yr).toFixed(1)}" y1="22" x2="${x(yr).toFixed(1)}" y2="${H-26}"
      stroke="var(--grid)" stroke-dasharray="2 3"/>
    <text x="${x(yr).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="9.5" font-family="var(--mono)"
      fill="var(--ink3)">+${yr}y</text>`;
  const step = maxYear > 24 ? 5 : maxYear > 12 ? 2 : 1;
  const ticks = Array.from({length: Math.floor(maxYear/step)+1}, (_,i) => i*step).map(tick).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mosca migration horizon">
    ${SVG_DEFS}
    ${ticks}
    <rect x="${x(0).toFixed(1)}" y="${barY}" width="${(x(shelf)-x(0)).toFixed(1)}" height="${barH}" rx="6"
      fill="url(#gBrandH)" opacity=".85"${tip(`<b>Data shelf life: ${shelf} years</b><br>how long what you encrypt today must stay secret`)}/>
    <rect x="${x(shelf).toFixed(1)}" y="${barY}" width="${(x(need)-x(shelf)).toFixed(1)}" height="${barH}" rx="6"
      fill="var(--warn)" opacity=".85"${tip(`<b>Migration time: ${mig} years</b><br>how long moving this estate to post-quantum cryptography takes`)}/>
    <text x="${x(0)+8}" y="${barY+15}" font-size="11" font-weight="700" fill="#fff">shelf life ${shelf}y</text>
    ${(x(need)-x(shelf)) > 92 ? `<text x="${(x(shelf)+8).toFixed(1)}" y="${barY+15}" font-size="11" font-weight="700" fill="#fff">migration ${mig}y</text>` : ''}
    ${late ? `<rect x="${x(q).toFixed(1)}" y="${barY-6}" width="${(x(need)-x(q)).toFixed(1)}" height="${barH+12}" rx="6"
      fill="var(--bad)" opacity=".22" stroke="var(--bad)" stroke-dasharray="4 3"/>` : ''}
    <line x1="${x(q).toFixed(1)}" y1="20" x2="${x(q).toFixed(1)}" y2="${H-26}" stroke="var(--bad)" stroke-width="2.4"/>
    <text x="${x(q).toFixed(1)}" y="15" text-anchor="middle" font-size="10" font-weight="700"
      fill="var(--bad)">QUANTUM +${q}y</text>
    <text x="${L}" y="${H-40}" font-size="11" fill="${late?'var(--bad)':onLine?'var(--warn)':'var(--ok)'}" font-weight="700">
      ${late ? `Exposed by ${gap} year${gap===1?'':'s'} — anything harvested today outlives its protection`
             : onLine ? 'Exactly on the line — no margin for any slippage at all'
             : `${Math.abs(gap)} year${Math.abs(gap)===1?'':'s'} of headroom on these assumptions`}</text>
  </svg>
  <div class="insight ${late?'badish':onLine?'warnish':''}"><s>${late?'!':onLine?'▲':'✓'}</s><span>${late
    ? `On these assumptions the deadline has already passed. <b>${exposed.length} algorithm${exposed.length===1?'':'s'}</b>
       across <b>${sites} call site${sites===1?'':'s'}</b> would need to move, and
       ${unknown.length ? `<b>${unknown.length} more</b> cannot even be placed until ${unknown.length===1?'it carries a':'they carry'} quantum level.` : 'all others are already quantum-resistant.'}`
    : onLine
    ? `Migration would finish exactly as quantum capability arrives — no allowance for a single delay.
       ${exposed.length} algorithm${exposed.length===1?'':'s'} across ${sites} call site${sites===1?'':'s'} have to move.`
    : `On these assumptions there is room, but only if migration starts on schedule. ${exposed.length} algorithm${exposed.length===1?'':'s'}
       across ${sites} call site${sites===1?'':'s'} still have to move.`}</span></div>`;
}
function moscaHorizon(algoRows){
  if (!algoRows.length) return `<div class="none-box">No algorithms to plan a migration for.</div>`;
  const D = { shelf:10, mig:5, q:12 };
  const slider = (id,label,val,min,max,hint) => `<label class="mslide">
    <span class="ml">${label}<em>${hint}</em></span>
    <input type="range" id="mosca-${id}" data-mosca="${id}" min="${min}" max="${max}" value="${val}">
    <output id="mosca-${id}-out">${val}y</output></label>`;
  return `<div class="mgrid">
      ${slider('shelf','Data shelf life',D.shelf,1,30,'how long today’s secrets must hold')}
      ${slider('mig','Migration time',D.mig,1,20,'to move this estate to PQC')}
      ${slider('q','Quantum arrival',D.q,1,40,'your planning estimate')}
    </div>
    <div id="moscabody">${moscaBody(D.shelf, D.mig, D.q, algoRows)}</div>`;
}

/* --- CBOM · cryptographic function map ---------------------------
   Q: what cryptography does this codebase perform, and how exposed
   is each function to quantum attack? Scale: rows are primitives,
   a closed vocabulary, so the chart never grows past ~12 rows. */
function functionMap(fnMap, bands){
  const head = `<div class="ch"></div>` + bands.map(b =>
    `<div class="ch"><s style="background:${BAND_COLOR[b]}"></s>${BAND_LABEL[b]}</div>`).join('') + `<div class="ch tot">total</div>`;
  const rows = fnMap.map(p => `<div class="rh"${tip(`<b>${esc(PRIMITIVE_LABEL[p.primitive] || p.primitive)}</b><br>${p.total} algorithm(s)`)}>
      ${esc(PRIMITIVE_LABEL[p.primitive] || p.primitive)}</div>` +
    p.cells.map(c => c.items.length
      ? `<div class="cc on" style="background:${BAND_COLOR[c.band]}"
          ${pickAttr({ key:'algo:'+p.primitive+':'+c.band, label:BAND_LABEL[c.band]+' · '+(PRIMITIVE_LABEL[p.primitive]||p.primitive), refs:c.items })}
          ${tip(`<b>${esc(BAND_LABEL[c.band])}</b> · ${esc(PRIMITIVE_LABEL[p.primitive]||p.primitive)}<br>${esc(c.items.join(', '))}`)}>${c.items.length}</div>`
      : `<div class="cc none"></div>`).join('') +
    `<div class="bt">${p.total}</div>`).join('');
  return `<div class="grid-mat" style="grid-template-columns:150px repeat(${bands.length},minmax(0,1fr)) 50px">${head}${rows}</div>`;
}

/* --- CBOM · algorithm inventory strip -----------------------------
   Q: for each primitive found, what is its strength evidence?
   Scale: one row per algorithm, capped, with the rest summarised. */
/* Colour here is evidence completeness, deliberately not the risk band — the function map
   already carries the band, and two figures should not encode the same variable. */
function algoStrip(rows, cap = 12){
  const FIELDS = ['family','strength','function','quantum'];
  const evidenceOf = a => {
    const have = [!!a.family, !!(a.params || a.curve || a.bits), !!(a.functions && a.functions.length), a.lvl !== null];
    return { have, n:have.filter(Boolean).length };
  };
  const col = n => n === 4 ? 'var(--ok)' : n >= 2 ? 'var(--warn)' : 'var(--bad)';
  const shown = rows.map(a => ({ ...a, ev:evidenceOf(a) }))
    .sort((a,b) => a.ev.n - b.ev.n || a.name.localeCompare(b.name)).slice(0,cap);
  const body = shown.map(a => {
    const missing = FIELDS.filter((_,i) => !a.ev.have[i]);
    const detail = [a.family && 'family ' + a.family, a.params && 'params ' + a.params, a.curve && 'curve ' + a.curve,
      a.bits && a.bits + '-bit classical', a.lvl !== null ? 'NIST L' + a.lvl : null].filter(Boolean);
    return `<div class="prow"${pickAttr({ key:'ref:'+a.name, label:a.name, refs:[a.name] })}
      ${tip(`<b>${esc(a.name)}</b> · ${esc(PRIMITIVE_LABEL[a.primitive]||a.primitive)}<br>${detail.length ? esc(detail.join(' · ')) : '<i>nothing recorded beyond the primitive</i>'}<br>${missing.length ? 'missing: ' + esc(missing.join(', ')) : 'fully documented'}<br>${a.occurrences} call site${a.occurrences===1?'':'s'}`)}>
      <span class="plab"><s style="background:${col(a.ev.n)}"></s>${esc(clipTxt(a.name,24))}</span>
      <span class="ptrk"><i style="width:${a.ev.n/4*100}%;background:${col(a.ev.n)}"></i></span>
      <span class="pn">${a.ev.n}/4</span>
      <span class="pc">${a.occurrences || 0}×</span></div>`;
  }).join('');
  const more = rows.length > cap ? `<div class="upkey"><span>${rows.length-cap} further algorithm(s) — see the register below</span></div>` : '';
  return `<div class="pareto">${body}</div>${more}<div class="upkey">
    <span>bar counts recorded evidence: family · strength · function · quantum level</span>
    <span style="margin-left:auto">right column is call sites in source</span></div>`;
}

/* --- CBOM · code hotspots (icicle by directory) -------------------
   Q: where in the codebase is cryptography concentrated?
   Scale: rolls up to directories first, files second, tail collapsed. */
const shortPath = d => { const seg = String(d).split('/').filter(Boolean);
  return seg.length > 2 ? '…/' + seg.slice(-2).join('/') : d; };
function hotspots(dirs, files, cap = 10){
  if (!files.length) return '<div class="none-box">This CBOM records no source evidence, so usage cannot be located. Generators that emit <code>evidence.occurrences</code> populate this view.</div>';
  const total = files.reduce((a,f) => a+f.n, 0);
  const shownDirs = dirs.slice(0, 6);
  const dirRows = shownDirs.map(d => {
