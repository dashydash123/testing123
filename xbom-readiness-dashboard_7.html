    const fs = files.filter(f => f.dir === d.dir).sort((a,b) => b.n-a.n).slice(0, cap);
    return `<div class="prow"${pickAttr({ key:'dir:'+d.dir, label:d.dir, refs:[...new Set(files.filter(f=>f.dir===d.dir).flatMap(f=>f.assets))] })}
        ${tip(`<b>${esc(d.dir)}</b><br>${d.n} call site${d.n>1?'s':''} across ${d.files} file${d.files>1?'s':''}`)}>
        <span class="plab"><s style="background:var(--teal)"></s>${esc(clipTxt(shortPath(d.dir),30))}</span>
        <span class="ptrk"><i style="width:${100*d.n/dirs[0].n}%;background:var(--teal)"></i></span>
        <span class="pn">${d.n}</span><span class="pc">${pct(d.n,total)}%</span></div>` +
      fs.map(f => `<div class="prow" style="padding-left:18px"
        ${pickAttr({ key:'file:'+f.dir+'/'+f.file, label:f.file, refs:f.assets })}
        ${tip(`<b>${esc(f.file)}</b><br>${f.n} call site${f.n>1?'s':''}<br><i>${esc(f.assets.join(', '))}</i>`)}>
        <span class="plab" style="color:var(--ink2)">${esc(clipTxt(f.file,28))}</span>
        <span class="ptrk"><i style="width:${100*f.n/dirs[0].n}%;background:var(--teal);opacity:.45"></i></span>
        <span class="pn" style="font-weight:500">${f.n}</span><span class="pc">${esc(clipTxt(f.assets.join(','),10))}</span></div>`).join('');
  }).join('');
  const more = dirs.length > 6 ? `<div class="upkey"><span>${dirs.length-6} further director(ies) with ${dirs.slice(6).reduce((a,d)=>a+d.n,0)} call sites</span></div>` : '';
  return `<div class="pareto">${dirRows}</div>${more}`;
}

/* --- CBOM · migration blast radius -------------------------------- */
function blastMatrix(blast){
  const { algos, consumers } = blast;
  if (!consumers.length) return '<div class="none-box">No key, certificate or protocol in this CBOM references an algorithm, so a migration blast radius cannot be computed. Generators that emit <code>algorithmRef</code>, <code>signatureAlgorithmRef</code> or cipher-suite references populate this view.</div>';
  const BAND = { retired:'var(--bad)', classical:'var(--warn)', pqc:'var(--ok)', unassessed:'var(--na)' };
  const KIND = { key:'K', certificate:'C', protocol:'P' };
  const head = `<div class="ch"></div>` + consumers.map(c =>
    `<div class="ch"${tip(`<b>${esc(c.name)}</b><br>${c.kind}`)}>${esc(clipTxt(c.name,16))}</div>`).join('') + `<div class="ch tot">radius</div>`;
  const rows = algos.slice().sort((a,b) => b.deps.length-a.deps.length).map(a =>
    `<div class="rh"${tip(`<b>${esc(a.name)}</b><br>${a.band}<br>${a.deps.length} dependent asset(s)`)}
      ${pickAttr({ key:'ref:'+a.name, label:a.name, refs:[a.name, ...a.deps] })}>
      <s style="background:${BAND[a.band]}"></s>${esc(clipTxt(a.name,18))}</div>` +
    consumers.map(c => { const on = a.deps.includes(c.name);
      return `<div class="cc${on?' on':''}" style="${on?`background:${BAND[a.band]}`:''}"
        ${tip(on ? `<b>${esc(c.name)}</b> depends on <b>${esc(a.name)}</b> — retiring it breaks this ${c.kind}`
          : `${esc(c.name)} does not use ${esc(a.name)}`)}>${on ? KIND[c.kind]||'•' : ''}</div>`; }).join('') +
    `<div class="bt" style="color:${a.deps.length?BAND[a.band]:'var(--ink3)'}">${a.deps.length}</div>`).join('');
  return `<div class="grid-mat" style="grid-template-columns:170px repeat(${consumers.length},minmax(0,1fr)) 54px">${head}${rows}</div>`;
}

/* --- SBOM · mandated field conformance ---------------------------
   Q: would this document survive a regulator's field checklist?
   Distinct from the scorecard: that is our judgement of readiness,
   this is somebody else's list of required fields, including several
   the scorecard does not look at. */
function mandatedStrip(fields){
  const rows = fields.map(f => {
    if (f.na) return `<div class="mrow2"${tip(esc(f.note||'not applicable'))}>
      <span class="mk">${esc(f.k)}</span>
      <span class="mtrk na"></span><span class="mv" style="color:var(--na)">n/a</span></div>`;
    const have = pct(f.have, f.total), miss = 100 - have;
    const col = miss === 0 ? 'var(--ok)' : miss <= 20 ? 'var(--warn)' : 'var(--bad)';
    return `<div class="mrow2"${pickAttr({ key:'field:'+f.k, label:f.k + ' missing', refs:[] })}
      ${tip(`<b>${esc(f.k)}</b><br>present on ${f.have} of ${f.total} · <b>${miss}% missing</b>`)}>
      <span class="mk">${esc(f.k)}</span>
      <span class="mtrk"><i style="width:${have}%"></i>${miss ? `<u style="width:${miss}%;background:${col}"></u>` : ''}</span>
      <span class="mv" style="color:${col}">${miss}%</span></div>`;
  }).join('');
  const live = fields.filter(f => !f.na);
  const overall = live.length ? Math.round(live.reduce((a,f) => a + pct(f.have,f.total), 0) / live.length) : 0;
  return `<div class="mconf"><b style="color:${overall>=90?'var(--ok)':overall>=60?'var(--warn)':'var(--bad)'}">${overall}%</b>
    <span>field conformance</span><em>${live.filter(f => f.have < f.total).length} of ${live.length} mandated fields are incomplete</em></div>
    <div class="mstrip">${rows}</div>
    <div class="upkey"><span>green is present · the coloured remainder is what an assessor would mark missing</span></div>`;
}

/* --- projection slope chart --------------------------------------
   Q: if we do the top actions, what does the scorecard read?
   Two columns, one line per dimension that moves. */
function slopeChart(proj){
  if (!proj.moved.length) return `<div class="none-box">The top actions clear findings but do not move any dimension — the remaining gaps sit elsewhere.</div>`;
  const W=760, H=Math.max(230, 74 + proj.moved.length*30), L=210, R=180, T=40, B=30;
  const y = v => T + (H-T-B) * (1 - v/100);
  /* dimensions that land on the same value share a y position, so labels are pushed
     apart and joined back to their dot with a leader line */
  const MIN = 17;
  const place = side => {
    const rows = proj.moved.map((m,i) => ({ i, y:y(side === 'from' ? m.from : m.to) }))
      .sort((a,b) => a.y - b.y);
    rows.forEach((r,k) => { if (k && r.y - rows[k-1].y < MIN) r.y = rows[k-1].y + MIN; });
    const over = rows.length ? rows[rows.length-1].y - (H-B) : 0;
    if (over > 0) rows.forEach(r => r.y -= over);
    const out = []; rows.forEach(r => out[r.i] = r.y);
    return out;
  };
  const yL = place('from'), yR = place('to');
  const lines = proj.moved.map((m,i) => {
    const c = m.to >= 90 ? 'var(--ok)' : m.to >= 50 ? 'var(--warn)' : 'var(--bad)';
    const dy0 = y(m.from), dy1 = y(m.to);
    const lead = (x, dy, ly, dir) => Math.abs(dy - ly) < 1.5 ? '' :
      `<polyline points="${x} ${dy.toFixed(1)} ${(x + dir*7)} ${dy.toFixed(1)} ${(x + dir*7)} ${ly.toFixed(1)}"
        fill="none" stroke="#CBD5E1" stroke-width="1"/>`;
    return `<g${tip(`<b>${esc(m.label)}</b> · ${m.bom}<br>${m.from}% → ${m.to}% (+${m.to-m.from} points)`)}>
      <line x1="${L}" y1="${dy0.toFixed(1)}" x2="${W-R}" y2="${dy1.toFixed(1)}" stroke="${c}" stroke-width="2" opacity=".6"/>
      <circle cx="${L}" cy="${dy0.toFixed(1)}" r="4.5" fill="#fff" stroke="var(--ink3)" stroke-width="2"/>
      <circle cx="${W-R}" cy="${dy1.toFixed(1)}" r="5" fill="${c}"/>
      ${lead(L, dy0, yL[i], -1)}${lead(W-R, dy1, yR[i], 1)}
      <text x="${L-14}" y="${(yL[i]+4).toFixed(1)}" text-anchor="end" font-size="11.5" fill="var(--ink2)">${esc(clipTxt(m.label,26))}</text>
      <text x="${W-R+14}" y="${(yR[i]+4).toFixed(1)}" font-size="11.5" fill="${c}" font-weight="600">${m.to}%
        <tspan fill="var(--ink3)" font-weight="400">was ${m.from}%</tspan></text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dimension readiness before and after the top actions">
    <text x="${L}" y="18" text-anchor="end" font-size="9.5" font-family="var(--mono)" letter-spacing="1.2" fill="var(--ink3)">TODAY</text>
    <text x="${W-R}" y="18" font-size="9.5" font-family="var(--mono)" letter-spacing="1.2" fill="var(--ink3)">AFTER THE TOP 3</text>
    <line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#E4EAF3"/>
    <line x1="${W-R}" y1="${T}" x2="${W-R}" y2="${H-B}" stroke="#E4EAF3"/>${lines}</svg>`;
}

/* --- projection, per BOM ------------------------------------------
   One bar per dimension: solid is where it stands, the hatched
   extension is what the top actions add. No overlapping labels
   possible, and it stays compact however many dimensions there are. */
function projectionBars(pb){
  if (!pb || !pb.dims.length) return '';
  const rows = pb.dims.map(d => {
    const gain = d.to - d.from, moves = gain > 0;
    const cNow = d.from >= 90 ? 'var(--ok)' : d.from >= 50 ? 'var(--warn)' : 'var(--bad)';
    const cTo  = d.to  >= 90 ? 'var(--ok)' : d.to  >= 50 ? 'var(--warn)' : 'var(--bad)';
    return `<div class="pjrow${moves ? '' : ' flat'}"
      ${tip(`<b>${esc(d.label)}</b><br>${moves ? d.from + '% → ' + d.to + '% (+' + gain + ' points)' : 'unchanged at ' + d.from + '%'}`)}>
      <span class="pjl">${esc(d.label)}</span>
      <span class="pjt"><i style="width:${d.from}%;background:${cNow}"></i>
        ${moves ? `<u style="width:${gain}%;background:${cTo}"></u>` : ''}
        <s style="left:90%"></s></span>
      <span class="pjv">${moves ? `${d.from} <b style="color:${cTo}">→ ${d.to}</b>` : `<em>${d.from}</em>`}</span></div>`;
  }).join('');
  const cTo = pb.after >= 90 ? 'var(--ok)' : pb.after >= 50 ? 'var(--warn)' : 'var(--bad)';
  return `<div class="pjhead"><b>${pb.before}%</b><span>→</span><b style="color:${cTo}">${pb.after}%</b>
      <em>${pb.moved.length ? pb.moved.length + ' dimension' + (pb.moved.length>1?'s':'') + ' move' : 'no dimension moves'}</em></div>
    <div class="pj">${rows}</div>
    <div class="upkey"><span>solid is today · the lighter extension is what the top actions add · the tick is the 90% pass mark</span></div>`;
}

/* --- SBOM · risk concentration by component -----------------------
   Q: which components are actually the problem? The register groups
   by rule and the plan by action; neither says which packages to
   pick up first, which is how remediation is really assigned. */
function offenderList(offenders, attributed, cap = 8){
  if (!offenders.length) return '<div class="none-box">No finding is attributable to a named component.</div>';
  const shown = offenders.slice(0, cap);
  const max = offenders[0].n || 1;
  const rows = shown.map((o,i) => `
    <div class="ofr"${pickAttr({ key:'ref:'+o.name, label:o.name, refs:[o.name] })}
      ${tip(`<b>${esc(o.name)}</b><br>${o.n} finding${o.n>1?'s':''}${o.blockers ? ', ' + o.blockers + ' blocking' : ''}<br>${esc(o.rules.join(' · '))}<br>${LIC_LABEL[o.lic]}`)}>
      <span class="ofrank">${i+1}</span>
      <span class="ofn"><b>${esc(clipTxt(o.name,30))}</b><em>${esc(clipTxt(o.rules.join(' · '),52))}</em></span>
      <span class="oflic"><s style="background:${LIC_COLOR(o.lic)}"></s>${LIC_LABEL[o.lic]}</span>
      <span class="oftrk"><i style="width:${100*o.n/max}%;background:${o.blockers?'var(--bad)':'var(--brand)'};opacity:.28"></i>
        ${o.blockers ? `<u style="width:${100*o.blockers/max}%"></u>` : ''}</span>
      <span class="ofn2">${o.n}<em>${o.blockers} blocking</em></span></div>`).join('');
  const head = `<div class="ofhead"><span></span><span>Component</span><span>Terms</span><span>Findings</span><span></span></div>`;
  const tail = offenders.length > cap
    ? `<div class="upkey"><span>${offenders.length - cap} further component(s) carry the remaining ${attributed - shown.reduce((a,o)=>a+o.n,0)} findings</span>
       <span style="margin-left:auto">top ${cap} carry ${shown[shown.length-1].cum}% of all attributable findings</span></div>` : '';
  return head + rows + tail;
}

/* --- AIBOM · supply-chain posture --------------------------------
   Q: where did the weights come from, and is the data behind them
   safe to have trained on? Two questions no other AI figure asks. */
function posture(origin, sens){
  const bar = (title, groups, total) => {
    const seg = groups.filter(g => g.items.length).map(g =>
      `<i style="width:${100*g.items.length/total}%;background:${g.color}"
        ${tip(`<b>${g.label}</b> · ${g.items.length} of ${total}<br>${esc(list(g.items))}`)}></i>`).join('');
    return `<div class="pst"><div class="psth">${title}<em>${total}</em></div>
      <div class="pstb">${seg}</div>
      <div class="pstk">${groups.filter(g => g.items.length).map(g =>
        `<span><s style="background:${g.color}"></s>${g.label} <b>${g.items.length}</b></span>`).join('')}</div></div>`;
  };
  const models = origin.attested.length + origin.sourced.length + origin.opaque.length;
  const datasets = sens.personal.length + sens.governed.length + sens.unknown.length;
  return (models ? bar('Model provenance', [
      { label:'Attested', items:origin.attested, color:'var(--ok)' },
      { label:'Source known', items:origin.sourced, color:'var(--warn)' },
      { label:'Opaque', items:origin.opaque, color:'var(--bad)' }], models) : '')
    + (datasets ? bar('Training data', [
      { label:'Governed', items:sens.governed, color:'var(--ok)' },
      { label:'Personal or confidential', items:sens.personal, color:'var(--violet)' },
      { label:'Unknown', items:sens.unknown, color:'var(--bad)' }], datasets) : '');
}

/* --- CBOM · migration effort --------------------------------------
   Q: how big is the job? Three retired algorithms touched in one file
   is an afternoon; three touched in ninety files is a programme. */
function migrationEffort(effort, dirs, totalSites){
  const C = { retired:'var(--bad)', unassessed:'var(--na)', classical:'var(--warn)', pqc:'var(--ok)' };
  const L = { retired:'Retired — replace now', unassessed:'Not assessed — measure first',
    classical:'Classical — migration backlog', pqc:'Quantum-safe — no action' };
  const maxS = Math.max(1, ...effort.map(e => e.sites));
  const rows = effort.filter(e => e.algos).map(e => `
    <div class="efr"${pickAttr({ key:'band:'+e.band, label:L[e.band], refs:e.names })}
      ${tip(`<b>${L[e.band]}</b><br>${e.algos} algorithm(s)${e.sites ? ' · ' + e.sites + ' call site(s) in ' + e.files + ' file(s)' : ' · no source evidence recorded'}<br>${esc(list(e.names,8))}`)}>
      <span class="efl"><s style="background:${C[e.band]}"></s>${L[e.band]}</span>
      <span class="efa">${e.algos}</span>
      <span class="eft">${e.sites ? `<i style="width:${100*e.sites/maxS}%;background:${C[e.band]}"></i>` : ''}</span>
      <span class="efs">${e.sites || '—'}<em>${e.files || 0} file${e.files===1?'':'s'}</em></span></div>`).join('');
  const top = dirs.slice(0,3).map(d => `${esc(shortPath(d.dir))} (${d.n})`).join(' · ');
  return `<div class="efhead"><span>Risk band</span><span>Algos</span><span>Reach in source</span><span></span></div>${rows}
    ${totalSites ? `<div class="upkey"><span>${totalSites} call site(s) across ${dirs.length} director(ies) · heaviest: ${top}</span></div>`
      : `<div class="upkey"><span>no source evidence recorded, so reach cannot be measured</span></div>`}`;
}

/* --- CBOM · renewal runway ---------------------------------------- */
function expiryHorizon(certs){
  if (!certs.length) return '<div class="none-box">No certificates declared in this CBOM.</div>';
  const W=1000, rowH=38, H=70+certs.length*rowH, L=230, R=80, SPAN=540;
  const x = d => L + (W-L-R)*Math.min(1,Math.max(0,d/SPAN));
  const bands = `<rect x="${L}" y="26" width="${x(45)-L}" height="${H-58}" fill="var(--bad)" opacity=".07"/>
    <rect x="${x(45)}" y="26" width="${x(120)-x(45)}" height="${H-58}" fill="var(--warn)" opacity=".07"/>
    <rect x="${x(120)}" y="26" width="${W-R-x(120)}" height="${H-58}" fill="var(--ok)" opacity=".07"/>`;
  const ticks = [0,90,180,270,360,450,540].map(d =>
    `<line x1="${x(d)}" y1="26" x2="${x(d)}" y2="${H-32}" stroke="#E4EAF3" stroke-dasharray="2 3"/>
     <text x="${x(d)}" y="${H-16}" text-anchor="middle" font-size="10.5" font-family="var(--mono)"
       fill="var(--ink3)">${d===0?'TODAY':'+'+Math.round(d/30)+'M'}</text>`).join('');
  const rows = certs.map((c,i) => {
    const y = 40+i*rowH;
    const g = inner => `<g${pickAttr({ key:'ref:'+c.name, label:c.name, refs:[c.name] })}
      ${tip(`<b>${esc(c.name)}</b><br>${c.expiry ? 'expires ' + c.expiry.slice(0,10) + ' · ' + c.days + ' days' : 'no validity window recorded'}${c.issuer ? '<br>' + esc(c.issuer) : ''}`)}>${inner}</g>`;
    if (c.days === null) return g(`<text x="${L-10}" y="${y+4}" text-anchor="end" font-size="12.5" fill="var(--ink2)">${esc(clipTxt(c.name,26))}</text>
      <line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--ink3)" stroke-dasharray="3 4" opacity=".45"/>
      <text x="${W-R+6}" y="${y+4}" font-size="11" font-family="var(--mono)" fill="var(--ink3)">n/a</text>`);
    const col = c.days<=45?'var(--bad)':c.days<=120?'var(--warn)':'var(--ok)';
    return g(`<text x="${L-10}" y="${y+4}" text-anchor="end" font-size="12.5" fill="var(--ink2)">${esc(clipTxt(c.name,26))}</text>
      <line x1="${L}" y1="${y}" x2="${x(Math.max(0,c.days))}" y2="${y}" stroke="${col}" stroke-width="2" opacity=".45"/>
      <circle cx="${x(Math.max(0,c.days))}" cy="${y}" r="7" fill="${col}" stroke="#fff" stroke-width="1.5"/>
      <text x="${W-R+6}" y="${y+4}" font-size="11" font-family="var(--mono)" fill="${col}">${c.days<0?'EXPIRED':c.days+'d'}</text>`);
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Certificate expiry horizon">
    ${bands}${ticks}<line x1="${L}" y1="26" x2="${L}" y2="${H-32}" stroke="var(--ink)" stroke-width="1.5"/>${rows}</svg>`;
}

/* ============================================================
   6 · RENDER
   ============================================================ */
const $ = s => document.querySelector(s);
const TAG = { SBOM:'tag-sbom', AIBOM:'tag-aibom', CBOM:'tag-cbom' };
const CELL = { pass:['var(--ok-soft)','var(--ok-line)','var(--ok)'],
  warn:['var(--warn-soft)','var(--warn-line)','var(--warn)'],
  fail:['var(--bad-soft)','var(--bad-line)','var(--bad)'] };
const PAGE = 8;   /* rule groups rendered before "show more" */

function box(title, sub, body, foot, accent){
  return `<div class="box${accent ? ' ' + accent : ''}"><h4>${title}</h4><div class="sub">${sub}</div>${body}
    ${foot ? `<div class="foot">${foot}</div>` : ''}</div>`;
}
function sectionHead(title, tag, hint){
  return `<div class="sect"><h3>${title}</h3><span class="tag ${TAG[tag]||'tag-all'}">${tag}</span>
    <span class="rule"></span><span class="hint">${hint||''}</span></div>`;
}
function scoreStrip(s, findings){
  const n = findings.filter(f => f.src === s.title).length;
  const live = s.dims.filter(d => !d.na);
  const worst = live.slice().sort((a,b) => a.coverage - b.coverage)[0];
  const cls = s.coverage === null ? 'na' : rate(s.coverage);
  return `<div class="score s-${cls}">
    <b>${s.coverage === null ? 'n/a' : s.coverage + '%'}</b><span>readiness</span>
    <em>${s.count} · ${n} finding${n===1?'':'s'}${worst ? ` · weakest is <u>${esc(worst.label)}</u> at ${worst.coverage}%` : ''}${s.naCount ? ` · ${s.naCount} dimension(s) not applicable` : ''}</em></div>`;
}
function matchFinding(f, flt){
  if (!flt) return true;
  if (flt.sev) return f.sev === flt.sev;
  if (flt.dim) return f.src === flt.src && f.dim === flt.dim;
  if (flt.refs) return f.ref && flt.refs.includes(f.ref);
  return true;
}

function render(r){
  if (!r){ $('#out').innerHTML = `<div class="empty-state"><b>No documents loaded</b>
    Upload an SBOM, AIBOM or CBOM above. Panels appear only for the BOM types you provide.</div>`;
    $('#export').disabled = true; $('#board').disabled = true; return; }
  $('#export').disabled = false; $('#board').disabled = false;
  const flt = state.filter, q = state.query.trim().toLowerCase();
  const sel = key => flt && flt.key === key ? ' sel' : '';
  const g = r.gate === 'blocked' ? 'g-bad' : r.gate === 'conditional' ? 'g-warn' : 'g-ok';

  /* ---------- overview ---------- */
  const kpis = r.kpis.map((k,i) => `<div class="kpi ${k.tone?'tone-'+k.tone:''}" style="animation-delay:${i*40}ms"${tip(k.tip)}>
    <span class="k">${k.k}</span><span class="v ${k.tone?'t-'+k.tone:''}">${k.v}</span><span class="d">${k.d}</span>
    ${k.bar !== undefined ? `<span class="bullet"><i style="width:${k.bar}%;background:var(--${k.tone==='ok'?'ok':k.tone==='warn'?'warn':'bad'})"></i><u style="left:${k.target}%"></u></span>` : ''}
  </div>`).join('');

  const matrix = r.sections.map(s => `<div class="mrow"><div class="rl">${s.title}</div>
    ${s.dims.map(d => {
      if (d.na) return `<div class="cell na"${tip(`<b>${esc(d.label)}</b><br>not applicable — ${esc(d.sub)}<br><i>left out of the readiness average</i>`)}>
        <span class="cn">${esc(d.label)}</span><span class="cv">N/A</span></div>`;
      const [bg,ln,fg] = CELL[d.status], key = 'dim:'+s.title+':'+d.label;
      return `<div class="cell${sel(key)}" style="background:${bg};border-color:${ln}"
        ${tip(`<b>${esc(d.label)}</b> · ${d.coverage}%<br>${esc(d.state)}<br>${esc(d.sub)}<br><i>click to filter the register</i>`)}
        ${pickAttr({ key, label:s.title+' · '+d.label, src:s.title, dim:d.label })}>
        <span class="cn">${esc(d.label)}</span><span class="cv" style="color:${fg}">${d.coverage}%</span></div>`;
    }).join('')}
    ${Array.from({length:Math.max(0,5-s.dims.length)},()=>'<div class="cell void"><span>n/a</span></div>').join('')}</div>`).join('');

  /* ---------- SBOM ---------- */
  let sbomSec = '';
  const sb = r.sections.find(s => s.key === 'sbom');
  if (sb){
    const d = r.sbom;
    const flowBox = box('What this build obliges us to do',
      'Every component traced outward from where it came from, through its declared terms, to what those terms oblige on release.',
      obligationSunburst(d.flow),
      d.aggregated
        ? `Origins beyond the top ${d.topEco.length} and licences beyond the top ${d.topLicCount} are pooled into an <b>other</b> slice, so the rings stay legible as the BOM grows. Click any ring to pull those components into the register.`
        : 'The outer ring is the release checklist. <b>Cannot clear</b> has no lawful path to shipping. Click any ring to pull those components into the register.');
    const paretoBox = d.ranked.length <= 10 ? '' : box('Licence concentration',
      'The full licence distribution, ranked, with the cumulative share of the build marked on each bar.',
      pareto(d.ranked, d.total),
      `${d.ranked.length} distinct licence expression${d.ranked.length===1?'':'s'} across ${d.total} components. The blue marker is cumulative coverage — where it reaches the right-hand end, the remaining tail is negligible.`);
    const cov = d.scan;
    const covBanner = cov.unmatchable
      ? `<div class="note"><b>Scan coverage: ${cov.matchable} of ${cov.total} components (${pct(cov.matchable,cov.total)}%).</b>
          ${cov.unmatchable} carry no package URL or no real version, so no advisory feed can match them. Any vulnerability
          count below describes ${pct(cov.matchable,cov.total)}% of the estate, not all of it.</div>`
      : `<div class="note"><b>Scan coverage: all ${cov.total} components are matchable to an advisory feed.</b></div>`;
    const cveBox = d.cve
      ? box('Vulnerability ageing',
          'Every record by how long it has been public, split by severity. Filled dots are still open. Triage state is read from <code>analysis.state</code> inside this document — no external VEX feed is consulted.',
          covBanner + vulnAgeing(d.cve),
          `${d.cve.open} of ${d.cve.total} still open` +
          (d.cve.oldestOpen ? ` · oldest has been public for ${d.cve.oldestOpen.age} days` : '') +
          (d.cve.breaching ? ` · <b>${d.cve.breaching} past the 90-day line</b>` : '') +
          '. Ages run from public disclosure, not from when the component entered your build, so they are an upper bound on exposure. Severity says how bad and triage says whether anyone looked; only this says how long the world has known.')
      : box('Vulnerability ageing','Every record placed by how long it has been public, split by severity.',
          covBanner + `<div class="none-box">${cov.scanned ? 'The document records a completed scan that returned no findings.' : 'No vulnerability block at all — this document carries no scan evidence. SPDX cannot carry one; a CycloneDX BOM with a <code>vulnerabilities</code> block can.'}</div>`);
    /* only worth a panel when several real upstreams exist and a few of them dominate */
    const concentrated = r.suppliers && r.suppliers.distinct >= 3 && r.suppliers.largest &&
      (r.suppliers.top3 >= 35 || pct(r.suppliers.largest.n, r.suppliers.total) >= 20);
    const supBox = concentrated
      ? box('Upstream concentration',
          'How much of the estate rides on how few upstreams, and whether those upstreams are the ones with unresolved terms.',
          supplierBubbles(r.suppliers) + supplierConcentration(r.suppliers),
          `${r.suppliers.distinct} named upstreams · the top three account for <b>${r.suppliers.top3}%</b> of the build.
           Concentration is leverage when terms are clean and single-point-of-failure risk when they are not.`)
      : '';
    const conflictNote = d.conflicts.length
      ? `<div class="note"><b>${d.conflicts.length} licence combination${d.conflicts.length>1?'s':''} cannot lawfully coexist in one distributed work.</b>
          ${d.conflicts.map(c => esc(c.why)).join(' ')}</div>`
      : (d.agpl.length ? `<div class="note"><b>${d.agpl.length} component(s) under AGPL or SSPL.</b>
          If any of this is offered as a network service, the source-availability obligation reaches your own code.</div>` : '');
    const mandateBox = box('Mandated field conformance',
      'Whether this document carries the fields an assessor asks for, including several the readiness scorecard does not look at.',
      mandatedStrip(d.mandated),
      'Checked against the fields common to CERT-In SBOM guidance and the NTIA minimum elements. This is field presence, not certification — it says whether the document survives the checklist, not whether the software is compliant.');
    const offBox = box('Where the findings concentrate',
      'Components ranked by how many findings they carry. The register groups by rule and the plan by fix; this is the pick-up list.',
      offenderList(d.offenders, d.attributed),
      'Remediation is assigned per component — one upgrade can close several rules at once. The dark inset is the blocking share.');
    const projS = projectionBars(r.projection.byBom['SBOM']);

    /* ---- new panels ---- */
    const radarBox = box('Readiness shape',
      'The five SBOM dimensions on one axis system. The scorecard carries the numbers; this carries the shape.',
      dimRadar(sb.dims),
      'A spike into one axis and a thin body is a very different remediation job from an evenly weak pentagon, and a table of five percentages hides that difference. Click any point to filter the register to that dimension.',
      'acc-ok');

    /* only worth calling out when the share is material and the origin is not a
       single component — one bad package in a tile of one is not a concentration */
    const riskyN = g => g.mix.undeclared + g.mix.restricted + g.mix.strong;
    /* a lone risky component only reads as "noise" when it's one of many origins;
       with few origins in play it IS the origin, not a statistical blip */
    const bigEnough = g => g.n >= 2 || d.originGroups.length <= 6;
    const worstEco = d.originGroups.filter(g => bigEnough(g) && riskyN(g)/g.n >= 0.15)
      .sort((a,b) => (riskyN(b)/b.n) - (riskyN(a)/a.n))[0];
    const totalRisky = d.originGroups.reduce((a,g) => a + riskyN(g), 0);
    const treeInsight = worstEco
      ? `<div class="insight warnish"><s>▲</s><span><b>${esc(worstEco.name)}</b> carries the highest share of
          unclearable or heavily obligated components — ${riskyN(worstEco)} of its ${worstEco.n}
          (${pct(riskyN(worstEco), worstEco.n)}%). Concentration is only leverage when the terms behind it are clean.</span></div>`
      : totalRisky
        ? `<div class="insight"><s>i</s><span><b>${totalRisky} component${totalRisky>1?'s':''} ${totalRisky>1?'carry':'carries'} unresolved or heavy terms</b>,
            but they are spread thinly rather than pooled in one origin — so there is no single upstream to go back to.</span></div>`
        : `<div class="insight"><s>✓</s><span>Every origin in this build resolves to terms that can be cleared.</span></div>`;
    const treeBox = box('Where the estate sits',
      'Every component grouped by the registry it came from. Area is volume, fill is the share of that origin that cannot be cleared.',
      originTreemap(d.originGroups, d.total) + treeInsight,
      `${d.originGroups.length} distinct origin${d.originGroups.length===1?'':'s'}. Origin is read from the package URL type, with registry hostnames normalised — <b>www.npmjs.com</b> and <b>npm</b> are one tile, not two. Click a tile to pull that origin into the register.`,
      'acc-teal');

    const ackBox = box('Declared versus concluded licence',
      'Whether the scanner confirmed what upstream says about itself, component by component.',
      ackSplit(d.ackMix, d.total, d.divergent),
      'CycloneDX records an <code>acknowledgement</code> of <b>declared</b> or <b>concluded</b> against each licence, and SCANOSS emits both. Most tooling collapses them, which discards the only field in the document that says whether the scan independently confirmed anything. A declared-only licence is upstream’s claim, not a finding.',
      'acc-lic');

    const mosaicBox = box('Evidence completeness',
      'One tile per component, shaded by how many of the five evidence fields it carries.',
      evidenceMosaic(d.tiles, d.evFields),
      'Fields checked: package URL, resolved version, usable licence, supplier, hash. A coverage percentage tells you 68%; this tells you <b>which</b> 68%, and lets you hover the single bare record that is holding up an assessment.',
      'acc-warn');

    const donutBox = d.cve ? box('Exposure and triage',
      'Severity mix, how much of each severity has actually been triaged, and how long the open records have been public.',
      severityDonut(d.cve) + exposureStats(d.cve),
      'Severity mix on its own flatters a BOM where nobody has looked yet, so the completion bars sit beside it rather than on another panel. Triage state is read from <code>analysis.state</code> in this document — no external VEX feed is consulted. Ages run from public disclosure, so they are an upper bound on how long you have actually carried the exposure.',
      'acc-sev') : '';

    const curveBox = d.cve ? box('How the exposure accumulated',
      'Cumulative count of known vulnerabilities in this build, plotted against the date each was publicly disclosed.',
      disclosureCurve(d.cve.rows, d.bomTs),
      'Every point is a real <code>published</code> timestamp from the vulnerability block — nothing here is interpolated. A steep recent rise is a fresh problem; a long flat shelf is inherited debt nobody has cleared. <b>A single BOM cannot show a remediation trend</b>: that needs two documents from different dates, and this deliberately does not fake one.',
      'acc-sev') : '';

    const invBox = box('Component inventory',
      'Every software component in the document, ordered by what needs attention first rather than alphabetically.',
      inventoryTable(d.invRows),
      'Sorted by advisory count, then unclearable licences, then obligations, then evidence gaps. The evidence column is the same five-field score as the mosaic above. Filtering here is local to the table and does not touch the register below.');

    sbomSec = sectionHead('Software composition','SBOM','what we owe, who carries it, what is exposed')
      + scoreStrip(sb, r.findings)
      + conflictNote
      + (donutBox ? `<div class="row wide">${radarBox}${donutBox}</div>` : `<div class="row">${radarBox}</div>`)
      + `<div class="row">${mosaicBox}</div>`
      + `<div class="row">${treeBox}</div>`
      + `<div class="row">${flowBox}</div>`
      + `<div class="row ${paretoBox ? 'wide' : ''}">${ackBox}${paretoBox}</div>`
      + (curveBox ? `<div class="row">${curveBox}</div>` : '')
      + `<div class="row ${supBox ? 'wide' : ''}">${cveBox}${supBox}</div>`
      + `<div class="row">${offBox}</div>`
      + `<div class="row">${invBox}</div>`
      + `<div class="row ${projS ? 'wide' : ''}">${mandateBox}${projS ? box('Projected readiness · SBOM',
          'What this section reads once the top three actions are complete.', projS) : ''}</div>`;
  }

  /* ---------- AIBOM ---------- */
  let aiSec = '';
  const ai = r.sections.find(s => s.key === 'aibom');
  if (ai){
    const a = r.aibom;
    /* the lineage arc diagram was cut: the inheritance matrix already carries the
       model-to-dataset links, and does it in a shape that does not degrade as the
       component count rises */
    const projA = projectionBars(r.projection.byBom['AIBOM']);
    const anatBox = box('What the model card actually documents',
      'The CycloneDX model card has a fixed shape. This draws that shape and lights up what is filled in.',
      cardAnatomyPanel(a.cardAnatomy),
      'Every field shown is one CycloneDX 1.6 defines for <code>modelCard</code>. A single completeness percentage hides which block is empty, and the blocks are not interchangeable — <b>Considerations</b> is the one an AI governance review opens first, and the one that cannot be reconstructed from the weights.',
      'acc-lic');
    const sensBox = box('Does the prose agree with the fields?',
      'What each dataset description says about its contents, next to what the document formally declares.',
      sensitivityPanel(a.sensitivityFlags),
      'The left column is pattern-matched from the free-text <code>description</code>; the right is the declared <code>classification</code> and <code>sensitiveData</code> fields. This can only ever raise a question — it cannot establish that personal data is present, and it is deliberately worded as unreconciled rather than as a finding.',
      'acc-warn');
    const govBox = box('Who is accountable for the data',
      'The governance roles recorded against each training dataset.',
      governancePanel(a.governance, a.allParties, a.singleParty),
      'CycloneDX separates <b>owner</b>, <b>steward</b> and <b>custodian</b> because they are different obligations — accountable for it, decides its use, holds it. One party in every role means the document attests to itself.',
      'acc-teal');
    const lineageBox = box('What this model inherits from',
      'Declared components solid, artefacts the document only names in prose or tags dashed. The dashed ones shaped this model but appear nowhere in the component list.',
      lineageGraph(a),
      'Ghost nodes are <b>candidates extracted from free text</b>, not declared dependencies — each carries the sentence it came from so a wrong one can be dismissed at a glance. A model that labelled your training data passes its own behaviour into anything trained on that data, which is an inheritance no <code>dependencies</code> block in this document records.',
      'acc-teal');
    const cwBox = box('What a reviewer can actually ask',
      'The questions common AI-governance frameworks ask, against the fields in this document that would answer them.',
      crosswalkPanel(a.crosswalk, a.cwEvidenced, a.cwScored),
      'This is <b>evidence availability, not compliance</b>. A populated field means the question can be answered from the document; it does not mean the obligation is met — that is a judgement no BOM can make. Rows CycloneDX has no field for are marked <i>not expressible</i> rather than scored as failures, because penalising a document for what it structurally cannot carry would be an invented number.',
      'acc-sev');
    aiSec = sectionHead('AI systems','AIBOM','where the weights came from, what they inherit, what can ship')
      + scoreStrip(ai, r.findings)
      + `<div class="row wide">${box('Model clearance',
          'Each model placed by how permissive its licence is against how much evidence it carries. The corner labels say what each quadrant means for a release.',
          quadrant(a.quadrant),
          'Bubble size is training-dataset links. Bottom-left is what stops a release: restrictive terms with thin evidence.')}
        ${box('Supply-chain posture',
          'Where the weights came from, and whether the data behind them is safe to have trained on.',
          posture(a.origin, a.sens),
          '<b>Opaque</b> means no distribution or attestation reference at all — the model cannot be traced to a source. Personal or confidential training data needs a lawful basis on record.')}</div>
        <div class="row">${lineageBox}</div>
        <div class="row">${anatBox}</div>
        <div class="row">${sensBox}</div>
        <div class="row">${govBox}</div>
        <div class="row">${cwBox}</div>
        <div class="row ${projA ? 'wide' : ''}">${box('Licence inheritance',
          'Which model was trained on which dataset, and whether that data imposes terms stricter than the model’s own licence.',
          compatMatrix(a.compat),
          'A permissive model trained on non-commercial data is not permissive in practice. <b>!</b> marks that inheritance; <b>no lineage</b> marks a model with no declared training data at all.')}
        ${projA ? box('Projected readiness · AIBOM','What this section reads once the top three actions are complete.', projA) : ''}</div>`;
  }

  /* ---------- CBOM ---------- */
  let cbSec = '';
  const cb = r.sections.find(s => s.key === 'cbom');
  if (cb){
    const c = r.cbom;
    const fnBox = box('Cryptographic function map',
      'What cryptography this codebase performs, cross-cut by how exposed each function is to quantum attack.',
      functionMap(c.fnMap, c.bands),
      `Rows are primitives — a closed vocabulary — so this holds its shape at any inventory size. <b>Not assessed</b> is its own column, because an unmeasured algorithm is not a safe one. <b>${c.algoRows.filter(a => a.family && (a.params || a.curve || a.bits) && a.functions.length && a.lvl !== null).length} of ${c.algoRows.length}</b> algorithms carry complete strength evidence; hover a cell for what each one records.`);
    const hotBox = box('Migration effort',
      'How far each risk band reaches into the source. Bad algorithms matter less than how many places they are called from.',
      migrationEffort(c.effort, c.dirs, c.occurrences),
      'Three retired primitives touched in one file is an afternoon; three touched across ninety files is a programme.');
    const blastBox = box('Migration blast radius',
      'Which keys, certificates and protocols stop working if a given primitive is retired.',
      blastMatrix(c.blast),
      'A radius of zero means either genuinely unused, or an inventory that has not recorded what depends on it.');
    const certBox = c.certs.length ? box('Renewal runway',
      'Each certificate on an 18-month horizon with the 45- and 120-day renewal bands.',
      expiryHorizon(c.certs),
      'Undated certificates sit on a dashed rail because no renewal can be scheduled for them.') : '';
    const assureBox = box('Can we prove it?',
      'Every algorithm against the six evidence fields an assessor asks for. A sparse row means detected by name and nothing more.',
      assuranceMatrix(c.assurance),
      'Fields read from <code>cryptoProperties</code>: primitive, algorithm family, a strength indicator (parameter set, key size or curve), NIST quantum level, OID, and certification level. An inventory that cannot evidence these is a list of names, not an assessment.',
      'acc-warn');
    const fnCovBox = box('What this codebase performs',
      'The cryptographic operations actually carried out, sized by call sites and coloured by the weakest algorithm performing each.',
      functionCoverage(c.fnCoverage, c.occurrences),
      '<code>cryptoFunctions</code> is a closed CycloneDX vocabulary, so this axis is fixed and the panel holds its shape at any inventory size. A migration has to preserve these operations — the algorithm names behind them are replaceable, the operations are not.',
      'acc-teal');
    const provBox = box('Where the cryptography comes from',
      'Each algorithm traced to the library that provides it, so a library swap can be sized before it is started.',
      cryptoProvenance(c.provenanceGroups, c.anyAttributed),
      'Read from the <code>cbom:library</code> property. Algorithms sharing a provider move together — that is one migration, not several. Anything unattributed was detected in source without a resolvable provider.',
      'acc-ok');
    const siteBox = box('Where in the code it actually sits',
      'Every recorded sighting plotted at its real line number, so a file that bundles its cryptography reads differently from one that scatters it.',
      callSiteMap(c.siteMap),
      'Uses the <code>line</code> on each <code>evidence.occurrence</code> — the one field in this document that says <i>where</i> rather than <i>how many</i>. Files share a single line-number scale so they are comparable; a stacked tick marks several assets on one line. <b>Tight</b> means every sighting falls inside a 40-line window.',
      'acc-teal');
    const moscaBox = box('Are we already late?',
      'Mosca’s inequality: if secrecy lifetime plus migration time runs past the arrival of quantum computing, data harvested today is already exposed.',
      moscaHorizon(c.algoRows),
      'The algorithm and call-site counts come from this CBOM. <b>The three sliders do not</b> — they are your planning assumptions, and they are adjustable so nobody mistakes them for measurements. Defaults are illustrative only; substitute your own retention policy, a real migration estimate, and whatever quantum timeline your organisation plans against.',
      'acc-sev');
    const hasRefs = c.blast.consumers.length > 0;
    const blastNote = hasRefs ? '' :
      `<div class="note">No key, certificate or protocol in this CBOM references an algorithm, so a migration blast radius cannot be computed. Generators that emit <b>algorithmRef</b>, <b>signatureAlgorithmRef</b> or cipher-suite references populate that view — worth raising with whoever owns the generator.</div>`;
    const projC = projectionBars(r.projection.byBom['CBOM']);
    cbSec = sectionHead('Cryptography','CBOM','what it performs, how far it reaches, when it falls due')
      + scoreStrip(cb, r.findings) + blastNote
      + `<div class="row wide">${fnBox}${hotBox}</div>`
      + `<div class="row">${assureBox}</div>`
      + `<div class="row wide">${fnCovBox}${provBox}</div>`
      + `<div class="row">${siteBox}</div>`
      + `<div class="row">${moscaBox}</div>`
      + (certBox ? `<div class="row">${certBox}</div>` : '')
      + `<div class="row ${hasRefs ? 'wide' : ''}">${projC ? box('Projected readiness · CBOM',
          'What this section reads once the top three actions are complete.', projC) : ''}${hasRefs ? blastBox : ''}</div>`;
  }

  /* ---------- issue register (scales by grouping, not listing) ---------- */
  const groups = r.rules
    .map(g => ({ ...g, items: g.items.filter(f => matchFinding(f, flt) &&
      (!q || (f.ref||'').toLowerCase().includes(q) || f.rule.toLowerCase().includes(q))) }))
    .filter(g => g.items.length);
  const shownGroups = groups.slice(0, state.pages * PAGE);
  const totalShown = groups.reduce((a,g) => a+g.items.length, 0);
  const sevChips = SEV.filter(k => r.findings.some(f => f.sev === k)).map(k => {
    const n = r.findings.filter(f => f.sev === k).length, key = 'sev:'+k;
    return `<span class="sevchip${sel(key)}"${pickAttr({ key, label:k+' findings', sev:k })}
      ${tip(`${n} ${k} finding${n===1?'':'s'} · click to filter`)}>
      <b style="color:var(--sev-${k})">${n}</b><span>${k}</span></span>`;
  }).join('');
  const groupHtml = shownGroups.length ? shownGroups.map((gr,i) => `
    <div class="grp${state.open.has(gr.key) ? ' open' : ''}" data-grp="${esc(gr.key)}">
      <div class="grph"><span class="caret">▶</span>
        <span class="sev sv-${gr.sev}">${gr.sev}</span>
        <span class="gt">${esc(gr.rule)}<em>${gr.src} · ${esc(gr.dim)}</em></span>
        <span class="gn"><b>${gr.items.length}</b> affected</span></div>
      <div class="grpb">${gr.items.slice(0, state.open.has(gr.key) ? 500 : 0).map(f => `
        <div class="item"><span class="nm">${esc(f.ref || '—')}</span><span class="dt">${esc(f.detail)}</span></div>`).join('')}</div>
    </div>`).join('')
    : `<div class="empty">${flt || q ? 'Nothing matches the current selection — which for a clean area is the right answer.' : 'No findings. Every dimension met its threshold.'}</div>`;
  const more = groups.length > shownGroups.length
    ? `<div class="more"><button id="loadmore" class="ghost">Show ${Math.min(PAGE, groups.length - shownGroups.length)} more rule groups (${groups.length - shownGroups.length} remaining)</button></div>` : '';
  const chip = flt ? `<span class="fchip">Filtered: <b>${esc(flt.label)}</b><button id="clearfilter" aria-label="Clear filter">✕</button></span>` : '';

  const spdxNote = r.hasSpdx && !cb
    ? `<div class="note">SPDX has no cryptographic-asset model, so no CBOM view can be derived from it. Supply a CycloneDX CBOM for cryptography coverage.</div>` : '';

  $('#out').innerHTML = `
    ${sectionHead('Readiness overview','ALL', r.formats.join(' · ') + ' · ' + r.generated.slice(0,16).replace('T',' '))}
    <div class="row head">
      <div class="box verdict">${gauge(r.composite, rate(r.composite))}
        <span class="pill ${g}">Gate: ${r.gate}</span>
        <div class="meta">${r.sections.map(s => s.title).join(' · ')}<br>${r.blockers} blocking finding${r.blockers===1?'':'s'}</div></div>
      <div class="kpis">${kpis}</div>
    </div>
    <div class="row">${box('Readiness scorecard',
      'Every BOM type against its five analysis dimensions. Hover a cell for the evidence behind the score; click to filter the register.',
      `<div class="matrix">${matrix}</div>`,
      'Dimensions the document cannot express are marked <b>N/A</b> and left out of the average, so a CBOM without certificates is not scored as failing certificate management.')}</div>
    ${sbomSec}${aiSec}${cbSec}
    ${spdxNote}
    ${sectionHead('What to do about it','ALL', r.plan.length + ' distinct actions behind ' + r.findings.length + ' findings')}
    <div class="row">${box('Remediation plan',
      'Every finding mapped to the fix behind it, ranked by how much each fix clears. The register below is the symptom list; this is the work list.',
      (r.plan.length ? `<div class="lever"><b>${r.leverage.blockers}%</b> of blocking findings and
        <b>${r.leverage.findings}%</b> of all findings clear with the top three actions alone, across ${r.leverage.actions} in total.</div>` : '')
      + remediationPlan(r.plan, r.findings.length, r.blockers),
      'Effort is a coarse band, not an estimate. Click an action to pull everything it clears into the register.')}</div>
    <div class="row">${box('Composite outlook',
      'What the whole picture reads once the top three actions are complete. Each section carries its own breakdown above.',
      `<div class="lever"><b>${r.projection.before}% → ${r.projection.after}%</b> composite readiness, and the gate moves from
        <b style="font-size:13px">${r.projection.gateBefore}</b> to <b style="font-size:13px">${r.projection.gateAfter}</b>
        (${r.projection.blockersAfter} blocking finding${r.projection.blockersAfter===1?'':'s'} left).</div>`,
      'A simulation, not a promise: it assumes each action is completed in full for every item it covers. Actions modelled: ' +
      r.projection.actions.map(a => '<b>' + esc(a) + '</b>').join(', ') + '.')}</div>
    <div class="row">${box('Document provenance',
      'Whether these BOMs can be defended in an audit — who produced them, when, with what, and whether that is provable.',
      `<div class="provwrap">${provenanceCard(r.provenance)}</div>`,
      'Document-level only. Component-level evidence is the scorecard\'s job; this asks whether the document itself stands up.')}</div>
    ${sectionHead('Issue register','ALL', totalShown + ' of ' + r.findings.length + ' findings in ' + groups.length + ' rule groups')}
    <div class="reg">
      <div class="reghead"><h4>Findings by rule</h4>
        <span class="cnt">${totalShown} finding${totalShown===1?'':'s'} · ${groups.length} rule${groups.length===1?'':'s'}</span>
        <span class="sevchips">${sevChips}</span>
        ${chip}
        <span class="search"><input id="q" type="search" placeholder="Filter by component or rule…" value="${esc(state.query)}"></span>
      </div>${groupHtml}${more}</div>`;

  /* the register filter re-renders the whole view; the inventory's own
     search should survive that rather than silently resetting */
  if (typeof invState !== 'undefined'){
    const iq = document.getElementById('invq');
    if (iq){
      iq.value = invState.q;
      document.querySelectorAll('[data-invf]').forEach(c =>
        c.classList.toggle('on', c.getAttribute('data-invf') === invState.f));
      applyInvFilter();
    }
  }

  $('#out').classList.toggle('filtering', !!flt);
  if (flt) $('#out').querySelectorAll('[data-pick]').forEach(el => {
    try { if (JSON.parse(el.getAttribute('data-pick')).key === flt.key){
      el.classList.add('sel'); const b = el.closest('.box'); if (b) b.classList.add('dimmed'); } } catch(_){}
  });
}

/* ============================================================
   7 · INTERACTION
   ============================================================ */
const tipEl = document.createElement('div');
tipEl.id = 'tip'; tipEl.setAttribute('role','tooltip'); document.body.appendChild(tipEl);
let tipTarget = null;
function moveTip(e){
  const pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
  tipEl.style.left = Math.max(8,x)+'px'; tipEl.style.top = Math.max(8,y)+'px';
}
document.addEventListener('mouseover', e => {
  const t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!t || t === tipTarget) return;
  tipTarget = t; tipEl.innerHTML = t.getAttribute('data-tip'); tipEl.classList.add('on'); moveTip(e);
});
document.addEventListener('mousemove', e => { if (tipTarget) moveTip(e); });
document.addEventListener('mouseout', e => {
  if (!tipTarget) return;
  const to = e.relatedTarget;
  if (to && to.closest && to.closest('[data-tip]') === tipTarget) return;
  tipTarget = null; tipEl.classList.remove('on');
});

/* ============================================================
   8 · WIRING
   ============================================================ */
const SLOTS = ['sbom','aibom','cbom'];
const SLOT_META = { sbom:{ t:'SBOM', d:'software components' },
  aibom:{ t:'AIBOM', d:'models and datasets' }, cbom:{ t:'CBOM', d:'cryptographic assets' } };
const state = { slots:{ sbom:null, aibom:null, cbom:null }, report:null, filter:null,
  query:'', pages:1, open:new Set() };
const fail = m => $('#err').innerHTML = m ? `<div class="err">${esc(m)}</div>` : '';
/* The repair warning belongs to whatever is currently loaded, not to the last
   upload — otherwise loading a second, valid document silently cleared a
   warning about a repaired one that was still in play. */
function refreshNotice(){
  const bad = SLOTS.map(k => state.slots[k]).filter(d => d && d.lenient);
  if (!bad.length){ $('#notice').innerHTML = ''; return; }
  const names = bad.map(d => `<b>${esc(d.name)}</b>`).join(' and ');
  $('#notice').innerHTML = `<div class="notice">${names} ${bad.length>1?'were':'was'} not valid JSON —
    ${bad.length>1?'they':'it'} had bare, unquoted values where JSON requires quotes (for example
    <code>"bom-ref": crypto/algorithm/…</code> instead of <code>"bom-ref": "crypto/algorithm/…"</code>).
    ${bad.length>1?'They were':'It was'} repaired in memory to read ${bad.length>1?'them':'it'}; the file${bad.length>1?'s':''}
    on disk ${bad.length>1?'are':'is'} untouched. Worth flagging to whatever generated ${bad.length>1?'them':'it'} — see the
    <b>Well-formed JSON</b> row under Document provenance, and check every future export from that tool for the same defect.</div>`;
}

function renderSlots(){
  document.querySelectorAll('.slot').forEach(el => {
    const k = el.dataset.slot, d = state.slots[k], m = SLOT_META[k];
    el.classList.toggle('filled', !!d);
    const mismatch = d && !d.kinds.includes(k)
      ? `<span class="flag">△ No ${m.t} assets found in this document — the view will read as empty.</span>` : '';
    const spill = d ? d.kinds.filter(x => x !== k && !state.slots[x]) : [];
    const also = spill.length ? `<span class="flag">△ Also carries ${spill.map(x => SLOT_META[x].t).join(' and ')} assets — load it into that slot too.</span>` : '';
    el.innerHTML = `<span class="sk">${m.t}</span><span class="sd">${m.d}</span>
      <span class="sf">${d ? `<em>${esc(d.name)}</em><br><span class="badge">${esc(d.label)}</span><br>${esc(d.subject)} · ${d.components.length} items`
        : 'Drop a JSON file here, or use the button below.'}</span>
      ${mismatch}${also}
      <span class="sa"><button data-act="upload"${d?'':' class="primary"'}>${d?'Replace':'Upload'}</button>
        ${d?'<button data-act="remove">Remove</button>':''}</span>`;
  });
}
function refresh(){
  state.filter = null; state.pages = 1; state.open = new Set(); state.query = '';
  renderSlots();
  state.report = SLOTS.some(k => state.slots[k]) ? analyse(state.slots) : null;
  render(state.report);
}
function loadInto(slot, file){
  const rd = new FileReader();
  rd.onload = () => {
    try { const doc = ingest(file.name, rd.result); doc.slot = slot; state.slots[slot] = doc; fail(''); }
    catch(e){ fail(file.name + ' — ' + e.message); }
    refreshNotice();
    refresh();
  };
  rd.onerror = () => { fail('Could not read ' + file.name + '.'); refreshNotice(); refresh(); };
  rd.readAsText(file);
}
let pendingSlot = null;
$('#file').onchange = e => { if (e.target.files[0] && pendingSlot) loadInto(pendingSlot, e.target.files[0]); e.target.value = ''; };
document.querySelector('.slots').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  const slot = e.target.closest('.slot').dataset.slot;
  if (btn.dataset.act === 'upload'){ pendingSlot = slot; $('#file').click(); }
  if (btn.dataset.act === 'remove'){ state.slots[slot] = null; refreshNotice(); refresh(); }
});
document.querySelectorAll('.slot').forEach(el => {
  ['dragenter','dragover'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.add('hot'); }));
  ['dragleave','drop'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.remove('hot'); }));
  el.addEventListener('drop', e => { if (e.dataTransfer.files[0]) loadInto(el.dataset.slot, e.dataTransfer.files[0]); });
});

$('#out').addEventListener('click', e => {
  if (e.target.id === 'clearfilter'){ state.filter = null; document.body.classList.add('nofx'); render(state.report); return; }
  if (e.target.id === 'loadmore'){ state.pages++; document.body.classList.add('nofx'); render(state.report); return; }
  const grp = e.target.closest('.grph');
  if (grp){ const k = grp.parentElement.dataset.grp;
    state.open.has(k) ? state.open.delete(k) : state.open.add(k);
    document.body.classList.add('nofx'); render(state.report); return; }
  const t = e.target.closest('[data-pick]'); if (!t) return;
  const p = JSON.parse(t.getAttribute('data-pick'));
  state.filter = (state.filter && state.filter.key === p.key) ? null : p;
  state.pages = 1;
  document.body.classList.add('nofx'); render(state.report);
  const reg = document.querySelector('.reg'); if (reg) reg.scrollIntoView({ behavior:'smooth', block:'nearest' });
});
/* --- component inventory: filtered in place, so typing never costs a
   full re-render and never steals the caret --- */
const invState = { q:'', f:'all' };
function applyInvFilter(){
  const body = document.getElementById('invbody'); if (!body) return;
  const q = invState.q.trim().toLowerCase();
  let shown = 0, total = 0;
  body.querySelectorAll('tr').forEach(tr => {
    total++;
    const hay = tr.getAttribute('data-inv') || '';
    const risk = tr.getAttribute('data-risk'), vuln = tr.getAttribute('data-vuln');
    const passF = invState.f === 'all' || (invState.f === 'vuln' ? vuln === 'yes' : risk === invState.f);
    const passQ = !q || hay.includes(q);
    const on = passF && passQ;
    tr.style.display = on ? '' : 'none';
    if (on) shown++;
  });
  const cnt = document.getElementById('invcount');
  if (cnt) cnt.textContent = shown === total
    ? `${total} of ${total} components shown`
    : `${shown} of ${total} components shown · filter active`;
}
$('#out').addEventListener('click', e => {
  const chip = e.target.closest('[data-invf]'); if (!chip) return;
  e.stopPropagation();
  invState.f = chip.getAttribute('data-invf');
  chip.parentElement.querySelectorAll('[data-invf]').forEach(c => c.classList.toggle('on', c === chip));
  applyInvFilter();
}, true);

$('#out').addEventListener('input', e => {
  /* Mosca sliders recompute only their own panel — a full re-render would
     reset the slider mid-drag and lose the pointer. */
  if (e.target.dataset && e.target.dataset.mosca){
    const get = k => { const el = document.getElementById('mosca-'+k); return el ? Number(el.value) : 0; };
    const shelf = get('shelf'), mig = get('mig'), q = get('q');
    ['shelf','mig','q'].forEach(k => { const o = document.getElementById('mosca-'+k+'-out');
      if (o) o.textContent = get(k) + 'y'; });
    const body = document.getElementById('moscabody');
    const rows = state.report && state.report.cbom ? state.report.cbom.algoRows : null;
    if (body && rows) body.innerHTML = moscaBody(shelf, mig, q, rows);
    return;
  }
  if (e.target.id === 'invq'){ invState.q = e.target.value; applyInvFilter(); return; }
  if (e.target.id !== 'q') return;
  state.query = e.target.value; state.pages = 1;
  document.body.classList.add('nofx'); render(state.report);
  const inp = document.getElementById('q'); if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
});

$('#clear').onclick = () => { SLOTS.forEach(k => state.slots[k] = null); fail(''); refreshNotice(); refresh(); };
$('#board').onclick = () => window.print();
$('#export').onclick = () => {
  const blob = new Blob([JSON.stringify(state.report, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'xbom-readiness-report.json'; a.click();
  URL.revokeObjectURL(a.href);
};

renderSlots(); render(null);
</script>
</body>
</html>
