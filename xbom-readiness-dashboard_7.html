        { k:'modelArchitecture',  label:'Model architecture',  get:mp => mp.modelArchitecture },
        { k:'datasets',           label:'Training datasets',   get:mp => (mp.datasets||[]).length ? 'yes' : '' },
        { k:'inputs',             label:'Inputs',          get:mp => (mp.inputs||[]).length ? 'yes' : '' },
        { k:'outputs',            label:'Outputs',         get:mp => (mp.outputs||[]).length ? 'yes' : '' }
      ] },
    { key:'quantitativeAnalysis', label:'Quantitative analysis', hint:'how well it actually performs',
      fields:[
        { k:'performanceMetrics', label:'Performance metrics', get:(_,mc) => ((mc.quantitativeAnalysis||{}).performanceMetrics||[]).length ? 'yes' : '' },
        { k:'graphics',           label:'Graphics',            get:(_,mc) => (((mc.quantitativeAnalysis||{}).graphics||{}).collection||[]).length ? 'yes' : '' }
      ] },
    { key:'considerations', label:'Considerations', hint:'who it is for and how it can go wrong',
      fields:[
        { k:'users',                     label:'Intended users',      get:(_,mc) => ((mc.considerations||{}).users||[]).length ? 'yes' : '' },
        { k:'useCases',                  label:'Use cases',           get:(_,mc) => ((mc.considerations||{}).useCases||[]).length ? 'yes' : '' },
        { k:'technicalLimitations',      label:'Technical limitations', get:(_,mc) => ((mc.considerations||{}).technicalLimitations||[]).length ? 'yes' : '' },
        { k:'performanceTradeoffs',      label:'Performance tradeoffs', get:(_,mc) => ((mc.considerations||{}).performanceTradeoffs||[]).length ? 'yes' : '' },
        { k:'ethicalConsiderations',     label:'Ethical considerations', get:(_,mc) => ((mc.considerations||{}).ethicalConsiderations||[]).length ? 'yes' : '' },
        { k:'fairnessAssessments',       label:'Fairness assessments', get:(_,mc) => ((mc.considerations||{}).fairnessAssessments||[]).length ? 'yes' : '' },
        { k:'environmentalConsiderations', label:'Environmental',     get:(_,mc) => (mc.considerations||{}).environmentalConsiderations ? 'yes' : '' }
      ] }
  ];
  const cardAnatomy = models.map(m => {
    const mc = m.model || {}, mp = mc.modelParameters || {};
    const groups = MC_SECTIONS.map(s => {
      const fields = s.fields.map(f => ({ ...f, value: clean(String(f.get(mp, mc) || '')) }));
      return { ...s, fields, have: fields.filter(f => f.value).length, of: fields.length };
    });
    const have = groups.reduce((n,g) => n+g.have, 0), of = groups.reduce((n,g) => n+g.of, 0);
    return { id:m.id, name:m.name, hasCard:!!m.model, groups, have, of, pctv: pct(have, of) };
  });


  /* --- governance chain: who is accountable for each asset --- */
  const ownerOf = d => {
    const g = (d.dataset || {}).governance || {};
    const pick = arr => (arr||[]).map(o => clean((o.organization||{}).name) || clean((o.contact||{}).name) || clean(o.name)).filter(Boolean);
    return { owners:pick(g.owners), stewards:pick(g.stewards), custodians:pick(g.custodians) };
  };
  const governance = data.map(d => {
    const g = ownerOf(d);
    return { name:d.name, id:d.id, ...g,
      roles: ['owners','stewards','custodians'].filter(k => g[k].length).length,
      any: g.owners.concat(g.stewards, g.custodians) };
  });
  const allParties = [...new Set(governance.flatMap(g => g.any))];
  const singleParty = allParties.length === 1 ? allParties[0] : null;

  /* --- implied assets: things this model inherits from that the BOM never declares ---
     Dataset descriptions routinely name the models that labelled them and the
     work they derive from. Those upstreams shaped the training data, so their
     behaviour propagates into the model — but they appear nowhere as components.
     This is heuristic extraction from free text and it WILL sometimes be wrong,
     so every candidate is shown with the sentence it came from and is labelled a
     candidate for a human to confirm, never asserted as a dependency. */
  const DERIVE_TRIGGER = /(ensemble of|fine-?tuned? on|annotated?[^.]{0,14}using|labell?ed[^.]{0,14}using|trained on|distilled from|initiali[sz]ed from|based on|derived from|built on)/i;
  /* hyphenated words that are process or prose, not artefact names */
  const NOT_A_NAME = new Set(['crowd-workers','pseudo-labelelling','pseudo-labelling','pseudo-labeled',
    'pseudo-labelled','fine-tuned','fine-tuning','state-of-the-art','open-source','high-quality',
    'good-quality','real-world','token-classification','de-identification','multi-lingual','pre-trained']);
  const looksLikeArtefact = t => {
    const low = t.toLowerCase();
    if (NOT_A_NAME.has(low)) return false;
    if (low.length < 4) return false;
    if (/^\d/.test(low)) return false;
    if (t.includes('/')) return true;                    /* org/repo reference */
    /* hyphenated AND carrying a model-ish marker */
    return /-/.test(t) && /(model|base|large|small|mini|tiny|bert|gpt|deberta|roberta|llama|t5|xl|v\d|\d+[bm])/i.test(t);
  };
  const impliedFromProse = [];
  data.forEach(d => {
    const text = String((d.dataset || {}).description || '');
    text.split(/(?<=\.)\s+/).forEach(sentence => {
      if (!DERIVE_TRIGGER.test(sentence)) return;
      const cands = (sentence.match(/[A-Za-z][A-Za-z0-9]*(?:[-_.\/][A-Za-z0-9]+)+/g) || [])
        .map(t => t.replace(/[.,;:]+$/, ''))
        /* a URL-shaped capture points at a real artefact — keep the org/repo it
           names rather than the hostname, which is not the thing being referenced */
        .map(t => { const m = t.match(/^[a-z0-9.-]+\.[a-z]{2,}\/(.+)$/i);
          if (!m) return t;
          const segs = m[1].split('/').filter(Boolean);
          return segs.length >= 2 ? segs.slice(-2).join('/') : segs.join('/'); })
        .filter(looksLikeArtefact);
      [...new Set(cands)].forEach(name => {
        if (impliedFromProse.some(x => x.name.toLowerCase() === name.toLowerCase() && x.via === d.name)) return;
        impliedFromProse.push({ name, via:d.name, viaId:d.id, kind:'model',
          evidence: clipTxt(sentence.trim(), 190) });
      });
    });
  });
  /* tags name the runtime stack that no component declares */
  const TAG_STACK = { transformers:'framework', pytorch:'framework', tensorflow:'framework', jax:'framework',
    onnx:'framework', keras:'framework', 'sentence-transformers':'framework', diffusers:'framework',
    safetensors:'format', gguf:'format' };
  const impliedFromTags = [];
  models.forEach(m => (m.tags || []).forEach(t => {
    const low = String(t).toLowerCase();
    if (TAG_STACK[low] && !libs.some(l => l.name.toLowerCase() === low)
        && !impliedFromTags.some(x => x.name === low))
      impliedFromTags.push({ name:low, kind:TAG_STACK[low], via:m.name, viaId:m.id,
        evidence:'named in the model’s tags as "' + t + '", but declared as no component' });
  }));
  const implied = { prose:impliedFromProse, tags:impliedFromTags,
    total: impliedFromProse.length + impliedFromTags.length };

  /* --- regulatory evidence crosswalk --------------------------------
     Which questions the common AI-governance frameworks ask can this
     document answer AT ALL. This reports evidence availability, not
     compliance: a green row means the field is populated, never that
     the obligation is met. Rows CycloneDX has no field for are marked
     as such rather than scored as failures. */
  const mcOf = models[0] ? (models[0].model || {}) : {};
  const mcHas = (path) => {
    const parts = path.split('.');
    let v = mcOf;
    for (const p of parts){ v = (v || {})[p]; if (v === undefined || v === null) return false; }
    return Array.isArray(v) ? v.length > 0 : !!v;
  };
  const anyData = f => data.length > 0 && data.every(f);
  const someData = f => data.some(f);
  const CROSSWALK = [
    { area:'Intended purpose and users', asks:['EU AI Act','ISO 42001'],
      fields:'modelCard.considerations.useCases / .users, modelParameters.task',
      have: (mcHas('considerations.useCases') || mcHas('considerations.users')) && mcHas('modelParameters.task'),
      part: mcHas('modelParameters.task'),
      fix:'Add useCases and users to the card’s considerations block.' },
    { area:'Training-data provenance', asks:['EU AI Act','NIST AI RMF','ISO 42001'],
      fields:'data[].governance, data[].contents.url, licences',
      have: data.length > 0 && anyData(d => ((d.dataset||{}).governance) && d.licenses.length),
      part: someData(d => (d.dataset||{}).governance || (d.dataset||{}).contents),
      fix:'Declare a licence on every dataset; governance alone does not establish the right to use it.' },
    { area:'Personal data and lawful basis', asks:['EU AI Act','ISO 42001'],
      fields:'data[].classification, data[].sensitiveData',
      have: data.length > 0 && anyData(d => (d.dataset||{}).classification || (d.dataset||{}).sensitiveData),
      part: false,
      fix: unreconciled.length
        ? 'Descriptions already refer to sensitive content — set classification and sensitiveData to match, or correct the description.'
        : 'Set classification and sensitiveData on each dataset.' },
    { area:'Accuracy and performance evidence', asks:['EU AI Act','NIST AI RMF'],
      fields:'modelCard.quantitativeAnalysis.performanceMetrics',
      have: mcHas('quantitativeAnalysis.performanceMetrics'), part:false,
      fix:'Record at least one metric with its slice, so claimed accuracy can be checked and regression detected.' },
    { area:'Known limitations and failure modes', asks:['EU AI Act','NIST AI RMF'],
      fields:'considerations.technicalLimitations, .performanceTradeoffs',
      have: mcHas('considerations.technicalLimitations'),
      part: mcHas('considerations.performanceTradeoffs'),
      fix:'Record technical limitations — the conditions under which the model should not be relied on.' },
    { area:'Bias and fairness assessment', asks:['EU AI Act','NIST AI RMF','ISO 42001'],
      fields:'considerations.fairnessAssessments, .ethicalConsiderations',
      have: mcHas('considerations.fairnessAssessments'),
      part: mcHas('considerations.ethicalConsiderations'),
      fix:'Add a fairnessAssessment naming the group at risk, the harm, and the mitigation.' },
    { area:'Environmental impact', asks:['EU AI Act','ISO 42001'],
      fields:'considerations.environmentalConsiderations',
      have: mcHas('considerations.environmentalConsiderations'), part:false,
      fix:'Record training energy or emissions if measured.' },
    { area:'Model identity and integrity', asks:['NIST AI RMF','ISO 42001'],
      fields:'component.version, hashes, externalReferences',
      have: models.length > 0 && models.every(m => m.version && m.hash),
      part: models.some(m => m.refs.length),
      fix:'Pin a version and publish a hash so the artefact assessed is provably the artefact deployed.' },
    { area:'Accountability and roles', asks:['ISO 42001'],
      fields:'data[].governance.owners / .stewards / .custodians',
      have: data.length > 0 && anyData(d => { const g=(d.dataset||{}).governance||{};
        return (g.owners||[]).length && (g.stewards||[]).length && (g.custodians||[]).length; }),
      part: someData(d => (((d.dataset||{}).governance)||{}).owners),
      fix:'Name a steward and custodian, not just an owner — they are different obligations.' },
    { area:'Third-party component inventory', asks:['EU AI Act','NIST AI RMF'],
      fields:'components of type library / framework',
      have: libs.length > 0 && libs.every(l => l.licenses.length),
      part: libs.length > 0,
      fix: implied.tags.length
        ? 'The tags name ' + implied.tags.map(t => t.name).join(' and ') + ' but no library component is declared.'
        : 'Declare the runtime stack as components so it can be assessed and licence-cleared.' },
    { area:'Human oversight measures', asks:['EU AI Act'], expressible:false,
      fields:'no CycloneDX field carries this',
      fix:'Has to live in your own technical documentation — a BOM cannot evidence it.' },
    { area:'Post-market monitoring', asks:['EU AI Act'], expressible:false,
      fields:'no CycloneDX field carries this',
      fix:'Operational process evidence, outside the scope of any BOM format.' }
  ].map(r => ({ ...r,
    status: r.expressible === false ? 'na' : r.have ? 'yes' : r.part ? 'part' : 'no' }));
  const cwScored = CROSSWALK.filter(r => r.status !== 'na');
  const cwEvidenced = cwScored.filter(r => r.status === 'yes').length;

  cardAnatomy.forEach(c => {
    const con = c.groups.find(g => g.key === 'considerations');
    const qa = c.groups.find(g => g.key === 'quantitativeAnalysis');
    if (con && con.have === 0) add('high','No considerations recorded','Model Card Lineage',c.name,
      'The card declares no intended users, limitations, ethical considerations or fairness assessment, so intended use and known failure modes cannot be reviewed.');
    else if (con && !con.fields.find(f => f.k === 'fairnessAssessments').value)
      add('medium','No fairness assessment','Model Card Lineage',c.name,
        'No group-at-risk assessment recorded, which most AI governance frameworks ask for before deployment.');
    if (qa && qa.have === 0) add('medium','No performance evidence','Model Card Lineage',c.name,
      'No metrics recorded, so claimed accuracy cannot be checked and regression after fine-tuning cannot be detected.');
  });
  unreconciled.forEach(s => add('high','Sensitivity claim unreconciled','Dataset Provenance',s.name,
    'The dataset description refers to ' + s.hits.slice(0,3).join(', ') +
    ', but no classification or sensitiveData field is declared. Confirm lawful basis, or set the field if the prose is inaccurate.'));

  const nodes = models.map(m => ({ id:m.id, name:m.name, kind:'model' }))
    .concat(data.map(d => ({ id:d.id, name:d.name, kind:'dataset' })))
    .concat(libs.map(l => ({ id:l.id, name:l.name, kind:'library' })));
  const ids = new Set(nodes.map(n => n.id));
  const links = [];
  Object.entries(deps).forEach(([from,tos]) => { if (ids.has(from)) tos.forEach(to => { if (ids.has(to)) links.push({ from, to }); }); });

  const quadrant = models.map(m => {
    const evid = [!!m.version, !!m.model, m.refs.length>0, trainedOn(m).length>0];
    return { id:m.id, name:m.name, x:LIC_SCORE[worstClass(m.licenses)], y:pct(evid.filter(Boolean).length,4),
      r:trainedOn(m).length, lic:worstClass(m.licenses),
      missing:['version','model card','provenance reference','training-data link'].filter((_,i) => !evid[i]) };
  });

  const RANK = { permissive:0, weak:1, review:2, strong:3, restricted:4, undeclared:5 };
  const compat = { datasets:data.map(d => ({ id:d.id, name:d.name, lic:worstClass(d.licenses) })),
    models:models.map(m => ({ id:m.id, name:m.name, lic:worstClass(m.licenses),
      linked: trainedOn(m).length > 0,
      cells:data.map(d => {
        if (!trainedOn(m).includes(d.id)) return { id:d.id, state:'none' };
        const dr = RANK[worstClass(d.licenses)], mr = RANK[worstClass(m.licenses)];
        return { id:d.id, dlic:worstClass(d.licenses), state: dr > mr ? 'conflict' : dr === mr ? 'equal' : 'ok' };
      }) })) };

  return { key:'aibom', title:'AIBOM', kind:'AI systems',
    count:models.length + ' models · ' + data.length + ' datasets', dims, findings:F,
    models, data, libs, nodes, links, quadrant, compat,
    cardAnatomy, sensitivityFlags, unreconciled, governance, allParties, singleParty,
    implied, crosswalk:CROSSWALK, cwEvidenced, cwScored:cwScored.length };
}

/* ---------------- CBOM ---------------- */
const PRIMITIVE_LABEL = { ae:'Authenticated encryption', 'block-cipher':'Block cipher', 'stream-cipher':'Stream cipher',
  hash:'Hash', mac:'MAC', signature:'Signature', pke:'Public-key encryption', kem:'Key encapsulation',
  'key-agree':'Key agreement', kdf:'Key derivation', drbg:'Random generation', combiner:'Combiner',
  other:'Other', unspecified:'Unspecified' };

function evalCBOM(docs){
  const all = docs.flatMap(d => d.components);
  const crypto = all.filter(c => c.type === 'crypto');
  const of = t => crypto.filter(c => (c.crypto||{}).assetType === t);
  const algos = of('algorithm'), keys = of('related-crypto-material'), protos = of('protocol'), certs = of('certificate');
  const ap = a => (a.crypto||{}).algorithmProperties || {};
  const kp = k => (k.crypto||{}).relatedCryptoMaterialProperties || {};
  const pp = p => (p.crypto||{}).protocolProperties || {};
  const cp = c => (c.crypto||{}).certificateProperties || {};
  const daysTo = iso => Math.round((new Date(iso) - NOW)/864e5);
  /* characterised = enough recorded to assess strength, however the generator spells it */
  const characterised = a => { const p = ap(a);
    return !!(p.primitive && (p.parameterSetIdentifier || p.classicalSecurityLevel || p.ellipticCurve ||
      p.algorithmFamily || p.nistQuantumSecurityLevel !== undefined)); };
  const quantumKnown = a => ap(a).nistQuantumSecurityLevel !== undefined && ap(a).nistQuantumSecurityLevel !== null;

  const sound = algos.filter(a => characterised(a) && !WEAK_ALGO.test(a.name));
  const managed = keys.filter(k => kp(k).state && kp(k).size);
  const hygienic = protos.filter(p => pp(p).version && parseFloat(pp(p).version) >= 1.2);
  const inDate = certs.filter(c => cp(c).notValidAfter && daysTo(cp(c).notValidAfter) > 45);
  const assessed = algos.filter(quantumKnown);
  const pq = algos.filter(a => (ap(a).nistQuantumSecurityLevel || 0) >= 1);

  const dims = [
    dim('Algorithm Risk','Algorithms',sound.length,algos.length,
      {pass:'sound',warn:'partly sound',fail:'retired or uncharacterised'},
      sound.length + ' of ' + algos.length + ' are characterised and not retired'),
    dim('Key Management','Keys',managed.length,keys.length,
      {pass:'managed',warn:'partly managed',fail:'unmanaged'},
      managed.length + ' of ' + keys.length + ' state size and lifecycle state',
      'this CBOM declares no key material'),
    dim('Protocol Hygiene','Protocols',hygienic.length,protos.length,
      {pass:'modern',warn:'mixed',fail:'obsolete in use'},
      hygienic.length + ' of ' + protos.length + ' are at TLS 1.2 or above',
      'this CBOM declares no protocols'),
    dim('Certificate Expiry','Certs',inDate.length,certs.length,
      {pass:'all in date',warn:'renewals due',fail:'expiring or undated'},
      inDate.length + ' of ' + certs.length + ' are dated and more than 45 days out',
      'this CBOM declares no certificates'),
    dim('PQC Readiness','PQC',pq.length,algos.length,
      {pass:'PQC ready',warn:'migration in progress',fail:'classical only'},
      pq.length + ' of ' + algos.length + ' meet a NIST quantum security level · ' +
      (algos.length - assessed.length) + ' not assessed at all')
  ];

  const F = [];
  const add = (sev,rule,dimName,ref,detail) => F.push({ sev, src:'CBOM', rule, dim:dimName, ref, detail });
  algos.forEach(a => {
    if (WEAK_ALGO.test(a.name)) add('critical','Retired primitive in use','Algorithm Risk',a.name,
      'Broken or withdrawn primitive still present in the inventory. Schedule replacement.');
    if (!ap(a).primitive) add('medium','Algorithm not characterised','Algorithm Risk',a.name,
      'No primitive recorded, so function and strength cannot be assessed.');
    else if (!characterised(a)) add('medium','Algorithm strength unrecorded','Algorithm Risk',a.name,
      'Primitive is known but no parameter set, key size or curve is recorded.');
    if (!quantumKnown(a)) add('medium','Quantum posture not assessed','PQC Readiness',a.name,
      'No NIST quantum security level recorded, so this cannot be placed in the migration plan.');
    else if ((ap(a).nistQuantumSecurityLevel||0) === 0) add('medium','Quantum-vulnerable primitive','PQC Readiness',a.name,
      'Assessed at NIST level 0 — schedule a post-quantum successor.');
  });
  protos.forEach(p => { const v = pp(p).version;
    if (!v) add('medium','Protocol version unrecorded','Protocol Hygiene',p.name,'Negotiated strength cannot be verified.');
    else if (parseFloat(v) < 1.2) add('critical','Obsolete protocol enabled','Protocol Hygiene',p.name,
      'Below the current minimum for transport security. Disable the listener.'); });
  certs.forEach(c => { const e = cp(c).notValidAfter;
    if (!e) return add('medium','Certificate has no expiry recorded','Certificate Expiry',c.name,
      'Renewal cannot be scheduled without a validity window.');
    const d = daysTo(e);
    if (d < 0) add('critical','Certificate expired','Certificate Expiry',c.name,'Expired ' + Math.abs(d) + ' days ago.');
    else if (d <= 45) add('high','Certificate expiring','Certificate Expiry',c.name,
      'Expires in ' + d + ' days, on ' + e.slice(0,10) + '.'); });
  keys.forEach(k => { if (!kp(k).state || !kp(k).size) add('medium','Incomplete key record','Key Management',k.name,
    'Missing size or lifecycle state, so rotation cannot be evidenced.'); });
  /* --- figure data --- */
  const algoRows = algos.map(a => {
    const p = ap(a);
    const lvl = quantumKnown(a) ? p.nistQuantumSecurityLevel : null;
    return { id:a.id, name:a.name, primitive:p.primitive || 'unspecified',
      family:p.algorithmFamily || '', curve:p.ellipticCurve || '', bits:p.classicalSecurityLevel ?? null,
      params:p.parameterSetIdentifier || '', functions:p.cryptoFunctions || [], lvl,
      band: WEAK_ALGO.test(a.name) ? 'retired' : lvl === null ? 'unassessed' : lvl >= 1 ? 'pqc' : 'classical',
      occurrences:(a.evidence || []).length, evidence:a.evidence || [] };
  });

  /* code hotspots from evidence occurrences, aggregated by directory */
  const files = {};
  crypto.concat(all.filter(c => c.type !== 'crypto')).forEach(c => (c.evidence || []).forEach(o => {
    const loc = o.location || 'unknown';
    const dir = loc.includes('/') ? loc.slice(0, loc.lastIndexOf('/')) : '(root)';
    const file = loc.slice(loc.lastIndexOf('/')+1);
    const k = dir + '|' + file;
    (files[k] = files[k] || { dir, file, n:0, assets:new Set() }).n++;
    files[k].assets.add(c.name);
  }));
  const hotspots = Object.values(files).map(f => ({ ...f, assets:[...f.assets] })).sort((a,b) => b.n - a.n);

  /* blast radius, only if the generator recorded references */
  const dependents = {}; algos.forEach(a => dependents[a.id] = []);
  const link = (ref, dep) => { if (ref && dependents[ref]) dependents[ref].push(dep); };
  keys.forEach(k => link(kp(k).algorithmRef, { name:k.name, kind:'key' }));
  certs.forEach(c => link(cp(c).signatureAlgorithmRef, { name:c.name, kind:'certificate' }));
  protos.forEach(p => (pp(p).cipherSuites||[]).forEach(cs => (cs.algorithms||[]).forEach(ref => link(ref, { name:p.name, kind:'protocol' }))));
  const flat = Object.values(dependents).flat();
  const blast = { consumers:[...new Map(flat.map(d => [d.name, d])).values()],
    algos: algoRows.map(a => ({ ...a, deps:dependents[a.id].map(d => d.name) })) };

  const certRows = certs.map(c => ({ name:c.name, expiry:cp(c).notValidAfter || null,
    days:cp(c).notValidAfter ? daysTo(cp(c).notValidAfter) : null, issuer:cp(c).issuerName || '' }))
    .sort((a,b) => (a.days === null ? 1e9 : a.days) - (b.days === null ? 1e9 : b.days));

  /* --- assurance evidence: fields the generator records but nothing read ---
     certificationLevel (FIPS/CC validation), oid (unambiguous identity) and
     ellipticCurve/parameterSet are exactly what an assessor asks for, and are
     the difference between "we found AES" and "we can prove which AES". */
  const CERT_NONE = /^(none|unevaluated|unknown|n\/?a)$/i;
  const certLevels = a => (ap(a).certificationLevel || []).map(String);
  const isCertified = a => certLevels(a).some(l => !CERT_NONE.test(l));
  const assurance = algoRows.map(r0 => {
    const a = algos.find(x => x.id === r0.id) || {};
    const p = ap(a);
    const checks = [
      { k:'primitive',    ok:!!p.primitive },
      { k:'family',       ok:!!p.algorithmFamily },
      { k:'strength',     ok: !!(p.parameterSetIdentifier || p.classicalSecurityLevel || p.ellipticCurve) },
      { k:'quantum level',ok: p.nistQuantumSecurityLevel !== undefined && p.nistQuantumSecurityLevel !== null },
      { k:'OID',          ok: !!(a.crypto||{}).oid },
      { k:'certification',ok: isCertified(a) }
    ];
    return { name:r0.name, id:r0.id, band:r0.band, checks,
      score: checks.filter(c => c.ok).length, of: checks.length,
      missing: checks.filter(c => !c.ok).map(c => c.k),
      oid:(a.crypto||{}).oid || '', certs:certLevels(a),
      lib: (a.props || {})['cbom:library'] || '',
      lang:(a.props || {})['cbom:language'] || '' };
  });
  const certifiedN = assurance.filter(a => a.checks[5].ok).length;

  /* Assurance findings. Deliberately low severity: an absent certificationLevel
     usually means the generator did not look it up, not that the algorithm
     failed validation — so this is phrased as unevidenced, never as failed. */
  assurance.forEach(a => {
    if (!a.checks[5].ok) add('low','Validation status not evidenced','Algorithm Risk',a.name,
      'No certificationLevel recorded. For a FIPS-regulated deployment this has to be proven per algorithm, not assumed.');
    if (!a.checks[4].ok) add('low','No OID recorded','Algorithm Risk',a.name,
      'Without an object identifier this algorithm is matched by display name alone, which is ambiguous across tools.');
  });

  /* --- what cryptography is actually performed, and by what ---
     cryptoFunctions is a closed vocabulary, so this holds shape at any size. */
  const FN_ORDER = ['keygen','encrypt','decrypt','sign','verify','digest','mac','encapsulate','decapsulate','derive','tag','other'];
  const fnUsed = FN_ORDER.filter(f => algoRows.some(a => a.functions.includes(f)))
    .concat([...new Set(algoRows.flatMap(a => a.functions))].filter(f => !FN_ORDER.includes(f)));
  const fnCoverage = fnUsed.map(f => {
    const carriers = algoRows.filter(a => a.functions.includes(f));
    return { fn:f, n:carriers.length, names:carriers.map(a => a.name),
      sites: carriers.reduce((s,a) => s + a.occurrences, 0),
      /* a function is only as safe as the weakest algorithm performing it */
      worst: carriers.some(a => a.band === 'retired') ? 'retired'
        : carriers.some(a => a.band === 'unassessed') ? 'unassessed'
        : carriers.some(a => a.band === 'classical') ? 'classical' : 'pqc' };
  });

  /* --- provenance: which library supplies each algorithm ---
     Only meaningful when the generator populated cbom:library; when it did not,
     the panel says so rather than inventing an "unknown" bucket that looks like data. */
  const provGroups = {};
  assurance.forEach(a => {
    const key = a.lib || '(not attributed)';
    (provGroups[key] = provGroups[key] || { name:key, attributed:!!a.lib, algos:[], sites:0 });
    provGroups[key].algos.push(a.name);
    provGroups[key].sites += (algoRows.find(r0 => r0.id === a.id) || {}).occurrences || 0;
  });
  const provenanceGroups = Object.values(provGroups).sort((x,y) => y.algos.length - x.algos.length);
  const anyAttributed = assurance.some(a => a.lib);

  /* --- call-site map: the line numbers nothing has read yet ---------
     evidence.occurrences carries a file AND a line for every sighting.
     Everything so far has counted those and thrown the position away,
     but position is what tells an engineer whether crypto is bundled
     into one region they can wrap, or smeared across a file they will
     have to read end to end. */
  const bandByName = {};
  algoRows.forEach(a => bandByName[a.name] = a.band);
  const siteIndex = {};
  all.forEach(c => (c.evidence || []).forEach(o => {
    const loc = o.location || 'unknown';
    const f = siteIndex[loc] = siteIndex[loc] ||
      { path:loc, file:loc.slice(loc.lastIndexOf('/')+1),
        dir: loc.includes('/') ? loc.slice(0, loc.lastIndexOf('/')) : '(root)', marks:[] };
    f.marks.push({ line: Number(o.line) || 0, name:c.name,
      band: bandByName[c.name] || (c.type === 'crypto' ? 'unassessed' : 'library') });
  }));
  const siteMap = Object.values(siteIndex).map(f => {
    const lines = f.marks.map(m => m.line).filter(n => n > 0);
    const assets = [...new Set(f.marks.map(m => m.name))];
    const span = lines.length ? Math.max(...lines) - Math.min(...lines) : 0;
    return { ...f, n:f.marks.length, assets,
      minLine: lines.length ? Math.min(...lines) : 0,
      maxLine: lines.length ? Math.max(...lines) : 0, span,
      /* clustered = every sighting inside a short window, so one edit reaches them all */
      clustered: lines.length > 1 && span <= 40,
      worst: assets.map(a => bandByName[a]).filter(Boolean)
        .sort((x,y) => ['retired','unassessed','classical','pqc'].indexOf(x) -
                       ['retired','unassessed','classical','pqc'].indexOf(y))[0] || 'library' };
  }).sort((a,b) => b.n - a.n || a.path.localeCompare(b.path));
  const anyLines = siteMap.some(f => f.maxLine > 0);

  return { key:'cbom', title:'CBOM', kind:'cryptography',
    count: algos.length + ' algorithms · ' + (keys.length+protos.length+certs.length) + ' other assets',
    dims, findings:F, algos, keys, protos, algoRows, hotspots, blast, certs:certRows,
    assurance, certifiedN, fnCoverage, provenanceGroups, anyAttributed,
    siteMap, anyLines,
    scan: Object.assign({}, ...docs.map(d => d.props)) };
}

/* ============================================================
   4 · ANALYSIS
   Everything that feeds a figure is aggregated here, so the
   figures stay readable whether the BOM holds 15 components or
   1,500. Aggregation rules are stated on each figure's footer.
   ============================================================ */
const clipId = v => String(v).length > 42 ? String(v).slice(0,41) + '…' : String(v);

function analyse(slots){
  const docs = ['sbom','aibom','cbom'].map(k => slots[k]).filter(Boolean);
  const sections = [];
  if (slots.sbom)  sections.push(evalSBOM([slots.sbom]));
  if (slots.aibom) sections.push(evalAIBOM([slots.aibom]));
  if (slots.cbom)  sections.push(evalCBOM([slots.cbom]));

  sections.forEach(s => {
    const live = s.dims.filter(d => !d.na);
    s.coverage = live.length ? Math.round(live.reduce((a,d) => a+d.coverage, 0) / live.length) : null;
    s.naCount = s.dims.length - live.length;
  });
  const scored = sections.filter(s => s.coverage !== null);
  const composite = scored.length ? Math.round(scored.reduce((a,s) => a+s.coverage,0) / scored.length) : 0;

  const findings = sections.flatMap(s => s.findings);
  const blockers = findings.filter(f => f.sev === 'critical' || f.sev === 'high').length;
  const gate = blockers ? 'blocked' : composite >= 85 ? 'clear' : 'conditional';
  const S = k => sections.find(s => s.key === k);
  const sb = S('sbom'), ai = S('aibom'), cb = S('cbom');

  /* --- findings grouped into rules, which is what scales --- */
  const ruleMap = new Map();
  findings.forEach(f => {
    const key = f.src + '|' + f.rule;
    if (!ruleMap.has(key)) ruleMap.set(key, { key, src:f.src, rule:f.rule, dim:f.dim, sev:f.sev, items:[] });
    const g = ruleMap.get(key);
    g.items.push(f);
    if (SEV.indexOf(f.sev) < SEV.indexOf(g.sev)) g.sev = f.sev;
  });
  const rules = [...ruleMap.values()]
    .sort((a,b) => SEV.indexOf(a.sev) - SEV.indexOf(b.sev) || b.items.length - a.items.length);

  const all = docs.flatMap(d => d.components);
  /* Licence questions only belong to documents that actually assert licences.
     A CBOM names its supporting libraries (libsodium, etc.) so it can attribute
     an algorithm to them — it is not claiming to license them, and its generator
     emits no licence fields at all. Counting those as "cannot be cleared" turned
     a CBOM-only view red for a question the document never answered. */
  const LIC_SLOTS = new Set(['sbom','aibom']);
  const licensable = docs.filter(d => LIC_SLOTS.has(d.slot))
    .flatMap(d => d.components).filter(c => c.type !== 'crypto');
  const licMix = Object.fromEntries(LIC_CLASSES.map(k => [k,0]));
  licensable.forEach(c => licMix[worstClass(c.licenses)]++);

  /* ---------- SBOM figure data ---------- */
  let sbom = null;
  if (sb){
    const comps = sb.comps;
    /* Pareto over the full licence distribution — no truncation, the whole tail is the point */
    const counts = new Map();
    comps.forEach(c => {
      const key = c.licenses.length ? c.licenses.slice().sort().join(' AND ') : 'undeclared';
      const e = counts.get(key) || { name:key, n:0, cls:worstClass(c.licenses), members:[] };
      e.n++; e.members.push(c.name); counts.set(key, e);
    });
    const ranked = [...counts.values()].sort((a,b) => b.n - a.n);
    let run = 0;
    ranked.forEach(r => { run += r.n; r.cum = pct(run, comps.length); });

    /* Sankey aggregation: keep the top slices, roll the tail into one node each side */
    const TOP_ECO = 6, TOP_LIC = 7;
    const ecoCount = {}; comps.forEach(c => ecoCount[c.eco] = (ecoCount[c.eco]||0)+1);
    const topEco = Object.entries(ecoCount).sort((a,b) => b[1]-a[1]).slice(0,TOP_ECO).map(e => e[0]);
    const topLic = ranked.slice(0,TOP_LIC).map(r => r.name);
    const otherEco = Object.keys(ecoCount).filter(e => !topEco.includes(e));
    const otherLic = ranked.slice(TOP_LIC);
    const flow = comps.map(c => {
      const licKey = c.licenses.length ? c.licenses.slice().sort().join(' AND ') : 'undeclared';
      return { name:c.name,
        a: topEco.includes(c.eco) ? c.eco : 'other (' + otherEco.length + ')',
        b: topLic.includes(licKey) ? licKey : 'other (' + otherLic.length + ' licences)',
        c: OBLIGATION[worstClass(c.licenses)] };
    });

    /* Gap combinations — which attributes go missing together */
    const ATTRS = [
      { k:'purl', label:'coordinates', miss:c => !c.purl },
      { k:'version', label:'version', miss:c => !c.version },
      { k:'licence', label:'licence', miss:c => worstClass(c.licenses) === 'undeclared' },
      { k:'supplier', label:'supplier', miss:c => !c.supplier },
      { k:'graph', label:'graph link', miss:c => sb.hasGraph && !sb.linked.has(c.id) }
    ].filter(a => a.k !== 'graph' || sb.hasGraph);
    const combos = new Map();
    comps.forEach(c => {
      const set = ATTRS.filter(a => a.miss(c)).map(a => a.k);
      const key = set.join('+') || '__none__';
      const e = combos.get(key) || { key, set, n:0, members:[] };
      e.n++; e.members.push(c.name); combos.set(key, e);
    });
    const gapCombos = [...combos.values()].sort((a,b) => (a.key === '__none__' ? -1 : b.key === '__none__' ? 1 : 0) || b.n - a.n);

    /* ageing: how long a finding has been open is a different question from how bad it is */
    const age = v => v.published ? Math.max(0, Math.round((NOW - new Date(v.published))/864e5)) : null;
    const open = v => !v.state || v.state === 'in_triage' || (v.state === 'not_affected' && !v.justification);
    const vrows = sb.vulns.map(v => ({ id:v.id, sev:SEV.includes(v.severity) ? v.severity : 'low',
      score:v.score, epss:v.epss, kev:v.kev, state:v.state || 'untriaged', target:v.targetName, matched:v.hit,
      justification:v.justification, age:age(v), published:v.published || null, open:open(v) }));
    const dated = vrows.filter(v => v.age !== null);
    const openRows = vrows.filter(v => v.open);
    const openDated = dated.filter(v => v.open).sort((a,b) => b.age - a.age);
    /* remediation happens per component, not per rule — who actually carries the findings */
    const byComp = new Map();
    sb.findings.filter(f => f.ref).forEach(f => {
      const e = byComp.get(f.ref) || { name:f.ref, n:0, sev:'low', rules:new Set(), blockers:0 };
      e.n++; e.rules.add(f.rule);
      if (f.sev === 'critical' || f.sev === 'high') e.blockers++;
      if (SEV.indexOf(f.sev) < SEV.indexOf(e.sev)) e.sev = f.sev;
      byComp.set(f.ref, e);
    });
    const attributed = sb.findings.filter(f => f.ref).length;
    const offenders = [...byComp.values()].map(e => {
      const c = comps.find(x => x.name === e.name);
      return { ...e, rules:[...e.rules], lic: c ? worstClass(c.licenses) : 'undeclared' };
    }).sort((a,b) => b.blockers - a.blockers || b.n - a.n);
    let runF = 0; offenders.forEach(o => { runF += o.n; o.cum = pct(runF, attributed || 1); });

    /* ---- evidence completeness per component (mosaic + inventory) ----
       Five fields, each one an assessor asks for and each one a real
       CycloneDX/SPDX field, so a low score is a document defect rather
       than a scoring artefact. */
    const EV_FIELDS = [
      { k:'purl',     label:'package URL', has:c => !!c.purl },
      { k:'version',  label:'version',     has:c => !!c.version },
      { k:'licence',  label:'usable licence', has:c => worstClass(c.licenses) !== 'undeclared' },
      { k:'supplier', label:'supplier',    has:c => !!c.supplier },
      { k:'hash',     label:'hash / checksum', has:c => !!c.hash }
    ];
    const cvesFor = name => sb.vulns.filter(v => v.targetName === name);
    const tiles = comps.map(c => {
      const missing = EV_FIELDS.filter(f => !f.has(c)).map(f => f.label);
      const hits = cvesFor(c.name);
      const cls = worstClass(c.licenses);
      const worstSev = hits.length
        ? SEV.find(s => hits.some(v => v.severity === s)) || 'low' : null;
      return { name:c.name, version:c.version, purl:c.purl, eco:c.eco, supplier:c.supplier,
        licenses:c.licenses.length ? c.licenses : [], cls,
        ackState:(c.ack || {}).state || 'none',
        score:EV_FIELDS.length - missing.length, missing,
        cves:hits.length, worstSev,
        blocked: cls === 'undeclared',
        obligated: ['strong','weak','restricted','review'].includes(cls) };
    });
    /* inventory order: what someone needs to look at first, not alphabetical */
    const invRows = tiles.slice().sort((a,b) =>
      (b.cves - a.cves) || (Number(b.blocked) - Number(a.blocked)) ||
      (Number(b.obligated) - Number(a.obligated)) || (a.score - b.score) ||
      a.name.localeCompare(b.name));

    /* ---- origin groups for the treemap ---- */
    const ecoGroups = {};
    comps.forEach(c => {
      const g = ecoGroups[c.eco] = ecoGroups[c.eco] ||
        { name:c.eco, n:0, members:[], mix:Object.fromEntries(LIC_CLASSES.map(k => [k,0])) };
      g.n++; g.members.push(c.name); g.mix[worstClass(c.licenses)]++;
    });
    const originGroups = Object.values(ecoGroups).sort((a,b) => b.n - a.n);

    /* ---- declared vs concluded agreement ---- */
    const ackMix = Object.fromEntries(
      ['agreed','divergent','declared-only','concluded-only','unqualified','none'].map(k => [k,0]));
    comps.forEach(c => { const st = (c.ack || {}).state || 'none';
      ackMix[st] = (ackMix[st] || 0) + 1; });
    const divergent = comps.filter(c => (c.ack || {}).state === 'divergent')
      .map(c => ({ name:c.name, declared:c.ack.declared, concluded:c.ack.concluded }));

    sbom = { tiles, invRows, evFields:EV_FIELDS, originGroups, ackMix, divergent,
      bomTs: (docs.find(d => d.slot === 'sbom') || {}).prov ? (docs.find(d => d.slot === 'sbom').prov.timestamp || null) : null,
      flow, ranked, gapCombos, attrs:ATTRS, hasGraph:sb.hasGraph, total:comps.length,
      mandated:sb.mandated, conflicts:sb.conflicts, agpl:sb.agpl, enriched:sb.enriched,
      offenders, attributed,
      aggregated: otherEco.length + otherLic.length > 0,
      topEco, topLicCount:Math.min(TOP_LIC, ranked.length),
      scan: sb.scan,
      cve: sb.vulns.length ? { total:sb.vulns.length, triaged:sb.scan.triaged, rows:vrows,
        dated:dated.length, open:openRows.length,
        oldestOpen: openDated[0] || null,
        breaching: openDated.filter(v => v.age > 90).length,
        medianOpenAge: openDated.length ? openDated[Math.floor(openDated.length/2)].age : null } : null };
  }

  /* ---------- AIBOM figure data ---------- */
  const aibom = ai ? (() => {
    /* where the weights came from, and whether the data behind them is safe to train on */
    const origin = { attested:[], sourced:[], opaque:[] };
    ai.models.forEach(m => {
      const att = m.refs.some(r => /attestation|build-?meta|signature|certification/i.test(r.type || ''));
      const src = m.refs.some(r => /distribution|vcs|website|source/i.test(r.type || ''));
      (att ? origin.attested : src ? origin.sourced : origin.opaque).push(m.name);
    });
    const sens = { personal:[], governed:[], unknown:[] };
    ai.data.forEach(d => {
      const ds = d.dataset || {};
      const personal = ds.dataset_sensitivePersonalInformation === 'yes' || ds.classification === 'confidential';
      const governed = !!(ds.governance || ds.dataset_intendedUse || d.licenses.length);
      (personal ? sens.personal : governed ? sens.governed : sens.unknown).push(d.name);
    });
    return { quadrant:ai.quadrant, compat:ai.compat, models:ai.models.length,
      data:ai.data.length, libs:ai.libs.length, origin, sens,
      cardAnatomy:ai.cardAnatomy, sensitivityFlags:ai.sensitivityFlags,
      unreconciled:ai.unreconciled, governance:ai.governance,
      allParties:ai.allParties, singleParty:ai.singleParty,
      implied:ai.implied, crosswalk:ai.crosswalk,
      cwEvidenced:ai.cwEvidenced, cwScored:ai.cwScored,
      modelNames:ai.models.map(m => m.name), dataNames:ai.data.map(d => ({ id:d.id, name:d.name })) };
  })() : null;

  /* ---------- CBOM figure data ---------- */
  let cbom = null;
  if (cb){
    /* function map: primitive × quantum posture, the two axes a CBOM always has */
    const prims = [...new Set(cb.algoRows.map(a => a.primitive))];
    const bands = ['retired','unassessed','classical','pqc'];
    const fnMap = prims.map(p => ({ primitive:p,
      cells: bands.map(b => ({ band:b, items:cb.algoRows.filter(a => a.primitive === p && a.band === b).map(a => a.name) })),
      total: cb.algoRows.filter(a => a.primitive === p).length }))
      .sort((a,b) => b.total - a.total);
    /* hotspots rolled up to directory, top 12 files kept */
    const dirs = {};
    cb.hotspots.forEach(h => { const e = dirs[h.dir] = dirs[h.dir] || { dir:h.dir, n:0, files:0 }; e.n += h.n; e.files++; });
    /* how big is the job — bad algorithms matter less than how far they reach */
    const fileOf = {};
    cb.hotspots.forEach(h => h.assets.forEach(a => { (fileOf[a] = fileOf[a] || new Set()).add(h.dir + '/' + h.file); }));
    const effort = bands.map(bd => {
      const listB = cb.algoRows.filter(a => a.band === bd);
      const files = new Set(); listB.forEach(a => (fileOf[a.name] || new Set()).forEach(f => files.add(f)));
      return { band:bd, algos:listB.length, sites:listB.reduce((t,a) => t + (a.occurrences||0), 0),
        files:files.size, names:listB.map(a => a.name) };
    });
    cbom = { algoRows:cb.algoRows, fnMap, bands, effort,
      hotspots:cb.hotspots, dirs:Object.values(dirs).sort((a,b) => b.n - a.n),
      blast:cb.blast, certs:cb.certs, scan:cb.scan,
      assurance:cb.assurance, certifiedN:cb.certifiedN, fnCoverage:cb.fnCoverage,
      provenanceGroups:cb.provenanceGroups, anyAttributed:cb.anyAttributed,
      siteMap:cb.siteMap, anyLines:cb.anyLines,
      occurrences:cb.hotspots.reduce((a,h) => a+h.n, 0) };
  }

  /* ---------- supplier concentration ---------- */
  let suppliers = null;
  if (sb && sb.comps.length){
    const bySup = new Map();
    sb.comps.forEach(c => {
      const key = c.supplier || 'unattributed';
      const e = bySup.get(key) || { name:key, n:0, mix:Object.fromEntries(LIC_CLASSES.map(k=>[k,0])), members:[] };
      e.n++; e.mix[worstClass(c.licenses)]++; e.members.push(c.name); bySup.set(key, e);
    });
    const rankedSup = [...bySup.values()].sort((a,b) => b.n - a.n);
    /* "unattributed" is missing data, not an upstream — Supplier Provenance already owns that */
    const named = rankedSup.filter(x => x.name !== 'unattributed');
    const top = rankedSup.slice(0,8), tail = rankedSup.slice(8);
    suppliers = { rows:top, tail, total:sb.comps.length, distinct:named.length,
      namedTotal: named.reduce((a,x)=>a+x.n,0),
      top3: named.length ? pct(named.slice(0,3).reduce((a,x)=>a+x.n,0), sb.comps.length) : 0,
      largest: named[0] || null };
  }

  /* ---------- document provenance ---------- */
  const provenance = docs.map(d => {
    const pv = d.prov || {};
    const ageDays = pv.timestamp ? Math.round((NOW - new Date(pv.timestamp))/864e5) : null;
    const checks = [
      { k:'Well-formed JSON', ok:true, warn:d.lenient,
        note: d.lenient
          ? 'source was not valid JSON — bare unquoted values were quoted to read it; the uploaded file itself was not modified'
          : 'valid as received' },
      { k:'Format and version', ok:!!pv.spec, note:pv.spec || 'not stated' },
      { k:'Generating tool', ok:!!pv.tool, note:pv.tool || 'no tool recorded — the BOM cannot be reproduced' },
      { k:'Author or supplier', ok:!!pv.author, note:pv.author || 'no author recorded' },
      { k:'Timestamp', ok:!!pv.timestamp, warn: ageDays !== null && ageDays > 90,
        note: pv.timestamp ? pv.timestamp.slice(0,10) + ' · ' + ageDays + ' days old' : 'no timestamp' },
      { k:'Document identifier', ok:!!pv.serial, note:pv.serial ? clipId(pv.serial) : 'no serial number or namespace' },
      { k:'Subject version', ok:!!pv.rootVersion, note:pv.rootVersion || 'the thing being described has no version' },
      { k:'Signature', ok:pv.signature, note:pv.signature ? 'present' : 'unsigned — provenance is asserted, not proven' }
    ];
    return { slot:d.slot, name:d.name, label:d.label, checks,
      score: pct(checks.filter(c => c.ok).length, checks.length) };
  });

  /* ---------- remediation plan, ranked by leverage ---------- */
  const actMap = new Map();
  findings.forEach(f => {
    const a = ACTION_FOR(f.rule);
    const key = a.act;
    if (!actMap.has(key)) actMap.set(key, { act:a.act, own:a.own, eff:a.eff, n:0, blockers:0,
      rules:new Set(), refs:new Set(), src:new Set(), sev:'low' });
    const g = actMap.get(key);
    g.n++; g.rules.add(f.rule); g.src.add(f.src);
    if (f.ref) g.refs.add(f.ref);
    if (f.sev === 'critical' || f.sev === 'high') g.blockers++;
    if (SEV.indexOf(f.sev) < SEV.indexOf(g.sev)) g.sev = f.sev;
  });
  const plan = [...actMap.values()].map(g => ({ ...g,
    rules:[...g.rules], refs:[...g.refs], src:[...g.src] }))
    .sort((a,b) => b.blockers - a.blockers || b.n - a.n);
  /* second-order effect: fixing coordinates and versions makes components matchable */
  if (sb && sb.scan.unmatchable){
    plan.forEach(g => {
      if (/versions from the build|package URLs from the build/.test(g.act))
        g.unlock = '+' + sb.scan.unmatchable + ' component(s) become matchable to advisory feeds';
    });
  }
  let cum = 0, cumB = 0;
  plan.forEach(g => { cum += g.n; cumB += g.blockers; g.cum = pct(cum, findings.length || 1); g.cumB = pct(cumB, blockers || 1); });
  const top3 = plan.slice(0,3);
  const leverage = { findings: pct(top3.reduce((a,g)=>a+g.n,0), findings.length || 1),
    blockers: pct(top3.reduce((a,g)=>a+g.blockers,0), blockers || 1), actions: plan.length };

  /* --- projection: what the scorecard reads after the top actions are done ---
     Each action clears a known set of findings. A finding names its dimension and the
     item it belongs to, so completing an action raises that dimension by the number of
     distinct items it fixes, capped at the dimension's own total. */
  const actNames = new Set(top3.map(g => g.act));
  const clearedBy = findings.filter(f => actNames.has(ACTION_FOR(f.rule).act));
  const projection = { moved:[], before:composite, after:composite, gateBefore:gate, gateAfter:gate,
    actions:top3.map(g => g.act) };
  const projSections = sections.map(sec => {
    const dims = sec.dims.map(d => {
      if (d.na) return d;
      const fixed = new Set(clearedBy.filter(f => f.src === sec.title && f.dim === d.label && f.ref).map(f => f.ref)).size;
      const done = Math.min(d.total, d.done + fixed);
      const cov = pct(done, d.total);
      if (cov !== d.coverage) projection.moved.push({ bom:sec.title, label:d.label, from:d.coverage, to:cov });
      return { ...d, done, coverage:cov, status:rate(cov) };
    });
    const live = dims.filter(d => !d.na);
    return { title:sec.title, coverage: live.length ? Math.round(live.reduce((a,d)=>a+d.coverage,0)/live.length) : null, dims };
  });
  const projScored = projSections.filter(x => x.coverage !== null);
  projection.after = projScored.length ? Math.round(projScored.reduce((a,x)=>a+x.coverage,0)/projScored.length) : composite;
  projection.blockersAfter = blockers - clearedBy.filter(f => f.sev === 'critical' || f.sev === 'high').length;
  projection.gateAfter = projection.blockersAfter > 0 ? 'blocked' : projection.after >= 85 ? 'clear' : 'conditional';
  projection.sections = projSections.map(x => ({ title:x.title, coverage:x.coverage }));
  projection.moved.sort((a,b) => (b.to-b.from) - (a.to-a.from));
  projection.byBom = {};
  sections.forEach(sec => {
    const after = (projSections.find(x => x.title === sec.title) || {}).coverage;
    projection.byBom[sec.title] = { before:sec.coverage, after,
      moved: projection.moved.filter(m => m.bom === sec.title),
      dims: sec.dims.filter(d => !d.na).map(d => {
        const hit = projection.moved.find(m => m.bom === sec.title && m.label === d.label);
        return { label:d.label, from:d.coverage, to: hit ? hit.to : d.coverage };
      }) };
  });

  /* ---------- KPIs ---------- */
  const kpis = [];
  const licCov = pct(licensable.length - licMix.undeclared, licensable.length);
  kpis.push({ k:'Remediation actions', v:plan.length,
    d: plan.length ? 'top 3 clear ' + leverage.blockers + '% of blockers' : 'nothing outstanding',
    tone: plan.length ? 'brand' : 'ok',
    tip:'Distinct fixes behind every finding. The plan below ranks them by how much each one clears.' });
  if (licensable.length) kpis.push({ k:'Licence coverage', v:licCov + '%', d:'target 95%', bar:licCov, target:95,
    tone:rate(licCov)==='pass'?'ok':rate(licCov)==='warn'?'warn':'bad',
    tip:'Share of licensable assets whose terms resolve to something usable. Placeholders such as <b>LicenseRef-unknown</b> do not count.' });
  if (licensable.length) kpis.push({ k:'Cannot be cleared', v:licMix.undeclared, d:'no usable licence',
    tone:licMix.undeclared?'bad':'ok', tip:'No licence, NOASSERTION, or a placeholder reference. These block release outright.' });
  const obligations = licMix.strong + licMix.weak + licMix.restricted + licMix.review;
  if (licensable.length) kpis.push({ k:'Obligations attached', v:obligations,
    d:licMix.strong + ' strong · ' + licMix.weak + ' weak · ' + licMix.restricted + ' restricted · ' + licMix.review + ' review',
    tone:obligations?'warn':'ok', tip:'Assets whose terms require something of you on release.' });
  kpis.push({ k:'Blocking findings', v:blockers, d:findings.length + ' findings in ' + rules.length + ' rules',
    tone:blockers?'bad':'ok', tip:'Critical and high findings. Any one of these holds the gate shut.' });
  if (sb && sb.enriched.kev) kpis.push({ k:'Known exploited', v:sb.enriched.kev, d:'observed in the wild', tone:'bad',
    tip:'Vulnerabilities on a known-exploited list carried in the BOM. Exploitation is observed, not modelled — these outrank CVSS.' });
  if (sb && sb.conflicts.length) kpis.push({ k:'Licence conflicts', v:sb.conflicts.length,
    d:'incompatible pairs in one build', tone:'bad',
    tip:'Licence combinations that cannot lawfully coexist in a single distributed work.' });
  if (sb && sb.vulns.length) kpis.push({ k:'Open vulnerabilities', v:sbom.cve.open,
    d: sbom.cve.oldestOpen ? 'oldest open ' + Math.round(sbom.cve.oldestOpen.age/30) + ' months'
      : 'of ' + sb.vulns.length + ' recorded',
    tone:sbom.cve.open?'bad':'ok',
    tip:'Records with no analysis state, still in triage, or marked not affected without the justification CycloneDX requires.' });
  if (sb && sb.scan.unmatchable) kpis.push({ k:'Not scannable', v:sb.scan.unmatchable,
    d:'of ' + sb.scan.total + ' components', tone:'bad',
    tip:'Components with no package URL or no real version. No advisory feed can match them, so any vulnerability count excludes them.' });
  if (ai) kpis.push({ k:'Models in build', v:ai.models.length,
    d:(ai.models.filter(m => !m.licenses.length).length || 'no') + ' without a licence',
    tone:ai.models.filter(m => !m.licenses.length).length?'bad':'ok', tip:'Machine-learning models shipping inside the product.' });
  if (ai && ai.cardAnatomy.length){
    /* documentation depth, not just card presence — a card that exists but says
       nothing passes a presence check and fails a governance review */
    const have = ai.cardAnatomy.reduce((n,c) => n + c.have, 0);
    const of = ai.cardAnatomy.reduce((n,c) => n + c.of, 0);
    const blank = ai.cardAnatomy.filter(c => c.groups.find(g => g.key === 'considerations').have === 0).length;
    kpis.push({ k:'Model card depth', v:pct(have, of) + '%',
      d: blank ? blank + ' with no considerations block' : 'all blocks populated',
      tone: pct(have,of) >= 70 ? 'ok' : pct(have,of) >= 35 ? 'warn' : 'bad',
      tip:'Share of the CycloneDX modelCard fields actually populated, across model parameters, quantitative analysis and considerations. Card presence alone does not mean the card says anything.' });
  }
  if (ai && ai.unreconciled.length) kpis.push({ k:'Sensitivity unreconciled', v:ai.unreconciled.length,
    d:'of ' + ai.data.length + ' dataset(s)', tone:'bad',
    tip:'Datasets whose description refers to sensitive content while declaring no classification or sensitiveData field. A question to resolve, not a confirmed finding.' });
  if (ai && ai.implied && ai.implied.total) kpis.push({ k:'Undeclared inheritance', v:ai.implied.total,
    d:ai.implied.prose.length + ' upstream · ' + ai.implied.tags.length + ' stack', tone:'warn',
    tip:'Artefacts the document names in prose or tags but never declares as components. Candidates for a human to confirm, not asserted dependencies.' });
  if (ai && ai.cwScored) kpis.push({ k:'Reviewer questions answerable', v:ai.cwEvidenced + ' of ' + ai.cwScored,
    d:'fully evidenced by this document',
    tone: ai.cwEvidenced === 0 ? 'bad' : ai.cwEvidenced < ai.cwScored/2 ? 'warn' : 'ok',
    tip:'Questions common AI-governance frameworks ask that this document carries the fields to answer. Evidence availability, not a compliance verdict.' });
  if (cb){
    const assessed = cb.algoRows.filter(a => a.lvl !== null).length;
    kpis.push({ k:'Quantum posture assessed', v:pct(assessed, cb.algoRows.length) + '%',
      d:assessed + ' of ' + cb.algoRows.length + ' algorithms', bar:pct(assessed, cb.algoRows.length), target:100,
      tone:rate(pct(assessed, cb.algoRows.length))==='pass'?'ok':rate(pct(assessed, cb.algoRows.length))==='warn'?'warn':'bad',
      tip:'Algorithms carrying a NIST quantum security level. Anything unassessed cannot be planned for.' });
    if (cbom.occurrences) kpis.push({ k:'Crypto call sites', v:cbom.occurrences,
      d:cbom.hotspots.length + ' files · ' + cbom.dirs.length + ' directories', tone:'brand',
      tip:'Source locations where the generator observed a cryptographic asset in use.' });
    /* reach of the algorithms that will have to move, which is the number that
       actually sizes a PQC migration — not the count of bad algorithms */
    const exposed = cb.algoRows.filter(a => a.band === 'classical' || a.band === 'retired');
    const exposedSites = exposed.reduce((s,a) => s + a.occurrences, 0);
    if (cb.algoRows.length) kpis.push({ k:'Quantum-vulnerable reach', v:exposedSites,
      d: exposed.length + ' algorithm' + (exposed.length===1?'':'s') + ' · ' +
         [...new Set(exposed.flatMap(a => (a.evidence||[]).map(o => o.location)))].length + ' files',
      tone: exposedSites ? 'bad' : 'ok',
      tip:'Call sites performing cryptography that a cryptographically-relevant quantum computer would break. This sizes the migration; the algorithm count alone does not.' });
    if (cb.algoRows.length) kpis.push({ k:'Validation evidenced', v:cb.certifiedN + ' of ' + cb.algoRows.length,
      d: cb.certifiedN ? 'carry a certification level' : 'none carry a certification level',
      tone: cb.certifiedN === cb.algoRows.length ? 'ok' : cb.certifiedN ? 'warn' : 'bad',
      tip:'Algorithms recording a FIPS or Common Criteria validation level. Absence usually means the generator did not look it up — it is unevidenced, not failed.' });
    const nextCert = cb.certs.find(c => c.days !== null);
    if (nextCert) kpis.push({ k:'Next cert expiry', v:nextCert.days + 'd', d:nextCert.name,
      tone:nextCert.days<45?'bad':nextCert.days<120?'warn':'ok', tip:'Days until the first certificate lapses.' });
  }

  return { sections, composite, gate, blockers, findings, rules, kpis, licMix, sbom, aibom, cbom,
    suppliers, provenance, plan, leverage, projection,
    docs: docs.map(d => ({ slot:d.slot, name:d.name, label:d.label, subject:d.subject, items:d.components.length, tool:d.tool })),
    formats:[...new Set(docs.map(d => d.label))], hasSpdx:docs.some(d => d.format !== 'cdx'),
    generated: NOW.toISOString() };
}

/* ============================================================
   5 · CHARTS
   Hand-drawn SVG and CSS. Each answers a distinct question and
   each degrades gracefully as the input grows.
   ============================================================ */
const polar = (cx,cy,r,deg) => [cx + r*Math.cos(deg*Math.PI/180), cy + r*Math.sin(deg*Math.PI/180)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TONE = { pass:'var(--ok)', warn:'var(--warn)', fail:'var(--bad)', na:'var(--na)' };
const clipTxt = (s,n) => String(s).length > n ? String(s).slice(0,n-1) + '…' : String(s);
const tip = html => ` data-tip="${esc(html)}"`;
const pickAttr = obj => ` data-pick="${esc(JSON.stringify(obj))}"`;
const list = (arr, n=6) => arr.slice(0,n).map(esc).join(', ') + (arr.length > n ? ' +' + (arr.length-n) + ' more' : '');

/* --- composite gauge -------------------------------------------- */
function gauge(value, status){
  const a0 = 180, a1 = 180 + 180*(value/100);
  const [x0,y0] = polar(90,94,66,a0), [x1,y1] = polar(90,94,66,a1), [tx,ty] = polar(90,94,66,360);
  return `<svg viewBox="0 0 180 124" role="img" aria-label="Composite readiness ${value} percent">
    <path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A 66 66 0 1 1 ${tx.toFixed(1)} ${ty.toFixed(1)}"
      fill="none" stroke="#EAEFF7" stroke-width="14" stroke-linecap="round"/>
    <path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A 66 66 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}"
      fill="none" stroke="${TONE[status]}" stroke-width="14" stroke-linecap="round"/>
    <text x="90" y="86" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="-1.5"
      fill="var(--ink)">${value}<tspan font-size="16">%</tspan></text>
    <text x="90" y="118" text-anchor="middle" font-size="8.5" letter-spacing="2.2" fill="var(--ink3)"
      font-family="var(--mono)">COMPOSITE READINESS</text></svg>`;
}

/* --- SBOM · obligation sunburst -----------------------------------
   Q: what does this build oblige us to do on release?
   Three concentric rings read outward: origin, then declared licence,
   then the obligation it actually carries. A three-column ribbon
   diagram tangles the moment more than a handful of nodes exist on
   each side — every ribbon crosses every other. A radial hierarchy
   cannot cross itself: a component's path is always centre-outward.
   Scale: origins and licences beyond the top slices are already pooled
   into "other" upstream in analyse(), so ring cardinality is bounded
   whatever the input size. */
const ORIGIN_PALETTE = ['#2563EB','#7C3AED','#DB2777','#0D9488','#D97706','#0EA5E9','#059669','#64748B'];
function worstOf(classes){ return classes.slice().sort((a,b) => LIC_CLASSES.indexOf(b)-LIC_CLASSES.indexOf(a))[0]; }
function sbArc(cx,cy,r0,r1,a0,a1){
  const span = Math.min(a1-a0, 359.85);
  a1 = a0 + span;
  const large = span > 180 ? 1 : 0;
  const [x0,y0] = polar(cx,cy,r1,a0), [x1,y1] = polar(cx,cy,r1,a1);
  const [x2,y2] = polar(cx,cy,r0,a1), [x3,y3] = polar(cx,cy,r0,a0);
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r1} ${r1} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}
    L ${x2.toFixed(2)} ${y2.toFixed(2)} A ${r0} ${r0} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
}
function obligationSunburst(flow){
  if (!flow.length) return `<div class="none-box">No components to trace.</div>`;
  const total = flow.length;
  const cx = 224, cy = 214;
  const RING = [ [44,98], [98,150], [150,198] ];

  /* tree: root → origin → declared licence → obligation, ordered biggest-first
     at every level so the eye sweeps from most-representative to least. */
  const root = { kids:new Map(), value:0 };
  flow.forEach(f => {
    root.value++;
    const o = root.kids.get(f.a) || root.kids.set(f.a, { name:f.a, value:0, kids:new Map(), members:[] }).get(f.a);
    o.value++; o.members.push(f.name);
    const l = o.kids.get(f.b) || o.kids.set(f.b, { name:f.b, value:0, kids:new Map(), members:[] }).get(f.b);
    l.value++; l.members.push(f.name);
    const b = l.kids.get(f.c) || l.kids.set(f.c, { name:f.c, value:0, members:[] }).get(f.c);
    b.value++; b.members.push(f.name);
  });
  const origins = [...root.kids.values()].sort((x,y) => y.value-x.value);
  const GAP1 = origins.length > 1 ? 0.7 : 0;
  let a = -90;
  origins.forEach((o,oi) => {
    const span = 360*(o.value/total);
    o.a0 = a; o.a1 = a + span - GAP1; o.hue = ORIGIN_PALETTE[oi % ORIGIN_PALETTE.length];
    a += span;
    const lics = [...o.kids.values()].sort((x,y) => y.value-x.value);
    const gap2 = lics.length > 1 ? Math.min(0.55, (o.a1-o.a0)*0.015) : 0;
    let la = o.a0;
    lics.forEach(l => {
      const lspan = (o.a1-o.a0)*(l.value/o.value);
      l.a0 = la; l.a1 = la + lspan - gap2; la += lspan;
      l.cls = worstOf([...l.kids.values()].map(b => OB_CLASS[b.name]));
      const obs = [...l.kids.values()].sort((x,y) => y.value-x.value);
      let ba = l.a0;
      obs.forEach(b => {
        const bspan = (l.a1-l.a0)*(b.value/l.value);
        b.a0 = ba; b.a1 = Math.max(ba+0.05, ba+bspan-(obs.length>1?gap2:0)); ba += bspan;
        b.cls = OB_CLASS[b.name];
      });
      l.obs = obs;
    });
    o.lics = lics;
  });

  const arcNode = (n, r0, r1, fill, extraTip, refKey) => {
    if (n.a1 - n.a0 <= 0.03) return '';
    const mid = (n.a0+n.a1)/2, [dx,dy] = polar(0,0,5,mid).map(v => +v.toFixed(1));
    return `<path class="sb-arc" style="--dx:${dx}px;--dy:${dy}px" d="${sbArc(cx,cy,r0,r1,n.a0,n.a1)}"
      fill="${fill}" stroke="rgba(255,255,255,.85)" stroke-width="1.4"
      ${tip(`<b>${esc(n.name)}</b><br>${n.value} component${n.value>1?'s':''} · ${pct(n.value,total)}% of the build${extraTip||''}`)}
      ${pickAttr({ key:refKey, label:n.name, refs:n.members })}/>`;
  };
  let arcsR1 = '', arcsR2 = '', arcsR3 = '', labelsR1 = '';
  origins.forEach(o => {
    arcsR1 += arcNode(o, RING[0][0], RING[0][1], o.hue, '', 'origin:'+o.name);
    if (o.a1-o.a0 >= 15){
      const mid = (o.a0+o.a1)/2, rMid = (RING[0][0]+RING[0][1])/2;
      const [lx,ly] = polar(cx,cy,rMid,mid);
      labelsR1 += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="11.5"
        font-weight="700" fill="#fff" stroke="rgba(15,23,42,.4)" stroke-width="3" paint-order="stroke"
        style="pointer-events:none">${esc(clipTxt(o.name, Math.max(4,Math.floor((o.a1-o.a0)/6))))}</text>`;
    }
    o.lics.forEach(l => {
      arcsR2 += arcNode(l, RING[1][0], RING[1][1], LIC_COLOR(l.cls),
        `<br>from <b>${esc(o.name)}</b>`, 'lic:'+o.name+':'+l.name);
      l.obs.forEach(b => {
        arcsR3 += arcNode(b, RING[2][0], RING[2][1], LIC_COLOR(b.cls),
          `<br>${esc(o.name)} → ${esc(l.name)}`, 'ob:'+o.name+':'+l.name+':'+b.name);
      });
    });
  });

  /* aggregate legends — precise and clickable, where per-arc outer labels
     would either collide or (for a repeated obligation reached via several
     origins) need to label several disconnected arcs as one entity */
  const obTotals = OBLIGATION_ORDER.map(name => ({
    name, cls:OB_CLASS[name], n: flow.filter(f => f.c === name).length,
    members: flow.filter(f => f.c === name).map(f => f.name) })).filter(x => x.n);
  const obLegend = obTotals.map(x => `<span${pickAttr({ key:'obtot:'+x.name, label:x.name, refs:x.members })}
    ${tip(`<b>${x.n} component${x.n>1?'s':''}</b> · ${pct(x.n,total)}% oblige <i>${esc(x.name)}</i> on release`)}>
    <s style="background:${LIC_COLOR(x.cls)}"></s>${esc(x.name)} <b>${x.n}</b></span>`).join('');
  const originLegend = origins.map(o => `<span${pickAttr({ key:'origin:'+o.name, label:o.name, refs:o.members })}
    ${tip(`${o.value} component${o.value>1?'s':''} from <b>${esc(o.name)}</b>`)}>
    <s style="background:${o.hue}"></s>${esc(clipTxt(o.name,18))} <b>${o.value}</b></span>`).join('');

  const cannotClear = flow.filter(f => f.c === 'Cannot clear').length;
  const ring1total = `<circle cx="${cx}" cy="${cy}" r="${RING[0][0]-6}" fill="url(#gCore)"
      stroke="rgba(255,255,255,.9)" stroke-width="1.5" filter="url(#fSoft)"/>
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="-1.4"
      fill="var(--ink)">${total}</text>
    <text x="${cx}" y="${cy+11}" text-anchor="middle" font-size="8.5" font-family="var(--mono)"
      letter-spacing="1.6" fill="var(--ink3)">COMPONENTS</text>
    ${cannotClear
      ? `<text x="${cx}" y="${cy+27}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--bad)">${cannotClear} cannot clear</text>`
      : `<text x="${cx}" y="${cy+27}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ok)">all traceable</text>`}`;

  const ringKey = `<div class="ringkey">
    <span><i style="background:#94A3B8"></i>origin</span><b>→</b>
    <span><i style="background:var(--lic-strong)"></i>licence</span><b>→</b>
    <span><i style="background:var(--lic-permissive)"></i>obligation</span>
    <em>read outward from the centre</em></div>`;

  return `<svg viewBox="0 0 ${cx*2} ${cy*2+16}" class="sunburst" role="img"
      aria-label="Components traced from origin through licence to release obligation, as a radial hierarchy">
    <defs><radialGradient id="gCore" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#F1F5FB"/></radialGradient></defs>
    ${SVG_DEFS}
    <g filter="url(#fSoft)">${arcsR1}${arcsR2}${arcsR3}</g>
    ${labelsR1}${ring1total}
  </svg>
  ${ringKey}
  <div class="mosleg" style="margin-top:10px">${originLegend}</div>
  <div class="mosleg" style="margin-top:7px;padding-top:9px;border-top:1px dashed var(--line-soft)">${obLegend}</div>`;
}

/* --- SBOM · licence concentration (Pareto) -----------------------
   Q: how many distinct licences actually drive the estate?
   Scale: shows the head in full and collapses the tail into one row,
   while the cumulative marker still describes the whole population. */
function pareto(ranked, total, cap = 10){
  const head = ranked.slice(0, cap), tail = ranked.slice(cap);
  const max = ranked[0] ? ranked[0].n : 1;
  const rows = head.map(r => `
    <div class="prow"${pickAttr({ key:'lic:'+r.name, label:r.name, refs:r.members })}
      ${tip(`<b>${esc(r.name)}</b><br>${r.n} component${r.n>1?'s':''} · ${pct(r.n,total)}% of the build<br>${LIC_LABEL[r.cls]}<br><i>${list(r.members)}</i>`)}>
      <span class="plab"><s style="background:${LIC_COLOR(r.cls)}"></s>${esc(clipTxt(r.name,26))}</span>
      <span class="ptrk"><i style="width:${100*r.n/max}%;background:${LIC_COLOR(r.cls)}"></i>
        <span class="cum" style="left:${Math.min(99,r.cum)}%"></span></span>
      <span class="pn">${r.n}</span><span class="pc">${r.cum}%</span>
    </div>`).join('');
  const tailRow = tail.length ? `
    <div class="prow"${tip(`<b>${tail.length} further licence expressions</b><br>${tail.reduce((a,t)=>a+t.n,0)} components between them<br><i>${list(tail.map(t=>t.name),8)}</i>`)}>
      <span class="plab" style="color:var(--ink3)"><s style="background:var(--na)"></s>${tail.length} more licences</span>
      <span class="ptrk"><i style="width:${100*tail.reduce((a,t)=>a+t.n,0)/max}%;background:var(--na);opacity:.5"></i></span>
      <span class="pn" style="color:var(--ink3)">${tail.reduce((a,t)=>a+t.n,0)}</span><span class="pc">100%</span>
    </div>` : '';
  return `<div class="pareto">${rows}${tailRow}</div>`;
}

/* --- SBOM · gap combinations (UpSet-style) -----------------------
   Q: which evidence gaps occur together, and how many components
   sit in each combination? Scale: rows are combinations, not
   components, so the row count is bounded by 2^attributes. */
function gapCombos(combos, attrs, total, cap = 8){
  const shown = combos.slice(0, cap);
  const max = Math.max(...combos.map(c => c.n), 1);
  const cols = `grid-template-columns:${attrs.length*20 + 20}px minmax(0,150px) minmax(0,1fr) 46px`;
  const rows = shown.map(c => {
    const clean = c.key === '__none__';
    const label = clean ? 'complete evidence' : c.set.map(k => (attrs.find(a=>a.k===k)||{}).label).join(' + ');
    return `<div class="uprow" style="${cols}"
      ${pickAttr({ key:'gap:'+c.key, label:clean ? 'components with complete evidence' : 'missing ' + label, refs:c.members })}
      ${tip(`<b>${c.n} component${c.n>1?'s':''}</b> · ${pct(c.n,total)}%<br>${clean ? 'nothing missing' : 'missing ' + esc(label)}<br><i>${list(c.members)}</i>`)}>
      <span class="updots">${attrs.map(a => `<i class="${c.set.includes(a.k) ? 'on' : ''}"></i>`).join('')}</span>
      <span class="uplab" style="${clean ? 'color:var(--ok)' : ''}">${esc(clean ? 'nothing missing' : 'missing ' + label)}</span>
      <span class="upbar"><i style="width:${100*c.n/max}%;background:${clean ? 'var(--ok)' : c.set.length>2 ? 'var(--bad)' : 'var(--warn)'}"></i></span>
      <span class="upn">${c.n}</span></div>`;
  }).join('');
  const key = `<div class="upkey">${attrs.map((a,i) => `<span><b>${i+1}</b> ${a.label}</span>`).join('')}
    <span style="margin-left:auto">dots read left to right in that order · filled means missing</span></div>`;
  const more = combos.length > cap ? `<div class="upkey"><span>${combos.length-cap} further combination(s) not shown, covering ${combos.slice(cap).reduce((a,c)=>a+c.n,0)} components</span></div>` : '';
  return `<div class="upset">${rows}</div>${key}${more}`;
}

/* --- SBOM · vulnerability ageing ---------------------------------
   Q: how long have these been sitting there?
   Severity says how bad, triage says whether anyone looked; neither
   says how long we have been carrying it. Scale: a dot per record on
   a log age axis, which stays legible into the hundreds. */
function vulnAgeing(cve){
  const dated = cve.rows.filter(v => v.age !== null);
  if (!dated.length) return `<div class="none-box">No publication dates recorded on these vulnerability records, so ageing cannot be computed. ${cve.open} of ${cve.total} are open.</div>`;
  const W=1000, H=250, L=70, R=40, T=26, B=52;
  const lanes = SEV.filter(s => dated.some(v => v.sev === s));
  const laneH = (H-T-B)/lanes.length;
  const maxAge = Math.max(90, ...dated.map(v => v.age));
  const x = d => L + (W-L-R) * Math.log10(1+d) / Math.log10(1+maxAge);
  const SLA = [30,90,365];
  const bands = `<rect x="${x(90)}" y="${T}" width="${W-R-x(90)}" height="${H-T-B}" fill="var(--bad)" opacity=".05"/>`;
  const ticks = [0,7,30,90,365,730,1825].filter(d => d <= maxAge).map(d =>
    `<line x1="${x(d)}" y1="${T}" x2="${x(d)}" y2="${H-B}" stroke="#E4EAF3" stroke-dasharray="2 3"/>
     <text x="${x(d)}" y="${H-B+16}" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--ink3)">${
       d===0?'today':d<365?d+'d':(d/365)+'y'}</text>`).join('');
  const slaMark = `<line x1="${x(90)}" y1="${T-6}" x2="${x(90)}" y2="${H-B}" stroke="var(--bad)" stroke-width="1.5" opacity=".55"/>
    <text x="${x(90)+6}" y="${T-10}" font-size="10" font-family="var(--mono)" fill="var(--bad)">90-DAY LINE</text>`;
  const laneLabels = lanes.map((sv,i) =>
    `<text x="${L-10}" y="${(T+laneH*i+laneH/2+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink2)">${sv}</text>
     <line x1="${L}" y1="${(T+laneH*(i+1)).toFixed(1)}" x2="${W-R}" y2="${(T+laneH*(i+1)).toFixed(1)}" stroke="#F1F5F9"/>`).join('');
  const dots = lanes.flatMap((sv,i) => {
    const items = dated.filter(v => v.sev === sv);
    return items.map((v,j) => {
      const cy = T + laneH*i + laneH/2 + ((j % 5) - 2) * Math.min(9, laneH/6);
      const rr = v.epss !== null ? 4 + v.epss*6 : (v.open ? 6 : 5);
      return `<g${pickAttr({ key:'ref:'+v.target, label:v.id, refs:[v.target] })}
        ${tip(`<b>${esc(v.id)}</b> · ${v.sev}${v.score ? ' · CVSS ' + v.score : ''}${v.epss !== null ? ' · EPSS ' + Math.round(v.epss*100) + '%' : ''}${v.kev ? ' · <b>known exploited</b>' : ''}<br>${esc(v.target)}<br>published ${v.age} days ago<br>${v.open ? '<i>still open</i>' : 'triaged: ' + esc(v.state)}`)}>
        ${v.kev ? `<circle cx="${x(v.age).toFixed(1)}" cy="${cy.toFixed(1)}" r="${(rr+4).toFixed(1)}" fill="none" stroke="var(--bad)" stroke-width="1.6" opacity=".8"/>` : ''}
        <circle cx="${x(v.age).toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}"
          fill="${v.open ? 'var(--sev-'+v.sev+')' : '#fff'}" stroke="var(--sev-${v.sev})" stroke-width="${v.open ? 1 : 2}"
          opacity="${v.open ? .9 : .8}"/></g>`;
    });
  }).join('');
  const anyKev = dated.some(v => v.kev), anyEpss = dated.some(v => v.epss !== null);
  const key = `<text x="${L}" y="${H-6}" font-size="10.5" fill="var(--ink3)">● still open</text>
    <text x="${L+92}" y="${H-6}" font-size="10.5" fill="var(--ink3)">○ triaged</text>
    ${anyKev ? `<text x="${L+178}" y="${H-6}" font-size="10.5" fill="var(--bad)">◎ known exploited</text>` : ''}
    ${anyEpss ? `<text x="${L+320}" y="${H-6}" font-size="10.5" fill="var(--ink3)">dot size = EPSS</text>` : ''}
    <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10.5" fill="var(--ink3)">age since publication, log scale →</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vulnerability age by severity">
    ${bands}${ticks}${laneLabels}${slaMark}${dots}${key}</svg>`;
}

function cveExposure(cve, cap = 12){
  const stateLabel = { not_affected:'Not affected', resolved:'Resolved', exploitable:'Exploitable',
    false_positive:'False positive', in_triage:'In triage', untriaged:'Untriaged' };
  const good = s => /not_affected|resolved|false_positive/.test(s);
  const rows = cve.rows.slice(0,cap).map(v => `
    <div class="cverow"${pickAttr({ key:'ref:'+v.target, label:v.id, refs:[v.target] })}
      ${tip(`<b>${esc(v.id)}</b><br>${v.sev}${v.score ? ' · CVSS ' + v.score : ' · no score recorded'}<br>affects ${esc(v.target)}${v.matched ? '' : ' <i>(unmatched)</i>'}${v.justification ? '<br>' + esc(v.justification) : ''}`)}>
      <span class="cid">${esc(v.id)}</span>
      <span class="ctarget">${esc(clipTxt(v.target,26))}</span>
      <span class="cbar"><i style="width:${v.score ? v.score*10 : ({critical:95,high:75,medium:50,low:25})[v.sev]}%;background:var(--sev-${v.sev})"></i></span>
      <span class="cscore">${v.score ?? '—'}</span>
      <span class="cstate ${good(v.state)?'ok':'open'}">${stateLabel[v.state] || v.state}</span></div>`).join('');
  const more = cve.rows.length > cap
    ? `<div class="upkey"><span>${cve.rows.length-cap} further record(s) — the issue register below lists them all</span></div>` : '';
  return `<div class="cvehead"><span>CVE</span><span>Affects</span><span>Severity</span><span></span><span>Analysis</span></div>${rows}${more}`;
}

/* --- SBOM · supplier concentration -------------------------------
   Q: how much of the estate rides on how few upstreams, and are those
   upstreams the ones with unresolved terms? */
function supplierConcentration(sup){
  const rows = sup.rows.map(s => {
    const cleared = s.mix.permissive, blocked = s.mix.undeclared;
    const oblig = s.n - cleared - blocked;
    return `<div class="prow"${pickAttr({ key:'sup:'+s.name, label:s.name, refs:s.members })}
      ${tip(`<b>${esc(s.name)}</b><br>${s.n} component${s.n>1?'s':''} · ${pct(s.n,sup.total)}% of the estate<br>${cleared} attribution-only · ${oblig} with obligations · ${blocked} cannot clear`)}>
      <span class="plab"><s style="background:${s.name==='unattributed'?'var(--na)':'var(--brand)'}"></s>${esc(clipTxt(s.name,24))}</span>
      <span class="ptrk" style="display:flex">
        ${cleared ? `<i style="width:${100*cleared/sup.rows[0].n}%;background:var(--lic-permissive)"></i>` : ''}
        ${oblig ? `<i style="width:${100*oblig/sup.rows[0].n}%;background:var(--lic-strong)"></i>` : ''}
        ${blocked ? `<i style="width:${100*blocked/sup.rows[0].n}%;background:var(--lic-undeclared)"></i>` : ''}
      </span>
      <span class="pn">${s.n}</span><span class="pc">${pct(s.n,sup.total)}%</span></div>`;
  }).join('');
  const tail = sup.tail.length ? `<div class="prow"${tip(`<b>${sup.tail.length} further upstreams</b><br>${sup.tail.reduce((a,s)=>a+s.n,0)} components between them`)}>
      <span class="plab" style="color:var(--ink3)"><s style="background:var(--na)"></s>${sup.tail.length} more upstreams</span>
      <span class="ptrk"><i style="width:${100*sup.tail.reduce((a,s)=>a+s.n,0)/sup.rows[0].n}%;background:var(--na);opacity:.45"></i></span>
      <span class="pn" style="color:var(--ink3)">${sup.tail.reduce((a,s)=>a+s.n,0)}</span><span class="pc"></span></div>` : '';
  const key = `<div class="upkey"><span><s style="background:var(--lic-permissive);width:9px;height:9px;border-radius:2px;display:inline-block"></s> attribution only</span>
    <span><s style="background:var(--lic-strong);width:9px;height:9px;border-radius:2px;display:inline-block"></s> obligations attached</span>
    <span><s style="background:var(--lic-undeclared);width:9px;height:9px;border-radius:2px;display:inline-block"></s> cannot clear</span></div>`;
  return `<div class="pareto">${rows}${tail}</div>${key}`;
}

/* --- SBOM · supplier bubble cluster --------------------------------
   Q: who actually stands behind this build?
   A ranked bar answers "how much"; a packed cluster answers "how many
   distinct hands, and is one of them carrying the whole thing". Area is
   component count, fill is that upstream's own risk mix — the same
   sequential ramp as the origin treemap, so the two panels read as one
   vocabulary rather than two competing colour systems. Placement is an
   approximate spiral pack: good enough at the 6–9 bubbles this ever
   needs to show, and never asked to be exact — the numbers on each
   bubble and the ranked list beneath it carry the precision. */
function supplierBubbles(sup){
  const items = sup.rows.map(s => ({ name:s.name, n:s.n, mix:s.mix, members:s.members }));
  if (sup.tail.length) items.push({ name:sup.tail.length + ' more upstream' + (sup.tail.length>1?'s':''),
    n:sup.tail.reduce((a,s) => a+s.n,0),
    mix:sup.tail.reduce((m,s) => { LIC_CLASSES.forEach(k => m[k]=(m[k]||0)+s.mix[k]); return m; },
      Object.fromEntries(LIC_CLASSES.map(k => [k,0]))),
    members:sup.tail.flatMap(s => s.members), tail:true });
  if (!items.length) return '';
  const maxN = Math.max(...items.map(i => i.n));
  const RMIN = 16, RMAX = 78;
  items.forEach(i => { i.r = RMIN + (RMAX-RMIN)*Math.sqrt(i.n/maxN); });
  items.sort((a,b) => b.r-a.r);
  items.forEach((it,idx) => {
    if (!idx){ it.x=0; it.y=0; return; }
    for (let t=1, found=false; t<5000 && !found; t++){
      const ang = t*0.41, rad = 2.5*Math.sqrt(t);
      const x = rad*Math.cos(ang), y = rad*Math.sin(ang);
      if (items.slice(0,idx).every(p => Math.hypot(p.x-x,p.y-y) >= p.r+it.r+3)){ it.x=x; it.y=y; found=true; }
      if (t === 4999){ it.x = idx*(it.r+8); it.y = RMAX*1.6; }
    }
  });
